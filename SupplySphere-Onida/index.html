  :root{ --rv-bg:#F2F3F6; --rv-surface:#FFFFFF; --rv-border:#E1E4EC; --rv-text:#111827; --rv-text-dim:#4B5468; --rv-accent:#2563EB; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{background:var(--rv-bg); color:var(--rv-text); font-family:'Plex Body','Segoe UI',system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  .review-wrap{max-width:1480px;margin:0 auto;padding:26px 20px 60px;}
  .review-header h1{font-size:21px;margin:0;font-weight:800;letter-spacing:-.01em;font-family:'Sora Display',sans-serif;}
  .review-header .sub{color:var(--rv-text-dim);font-size:12.5px;margin-top:3px;}
  .review-banner{background:var(--rv-surface); border:1px solid var(--rv-border); border-left:3px solid var(--rv-accent); border-radius:8px; padding:12px 16px; margin:14px 0 14px; font-size:12.5px; color:var(--rv-text-dim); line-height:1.6;}
  .review-banner b{color:var(--rv-text);}
  .progress-row{display:flex;align-items:center;gap:12px;margin:10px 0 14px;flex-wrap:wrap;}
  .progress-track{flex:1;min-width:180px;height:5px;background:var(--rv-border);border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--rv-accent);border-radius:99px;transition:width .25s ease;}
  .progress-label{font-size:11.5px;color:var(--rv-text-dim);white-space:nowrap;}
  .jump-chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
  .jump-chip{font-size:11px; padding:5px 10px; border-radius:99px; border:1px solid var(--rv-border); background:var(--rv-surface); color:var(--rv-text-dim); cursor:pointer; font-family:inherit;}
  .jump-chip.active{background:var(--rv-text); color:#fff; border-color:var(--rv-text);}
  .frame{border:1px solid var(--rv-border); border-radius:14px; overflow:hidden; background:#0B0F1A; box-shadow:0 1px 2px rgba(0,0,0,.04), 0 10px 30px -12px rgba(0,0,0,.2);}
  .frame-toolbar{display:flex; align-items:center; justify-content:space-between; padding:8px 14px; background:var(--rv-surface); border-bottom:1px solid var(--rv-border);}
  .frame-toolbar .dots{display:flex;gap:6px;}
  .frame-toolbar .dots span{width:9px;height:9px;border-radius:50%;background:var(--rv-border);}
  .frame-toolbar .fname{font-size:12px;color:var(--rv-text-dim);}
  .nav-btns{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;}
  .navbtn{font-family:inherit; font-size:12.5px; font-weight:600; padding:9px 16px; border-radius:8px; border:1px solid var(--rv-border); background:var(--rv-surface); color:var(--rv-text); cursor:pointer;}
  .navbtn:hover{border-color:var(--rv-accent); color:var(--rv-accent);}
  .navbtn:disabled{opacity:.35; cursor:default;}
  .screen-title-row{display:flex;align-items:baseline;gap:10px;margin:18px 0 6px;flex-wrap:wrap;}
  .screen-title-row .idx{font-size:11.5px;color:var(--rv-accent);font-weight:700;}
  .screen-title-row h2{font-size:16px;margin:0;font-weight:700;}
  .screen-note{font-size:12px;color:var(--rv-text-dim);margin:0 0 12px;max-width:none;line-height:1.55;}
  .screen-note b{color:var(--rv-text);}

  /* ===== App shell — Spectrum G + Electric Blue brand, Sora + Plex, +1pt over v7 ===== */
  .app-shell{
    --bg:#F6F7FA; --surface:#FFFFFF; --card:#FFFFFF; --card2:#F4F5F7; --border:#E4E6EC; --border-lt:#D6D9E2;
    --ink:#111827; --ink-dim:#374151; --ink-muted:#5B6472;
    --brand:#2563EB; --brand-hover:#1D4ED8; --brand-tint:#EAF0FE;
    --yellow:#F5B301; --yellow-tint:#FDF3D6;
    --c-teal:#0D9488; --c-amber:#D97706; --c-rose:#E11D48; --c-violet:#7C3AED; --c-emerald:#059669;
    --success:#15803D; --warning:#8A6D00; --danger:#D6392B;
    background:var(--bg); color:var(--ink); font-size:13.5px; line-height:1.55;
    height:100vh; display:flex; flex-direction:column; position:relative;
    font-family:'Plex Body','Segoe UI',system-ui,sans-serif;
  }
  .app-shell *{box-sizing:border-box;}
  .app-shell button, .app-shell input, .app-shell select{font-family:inherit;}
  @media (prefers-reduced-motion: reduce){ .app-shell *{transition:none !important; animation:none !important;} }

  .disp{font-family:'Sora Display',sans-serif;}
  .brand-mark{display:flex;align-items:center;gap:8px;font-family:'Sora Display',sans-serif;font-weight:800;font-size:16px;color:var(--ink);white-space:nowrap;}
  .brand-mark .dot{color:var(--brand);}
  .brand-mark .pname{color:var(--ink-muted);font-weight:600;font-size:13px;font-family:'Plex Body',sans-serif;}

  .topbar{height:58px;flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--border);background:var(--surface);}
  .tenant-pill{height:32px;background:var(--card2);border:1px solid var(--border-lt);border-radius:8px;padding:0 12px;display:flex;align-items:center;font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;}
  .searchbar{width:240px;height:32px;background:var(--card2);border:1px solid var(--border-lt);border-radius:8px;padding:0 10px;display:flex;align-items:center;gap:7px;color:var(--ink-muted);font-size:12.5px;margin-right:auto;}
  .top-actions{display:flex;align-items:center;gap:10px;flex:0 0 auto;}

let narrationEnabled = false;
let narrationVoice = null;
function pickNarrationVoice(){
  if(!('speechSynthesis' in window)) return;
  const voices = speechSynthesis.getVoices();
  narrationVoice = voices.find(v=>/en-IN/i.test(v.lang))
    || voices.find(v=>/en-GB|en-US/i.test(v.lang) && /female/i.test(v.name))
    || voices.find(v=>/^en/i.test(v.lang))
    || voices[0] || null;
}
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = pickNarrationVoice;
  pickNarrationVoice();
}
function speakNarration(key){
  if(!narrationEnabled || !('speechSynthesis' in window)) return;
  const text = SCREEN_NARRATION[key];
  speechSynthesis.cancel();
  if(!text) return;
  const u = new SpeechSynthesisUtterance(text);
  if(narrationVoice) u.voice = narrationVoice;
  u.rate = 0.98;
  u.onstart = ()=>setNarrationSpeaking(true);
  u.onend = ()=>setNarrationSpeaking(false);
  u.onerror = ()=>setNarrationSpeaking(false);
  speechSynthesis.speak(u);
}
function setNarrationSpeaking(isSpeaking){
  const fab = document.getElementById('narrationFab');
  if(fab) fab.classList.toggle('speaking', isSpeaking);
}
function updateNarrationLabel(){
  const label = document.getElementById('narrationLabel');
  if(label) label.textContent = narrationEnabled ? 'Narrating — click to mute' : 'AI Narration — click to start';
}
function toggleNarration(){
  if(!('speechSynthesis' in window)){ alert('Voice narration is not supported in this browser — try Chrome or Edge.'); return; }
  narrationEnabled = !narrationEnabled;
  if(!narrationEnabled){
    speechSynthesis.cancel();
    setNarrationSpeaking(false);
  } else {
    speakNarration(SCREENS[current].key);
  }
  updateNarrationLabel();
}

function render(i){
  current = i;
  const s = SCREENS[i];
  stage.innerHTML = shellChrome(s.key, BODIES[s.key]());
  const fab = document.getElementById('sphereFab');
  if(fab){ fab.onclick = ()=>document.getElementById('spherePanel').classList.toggle('open'); }
  const close = document.getElementById('sphereClose');
  if(close){ close.onclick = ()=>document.getElementById('spherePanel').classList.remove('open'); }
  updateNarrationLabel();
  if(narrationEnabled) speakNarration(s.key);
  fitLoginHeadline();
  window.scrollTo(0,0);
}
function go(i){ current = Math.max(0,Math.min(SCREENS.length-1,i)); render(current); }

/* scales the login h1 so it always spans exactly as wide as the grid below it (step cards...sign-in card), regardless of viewport width */
function fitLoginHeadline(){
  const h1 = document.querySelector('.login-headline h1');
  const grid = document.querySelector('.login-grid');
  if(!h1 || !grid) return;
  requestAnimationFrame(()=>{
    const targetWidth = grid.getBoundingClientRect().width;
    const currentWidth = h1.getBoundingClientRect().width;
    if(!targetWidth || !currentWidth) return;
    const currentSize = parseFloat(getComputedStyle(h1).fontSize);
    const newSize = Math.max(28, Math.min(72, currentSize * (targetWidth / currentWidth)));
    h1.style.fontSize = newSize + 'px';
  });
}
window.addEventListener('resize', ()=>{ if(SCREENS[current] && SCREENS[current].key==='login') fitLoginHeadline(); });

/* ============ helper renderers ============ */
function kpi(label,value,delta,cls,onclick){ return `<div class="kpi ${cls||''}${onclick?' clickable':''}"${onclick?` onclick="${onclick}"`:''}><div class="l">${label}</div><div class="v">${value}</div>${delta?`<div class="d">${delta}</div>`:''}</div>`; }
function table(headers, rows){
  const th = headers.map(h=>`<th${h.num?' class="num"':''}>${h.label!==undefined?h.label:h}</th>`).join('');
  const tr = rows.map(r=>`<tr>${r.map((c,ci)=>`<td${headers[ci]&&headers[ci].num?' class="num"':''}>${c}</td>`).join('')}</tr>`).join('');
  return `<table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`;
}
function chip(text,type){ return `<span class="chip ${type}">${text}</span>`; }
function factsheet(rows){
  const tr = rows.map(r=>`<tr><td class="dim" style="width:34%;font-weight:700;">${r[0]}</td><td>${r[1]}</td></tr>`).join('');
  return `<table>${tr}</table>`;
}
function card(title, hint, body, extraHead){

}

  `;
}
function wizardSteps(activeIdx){
  const labels = ['Name &amp; Category','Variants','Raw Materials (BOM)','Suppliers','Review &amp; Confirm'];
  return `<div class="wizard-steps">${labels.map((l,i)=>{
    const n=i+1; const cls = n<activeIdx?'done':(n===activeIdx?'active':'');
    const line = i<labels.length-1?'<span class="ws-line"></span>':'';
    return `<div class="ws-step ${cls}"><span class="ws-n">${n<activeIdx?'&check;':n}</span><span class="ws-label">${l}</span></div>${line}`;
  }).join('')}</div>`;
}

resources: ()=>`
  <div class="page-head">
    <div><h3>Resources &amp; Demo</h3><div class="desc">The live demo, product walkthrough, screenshots, and process manual in one place — for a new user, or a board member, to self-serve an overview.</div></div>
  </div>
  <div class="grid" style="grid-template-columns:repeat(3,1fr);">
    ${card('Live Demo', 'Taiwan Strait Chip Crisis', `
      <div style="background:#FDF3F2;border:1px solid #F3C9C5;border-radius:11px;height:170px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;cursor:pointer;" onclick="jumpTo('demo-taiwan')">
        <div style="width:52px;height:52px;border-radius:50%;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:center;">${icon('warning',24)}</div>
        <div style="font-size:12.5px;font-weight:700;color:var(--ink-dim);text-align:center;padding:0 10px;">The full workflow, told through a real 2026 crisis</div>
      </div>
      <div class="btn primary sm" style="margin-top:10px;width:100%;justify-content:center;" onclick="jumpTo('demo-taiwan')">Open live demo</div>`)}
    ${card('Product Walkthrough Video', '4 min', `
      <div style="background:var(--card2);border:1px solid var(--border);border-radius:11px;height:170px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;cursor:pointer;">
        <div style="width:52px;height:52px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;">${icon('play',26)}</div>
        <div style="font-size:12.5px;font-weight:700;color:var(--ink-dim);text-align:center;padding:0 10px;">Watch: "From signal to shelf" — the full workflow, 4 minutes</div>
      </div>
      <div class="btn primary sm" style="margin-top:10px;width:100%;justify-content:center;">Play video</div>`)}
    ${card('Process Manual', 'PDF, 18 pages', `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--card2);border:1px solid var(--border);border-radius:11px;height:170px;text-align:center;padding:0 14px;">
        <div style="width:52px;height:52px;border-radius:50%;background:#fff;border:1.5px solid var(--brand);color:var(--brand);display:flex;align-items:center;justify-content:center;">${icon('book',24)}</div>
        <div style="font-size:12.5px;font-weight:700;color:var(--ink-dim);">SupplySphere AI — Operating Manual &middot; My Products &rarr; product profile, step by step</div>
      </div>
      <div class="btn sm" style="margin-top:10px;width:100%;justify-content:center;">Download PDF</div>`)}
  </div>
  <div class="card" style="margin-top:14px;">
    <div class="card-head"><h4>Screenshots</h4><span class="hint">key screens, for a quick visual overview</span></div>
    <div class="grid" style="grid-template-columns:repeat(4,1fr);">
      ${['My Products','Televisions Overview','Financial Impact','Live Demo — Taiwan Strait'].map(t=>`
        <div>
          <div style="background:var(--card2);border:1px dashed var(--border-lt);border-radius:10px;height:90px;display:flex;align-items:center;justify-content:center;color:var(--ink-muted);">${icon('image',22)}</div>
          <div style="font-size:11px;font-weight:600;margin-top:6px;text-align:center;color:var(--ink-dim);">${t}</div>
        </div>`).join('')}
    </div>
  </div>
`,

settings: ()=>{
  const tabs = [['notifications','Notifications &amp; Alerts'],['appearance','Appearance'],['users','Users &amp; Roles'],['branding','Tenant Branding']];
  const tabRow = `<div class="tab-row">${tabs.map(([k,l])=>`<span class="tab${k===settingsTab?' active':''}" onclick="setSettingsTab('${k}')">${l}</span>`).join('')}</div>`;
  const bodies = {
    notifications: card('Alert Channels', null, `${table(
      [{label:'Channel'},{label:'Critical'},{label:'Warning'},{label:'Advisory'}],
      [
        ['Email',chip('On','success'),chip('On','success'),chip('On','success')],
        ['SMS',chip('On','success'),chip('On','success'),chip('Off','neutral')],
        ['In-app + Sphere',chip('On','success'),chip('On','success'),chip('On','success')],
        ['WhatsApp Business',chip('On','success'),chip('Off','neutral'),chip('Off','neutral')],
      ]
    )}`),
    appearance: card('Appearance', null, `
      ${table(
        [{label:'Setting'},{label:'Value'}],
        [
          ['Theme','Light (default) &middot; Dark not yet available in this prototype'],
          ['Display density','Comfortable'],
          ['Font','Sora (display) + IBM Plex Sans (body)'],
          ['Accent color','Electric Blue &middot; reserved for navigation &amp; primary actions'],
        ]
      )}`),
    users: card('Users &amp; Roles', null, `${table(
      [{label:'User'},{label:'Role'},{label:'Status'}],
      [
        ['Mithil Pattani','Owner / MD',chip('Active','success')],
        ['Rhea Patel','Procurement Head',chip('Active','success')],
        ['Arvind Menon','Manufacturing / Factory Head',chip('Active','success')],
      ]
    )}`),
    branding: card('Tenant Branding', null, `
      ${table(
        [{label:'Setting'},{label:'Value'}],
        [
          ['Tenant name','Onida - Consumer Electronics Group'],
          ['Logo','SUCH_Logo.png &middot; uploaded'],
          ['Primary brand color','Electric Blue &middot; #2563EB'],
          ['Subdomain','onida.supplysphere.ai'],
        ]
      )}`),
  };
  return `
  <div class="page-head">
    <div><h3>Settings</h3><div class="desc">Theme, notifications &amp; alerts, users &amp; roles, tenant branding.</div></div>
  </div>
  ${tabRow}
  ${bodies[settingsTab]}
`;
},

};

render(0);
</script>
