<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GST Radar</title>
</head>
<body>
<style>
  :root{
    --ink:#2A2A2A;
    --paper:#F3F6FA;
    --surface:#FFFFFF;
    --line:#DEE4EA;
    --line-strong:#C7D0D9;
    --muted:#63707B;

    --accent:#008DD0;
    --accent-ink:#2957A4;
    --accent-fg:#FFFFFF;
    --accent-soft:#E1F1FA;
    --focus:#008DD0;

    --st-open:#2957A4;
    --st-progress:#F87C09;
    --st-responded:#7C5295;
    --st-closed:#1E8E5A;
    --st-escalated:#D33F3F;
    --st-fg:#FFFFFF;

    --review-bg:#EDF1F4;
    --review-fg:#4A5560;
    --review-line:#D7DEE4;

    --hol-national:#B8860B;
    --hol-state:#0E8A82;
    --custom-event:#8B3FA6;

    --shadow-card: 0 1px 2px rgba(42,42,42,0.08), 0 1px 1px rgba(42,42,42,0.04);
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    --font-mono: "Cascadia Code", ui-monospace, "SF Mono", Consolas, "Roboto Mono", monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#EDEFF1; --paper:#15191D; --surface:#1D2227; --line:#2C333A; --line-strong:#3A434B; --muted:#8B98A3;
      --accent:#39ABE0; --accent-ink:#8FC6ED; --accent-fg:#0B2233; --accent-soft:#1B3B4C; --focus:#39ABE0;
      --st-open:#5F8FD1; --st-progress:#FF9B3E; --st-responded:#A57FC4; --st-closed:#3FAE7C; --st-escalated:#E2665F; --st-fg:#14181C;
      --review-bg:#1E252B; --review-fg:#AAB6C0; --review-line:#2E363E;
      --hol-national:#E0B24A; --hol-state:#3FC2B8; --custom-event:#C68EDB;
      --shadow-card: 0 1px 2px rgba(0,0,0,0.5), 0 1px 1px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --ink:#EDEFF1; --paper:#15191D; --surface:#1D2227; --line:#2C333A; --line-strong:#3A434B; --muted:#8B98A3;
    --accent:#39ABE0; --accent-ink:#8FC6ED; --accent-fg:#0B2233; --accent-soft:#1B3B4C; --focus:#39ABE0;
    --st-open:#5F8FD1; --st-progress:#FF9B3E; --st-responded:#A57FC4; --st-closed:#3FAE7C; --st-escalated:#E2665F; --st-fg:#14181C;
    --review-bg:#1E252B; --review-fg:#AAB6C0; --review-line:#2E363E;
    --hol-national:#E0B24A; --hol-state:#3FC2B8; --custom-event:#C68EDB;
    --shadow-card: 0 1px 2px rgba(0,0,0,0.5), 0 1px 1px rgba(0,0,0,0.35);
  }
  :root[data-theme="light"]{
    --ink:#2A2A2A; --paper:#F3F6FA; --surface:#FFFFFF; --line:#DEE4EA; --line-strong:#C7D0D9; --muted:#63707B;
    --accent:#008DD0; --accent-ink:#2957A4; --accent-fg:#FFFFFF; --accent-soft:#E1F1FA; --focus:#008DD0;
    --st-open:#2957A4; --st-progress:#F87C09; --st-responded:#7C5295; --st-closed:#1E8E5A; --st-escalated:#D33F3F; --st-fg:#FFFFFF;
    --review-bg:#EDF1F4; --review-fg:#4A5560; --review-line:#D7DEE4;
    --hol-national:#B8860B; --hol-state:#0E8A82; --custom-event:#8B3FA6;
    --shadow-card: 0 1px 2px rgba(42,42,42,0.08), 0 1px 1px rgba(42,42,42,0.04);
  }

  *{box-sizing:border-box;}
  .app{font-family:var(--font-ui); background:var(--paper); color:var(--ink); min-height:100vh; line-height:1.45;}
  .app button, .app select, .app textarea, .app input{ font-family:inherit; }
  h1,h2,h3{text-wrap:balance; margin:0;}
  button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--focus); outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  .login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:
      radial-gradient(1100px 520px at 15% -10%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%),
      var(--paper);
  }
  .login-card{width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow-card); padding:32px 30px;}
  .login-brand{display:flex; align-items:center; gap:9px; margin-bottom:26px;}
  .login-brand .dot{width:9px; height:9px; border-radius:50%; background:var(--accent);}
  .login-brand-name{font-weight:700; font-size:17px; color:var(--accent); letter-spacing:-0.01em;}
  .login-brand-sub{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:2px;}
  .login-card h1{font-size:19px; font-weight:650; margin-bottom:4px;}
  .login-card p.sub{font-size:13px; color:var(--muted); margin:0 0 22px;}
  .field{display:flex; flex-direction:column; gap:5px; margin-bottom:14px;}
  .field label{font-size:11.5px; font-weight:650; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  .field input{padding:10px 12px; border:1px solid var(--line-strong); border-radius:8px; background:var(--paper); color:var(--ink); font-size:13.5px;}
  .login-foot{margin-top:16px; font-size:11.5px; color:var(--muted); line-height:1.5;}

  .shell{display:flex; min-height:100vh;}
  .sidebar{width:224px; flex:none; background:var(--surface); border-right:1px solid var(--line); padding:22px 14px 16px; display:flex; flex-direction:column; gap:18px; position:sticky; top:0; height:100vh; overflow-y:auto;}
  .brand{display:flex; align-items:center; gap:9px; padding:0 8px 4px; cursor:pointer; background:none; border:none; text-align:left; width:100%;}
  .brand .dot{width:9px; height:9px; border-radius:50%; background:var(--accent); flex:none; animation:ping 2.4s ease-out infinite;}
  @keyframes ping{
    0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent);}
    70%{box-shadow:0 0 0 8px transparent;}
    100%{box-shadow:0 0 0 0 transparent;}
  }
  .brand-text{display:flex; flex-direction:column; line-height:1.1;}
  .brand-name{font-weight:700; font-size:16px; color:var(--accent); letter-spacing:-0.01em;}
  .brand-sub{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:2px;}

  .nav-group{display:flex; flex-direction:column; gap:2px;}
  .nav-group-label{font-size:10.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; padding:10px 10px 4px;}
  .nav-item{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; font-size:13.5px; font-weight:600; color:var(--muted); cursor:pointer; border:none; background:none; text-align:left; width:100%;}
  .nav-item:hover{background:var(--paper); color:var(--ink);}
  .nav-item.active{background:var(--accent-soft); color:var(--accent-ink);}
  .nav-icon{width:17px; height:17px; flex:none; display:flex; align-items:center; justify-content:center;}
  .nav-icon svg{width:16px; height:16px;}
  .nav-badge{margin-left:auto; font-size:10.5px; font-weight:700; background:var(--st-escalated); color:#fff; border-radius:999px; padding:1px 6px; font-variant-numeric:tabular-nums;}
  .sidebar-foot{margin-top:auto; padding-top:14px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); padding-left:8px; line-height:1.5;}

  .content{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 28px; background:var(--surface); border-bottom:1px solid var(--line); flex-wrap:wrap;}
  .tenant{font-size:13px; color:var(--muted);}
  .tenant strong{color:var(--ink); font-weight:650;}
  .topbar-right{display:flex; align-items:center; gap:16px;}
  .seg{display:inline-flex; align-items:center; gap:2px; padding:3px; border:1px solid var(--line-strong); border-radius:999px; background:var(--paper);}
  .seg button{padding:6px 14px; border-radius:999px; border:none; background:transparent; color:var(--muted); font-weight:600; font-size:12.5px; cursor:pointer;}
  .seg button.active{background:var(--accent-soft); color:var(--accent-ink);}
  .bell-wrap{position:relative;}
  .bell-btn{position:relative; display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:8px; border:1px solid transparent; background:none; color:var(--muted); cursor:pointer;}
  .bell-btn:hover{background:var(--paper); color:var(--ink);}
  .bell-btn svg{width:17px; height:17px;}
  .bell-badge{position:absolute; top:2px; right:2px; min-width:15px; height:15px; padding:0 3px; border-radius:999px; background:var(--st-escalated); color:#fff; font-size:9.5px; font-weight:700; display:flex; align-items:center; justify-content:center; font-variant-numeric:tabular-nums;}
  .notif-dropdown{position:absolute; top:calc(100% + 8px); right:0; width:360px; max-height:420px; overflow-y:auto; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,.18); z-index:40; padding:14px 16px;}
  .notif-dropdown-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;}
  .notif-dropdown-head h2{font-size:14px; font-weight:650;}
  .notif-dropdown-foot{font-size:11px; color:var(--muted); margin-top:10px; padding-top:10px; border-top:1px solid var(--line); line-height:1.5;}
  .who{display:flex; align-items:center; gap:8px; cursor:pointer; background:none; border:none; padding:2px; border-radius:8px;}
  .who:hover{background:var(--paper);}
  .avatar{width:30px; height:30px; border-radius:50%; background:var(--accent); color:var(--accent-fg); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;}
  .who-meta{display:flex; flex-direction:column; line-height:1.1; text-align:left;}
  .who-name{font-size:13px; font-weight:600;}
  .who-role{font-size:11px; color:var(--muted);}

  main{max-width:1360px; width:100%; margin:0 auto; padding:28px 32px 64px;}
  .page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
  .page-head h1{font-size:23px; font-weight:650; letter-spacing:-0.01em;}
  .page-head p{margin:4px 0 0; color:var(--muted); font-size:14px;}

  .kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
  @media (max-width:760px){ .kpi-grid{grid-template-columns:repeat(2,1fr);} }
  .kpi-card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px 18px; box-shadow:var(--shadow-card);}
  .kpi-card .label{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:650; margin-bottom:6px;}
  .kpi-card .num{font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1;}
  .kpi-card .sub{font-size:11.5px; color:var(--muted); margin-top:6px;}

  .grid-2{display:grid; grid-template-columns:1.3fr 1fr; gap:20px; align-items:start;}
  @media (max-width:860px){ .grid-2{grid-template-columns:1fr;} }
  .card{background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow-card); padding:18px 20px;}
  .card-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px;}
  .card-head h2{font-size:14px; font-weight:650;}
  .card-note{font-size:11.5px; color:var(--muted); margin-top:12px; line-height:1.5;}
  .col-stack{display:flex; flex-direction:column; gap:20px; min-width:0;}

  .bar-list{display:flex; flex-direction:column; gap:12px;}
  .bar-row{display:grid; grid-template-columns:104px 1fr 28px; align-items:center; gap:10px; font-size:12.5px;}
  .bar-track{height:8px; border-radius:999px; background:var(--paper); overflow:hidden;}
  .bar-fill{height:100%; background:var(--accent); border-radius:999px;}
  .bar-row .count{font-variant-numeric:tabular-nums; text-align:right; color:var(--muted); font-weight:650;}

  .deadline-list, .notif-list{display:flex; flex-direction:column; gap:0;}
  .deadline-row, .notif-row{display:flex; align-items:flex-start; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); cursor:pointer;}
  .deadline-row:last-child, .notif-row:last-child{border-bottom:none; padding-bottom:0;}
  .deadline-row:first-child, .notif-row:first-child{padding-top:0;}
  .deadline-main{flex:1; min-width:0;}
  .deadline-ref{font-family:var(--font-mono); font-size:11.5px; color:var(--muted);}
  .deadline-title{font-size:13.5px; font-weight:600; margin-top:1px;}
  .deadline-meta{font-size:12px; color:var(--muted); margin-top:2px;}

  .activity-feed{display:flex; flex-direction:column; gap:13px;}
  .feed-row{display:flex; gap:10px; cursor:pointer;}
  .feed-dot{width:7px; height:7px; border-radius:50%; background:var(--accent); margin-top:6px; flex:none;}
  .feed-text{font-size:13px;}
  .feed-text b{font-family:var(--font-mono); font-weight:650; font-size:12px;}

  .tag{display:inline-flex; align-items:center; padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:650; white-space:nowrap; border:1px solid var(--review-line); background:var(--review-bg); color:var(--review-fg);}
  .pill{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:650; white-space:nowrap;}
  .pill-good{background:color-mix(in srgb, var(--st-closed) 14%, transparent); color:var(--st-closed); border:1px solid var(--st-closed);}
  .pill-warn{background:color-mix(in srgb, var(--st-progress) 16%, transparent); color:var(--st-progress); border:1px solid var(--st-progress);}
  .pill-bad{background:color-mix(in srgb, var(--st-escalated) 14%, transparent); color:var(--st-escalated); border:1px solid var(--st-escalated);}
  .pill-dot{width:6px; height:6px; border-radius:50%; background:currentColor;}

  .badge{display:inline-flex; align-items:center; white-space:nowrap; padding:4px 11px; border-radius:999px; font-size:11.5px; font-weight:700; color:var(--st-fg); letter-spacing:.01em;}
  .badge-open{background:var(--st-open);}
  .badge-progress{background:var(--st-progress);}
  .badge-responded{background:var(--st-responded);}
  .badge-closed{background:var(--st-closed);}

  .flag-escalated{display:inline-flex; align-items:center; gap:4px; padding:3px 9px 3px 6px; border-radius:999px; font-size:11px; font-weight:700; background:transparent; border:1px solid var(--st-escalated); color:var(--st-escalated); white-space:nowrap;}
  .flag-escalated svg{width:11px; height:11px; flex:none;}

  .filter-bar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  .filter-bar select{padding:8px 12px; border:1px solid var(--line-strong); border-radius:8px; background:var(--surface); color:var(--ink); font-size:13px; min-width:150px;}
  .filter-bar input[type="text"], .search-input{padding:8px 12px; border:1px solid var(--line-strong); border-radius:8px; background:var(--surface); color:var(--ink); font-size:13px; min-width:220px;}
  th.sortable{cursor:pointer; user-select:none;}
  th.sortable:hover{color:var(--ink);}

  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--surface); box-shadow:var(--shadow-card);}
  table{width:100%; border-collapse:collapse; font-size:13.5px; min-width:640px;}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:650; padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap;}
  td{padding:13px 14px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.clickable{cursor:pointer;}
  tbody tr.clickable:hover{background:var(--paper);}
  @keyframes newRowPulse{
    0%, 100% { background-color: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
    50% { background-color: color-mix(in srgb, var(--accent) 24%, var(--surface)); }
  }
  tbody tr.row-new{ animation: newRowPulse 1.6s ease-in-out infinite; }
  tbody tr.row-new:hover{ animation-play-state: paused; background-color: color-mix(in srgb, var(--accent) 24%, var(--surface)); }
  .notice-type{color:var(--muted); font-size:12.5px; margin-top:2px;}
  .state-line{color:var(--muted); font-size:12px; margin-top:2px;}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  .due-overdue{color:var(--st-escalated); font-weight:700;}
  .due-note{display:block; font-size:11px; font-weight:600; margin-top:2px;}
  .status-cell{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .empty-row td{padding:40px 14px; text-align:center; color:var(--muted);}

  .back-link{display:inline-flex; align-items:center; gap:6px; background:none; border:none; cursor:pointer; color:var(--muted); font-size:13px; font-weight:600; padding:0; margin-bottom:16px;}
  .back-link:hover{color:var(--accent-ink);}
  .detail-head{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:22px; flex-wrap:wrap;}
  .detail-head .ref{font-family:var(--font-mono); font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;}
  .detail-head h1{font-size:21px; font-weight:650; margin-top:4px;}
  .detail-badges{display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .detail-grid{display:grid; grid-template-columns:1fr 336px; gap:24px; align-items:start;}
  @media (max-width:900px){ .detail-grid{grid-template-columns:1fr;} }
  .col-side{display:flex; flex-direction:column; gap:16px;}

  .kv{display:grid; grid-template-columns:126px 1fr; gap:9px 12px;}
  .kv dt{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:650; padding-top:1px;}
  .kv dd{margin:0; font-size:13.5px;}

  .thread{display:flex; flex-direction:column; gap:14px; margin-bottom:16px;}
  .entry{display:flex; gap:10px;}
  .entry-icon{width:26px; height:26px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; background:var(--paper); border:1px solid var(--line); color:var(--muted);}
  .entry-icon.remark{background:var(--accent-soft); color:var(--accent-ink); border-color:transparent;}
  .entry-body{flex:1; min-width:0;}
  .entry-meta{display:flex; align-items:baseline; gap:8px; font-size:12.5px; flex-wrap:wrap;}
  .entry-meta .name{font-weight:650;}
  .entry-meta .time{color:var(--muted); font-size:11.5px;}
  .entry-text{font-size:13.5px; margin-top:3px; white-space:pre-line;}
  .entry.system .entry-text, .entry.status .entry-text{color:var(--muted); font-style:italic; border-left:2px solid var(--line-strong); padding-left:10px;}
  .entry.status.st-open .entry-text{border-color:var(--st-open);}
  .entry.status.st-progress .entry-text{border-color:var(--st-progress);}
  .entry.status.st-responded .entry-text{border-color:var(--st-responded);}
  .entry.status.st-closed .entry-text{border-color:var(--st-closed);}
  .entry.escalation .entry-text{border-left:2px solid var(--st-escalated); padding-left:10px; color:var(--st-escalated); font-style:italic;}
  .file-chip{display:inline-flex; align-items:center; gap:6px; margin-top:4px; padding:4px 10px; border-radius:6px; background:var(--paper); border:1px solid var(--line); font-size:12px; font-family:var(--font-mono);}

  .card textarea, .composer textarea, .composer input[type="text"]{width:100%; border:1px solid var(--line-strong); border-radius:8px; padding:10px 12px; font-size:13.5px; background:var(--paper); color:var(--ink);}
  .card textarea, .composer textarea{min-height:64px; resize:vertical;}
  .composer-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px;}
  .chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .chip-btn{padding:5px 12px; border-radius:999px; border:1px solid var(--line-strong); background:var(--surface); color:var(--muted); font-size:12px; font-weight:600; cursor:pointer;}
  .chip-btn:hover{border-color:var(--accent); color:var(--accent-ink);}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 16px; border-radius:8px; font-size:13px; font-weight:650; cursor:pointer; border:1px solid transparent; white-space:nowrap;}
  .btn-primary{background:var(--accent); color:var(--accent-fg);}
  .btn-primary:hover{background:var(--accent-ink);}
  .btn-ghost{background:transparent; border-color:var(--line-strong); color:var(--ink);}
  .btn-ghost:hover{background:var(--paper);}
  .btn-sm{padding:6px 12px; font-size:12px;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn-block{width:100%;}

  .status-current{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .status-current .badge{font-size:12.5px; padding:5px 13px;}

  function csvEscape(v){
    var s = v === null || v === undefined ? '' : String(v);
    if (s.indexOf(',') >= 0 || s.indexOf('"') >= 0 || s.indexOf('\n') >= 0){ s = '"' + s.replace(/"/g,'""') + '"'; }
    return s;
  }
  function parseCSV(text){
    var rows = [];
    var row = [];
    var field = '';
    var inQuotes = false;
    text = text.replace(/\r\n/g, '\n');
    for (var i = 0; i < text.length; i++){
      var ch = text[i];
      if (inQuotes){
        if (ch === '"'){
          if (text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
        } else { field += ch; }
      } else {
        if (ch === '"'){ inQuotes = true; }
        else if (ch === ','){ row.push(field); field = ''; }
        else if (ch === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
        else { field += ch; }
      }
    }
    if (field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(function(r){ return r.length > 1 || (r[0] && r[0].trim()); });
  }

  function downloadCSV(filename, rows){
    var csv = rows.map(function(r){ return r.map(csvEscape).join(','); }).join('\r\n');
    var blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function downloadText(filename, text){

    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

      if (av < bv) return sortState.dir === 'asc' ? -1 : 1;

  function sortRows(list, key, dir){
    return list.slice().sort(function(a,b){
      var av = (a[key]||'').toString().toLowerCase(), bv = (b[key]||'').toString().toLowerCase();
      if (av < bv) return dir === 'asc' ? -1 : 1;
      if (av > bv) return dir === 'asc' ? 1 : -1;
      return 0;
    });
  }
  function sortArrow(sortState, key){
    if (sortState.key !== key) return '';
    return sortState.dir === 'asc' ? ' &uarr;' : ' &darr;';
  }

  var TODAY = { year:2026, month:7, day:11 };
  var WEEKDAY_LABELS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  var HOLIDAYS = [
    { d:'26 Jan 2026', t:'Republic Day', scope:'national' },
    { d:'04 Mar 2026', t:'Holi', scope:'national' },
    { d:'15 Aug 2026', t:'Independence Day', scope:'national' },
    { d:'02 Oct 2026', t:'Gandhi Jayanti', scope:'national' },
    { d:'08 Nov 2026', t:'Diwali', scope:'national' },
    { d:'25 Dec 2026', t:'Christmas', scope:'national' },
    { d:'14 Jan 2026', t:'Makar Sankranti / Uttarayan', scope:'Gujarat' },
    { d:'01 May 2026', t:'Gujarat Day', scope:'Gujarat' },
    { d:'14 Jan 2026', t:'Pongal', scope:'Tamil Nadu' },
    { d:'14 Apr 2026', t:'Tamil New Year (Puthandu)', scope:'Tamil Nadu' },
    { d:'01 May 2026', t:'Maharashtra Day', scope:'Maharashtra' },
    { d:'14 Sep 2026', t:'Ganesh Chaturthi', scope:'Maharashtra' },
    { d:'01 Nov 2026', t:'Karnataka Rajyotsava', scope:'Karnataka' }
  ];
  var CUSTOM_EVENTS = [];

  function statesForEntity(entity){
    if (entity === 'all') return null;
    var set = {};
    uniqueGstins().forEach(function(g){ if (g.entity === entity) set[g.state] = true; });
    return Object.keys(set);
  }

  function monthEvents(year, month, entityFilter, myOnly){
    var map = {};
    function add(day, ev){ if (!map[day]) map[day] = []; map[day].push(ev); }
    var states = statesForEntity(entityFilter || 'all');
    var myIds = myOnly ? queueCases().map(function(c){ return c.id; }) : null;

    CASES.forEach(function(c){
      if (entityFilter && entityFilter !== 'all' && c.entity !== entityFilter) return;
      if (myIds && myIds.indexOf(c.id) < 0) return;
      if (c.status !== 'closed'){
        var dd = new Date(c.due);
        if (dd.getFullYear() === year && dd.getMonth() === month) add(dd.getDate(), { type:'due', c:c });
        if (c.internalDueDate && c.status !== 'responded'){
          var idd = new Date(c.internalDueDate);
          if (idd.getFullYear() === year && idd.getMonth() === month) add(idd.getDate(), { type:'internal_due', c:c });
        }
      }
      if (c.personalHearing && c.hearingDate){
        var hd = new Date(c.hearingDate);
        if (hd.getFullYear() === year && hd.getMonth() === month) add(hd.getDate(), { type:'hearing', c:c });
      }
    });

    HOLIDAYS.forEach(function(h){
      if (h.scope !== 'national' && states && states.indexOf(h.scope) < 0) return;
      var dh = new Date(h.d);
      if (dh.getFullYear() === year && dh.getMonth() === month) add(dh.getDate(), { type:'holiday', label:h.t, scope:h.scope });
    });

    add(11, { type:'statutory', label:'GSTR-1 due' });
    add(20, { type:'statutory', label:'GSTR-3B due' });
    if (year === 2026 && month === 11) add(31, { type:'statutory', label:'GSTR-9 annual return due' });

    CUSTOM_EVENTS.forEach(function(ev){
      if (ev.year === year && ev.month === month) add(ev.day, { type:'custom', title:ev.title, note:ev.note });
    });

    return map;
  }

  function cellTintColor(dayEvents){
    if (dayEvents.some(function(e){ return e.type === 'due' && e.c.agingBucket === 'red'; })) return 'var(--st-escalated)';
    if (dayEvents.some(function(e){ return e.type === 'due' && e.c.agingBucket === 'amber'; })) return 'var(--st-progress)';
    if (dayEvents.some(function(e){ return e.type === 'hearing'; })) return 'var(--accent)';
    if (dayEvents.some(function(e){ return e.type === 'holiday' && e.scope === 'national'; })) return 'var(--hol-national)';
    if (dayEvents.some(function(e){ return e.type === 'holiday' && e.scope !== 'national'; })) return 'var(--hol-state)';
    if (dayEvents.some(function(e){ return e.type === 'custom'; })) return 'var(--custom-event)';
    if (dayEvents.some(function(e){ return e.type === 'due' && e.c.agingBucket === 'green'; })) return 'var(--st-closed)';
    return null;
  }

  function eventChipHtml(ev){
    if (ev.type === 'due'){
      var dotColor = ev.c.agingBucket === 'red' ? 'var(--st-escalated)' : ev.c.agingBucket === 'amber' ? 'var(--st-progress)' : 'var(--st-closed)';
      return '<div class="cal-chip" data-action="open-case" data-id="' + ev.c.id + '" title="' + ev.c.noticeType + '"><span class="cal-dot" style="background:' + dotColor + '"></span>' + ev.c.code + ' due</div>';
    }
    if (ev.type === 'hearing'){
      return '<div class="cal-chip" data-action="open-case" data-id="' + ev.c.id + '" title="Personal hearing — ' + ev.c.noticeType + '"><span class="cal-dot" style="background:var(--accent)"></span>' + ev.c.code + ' hearing</div>';
    }
    if (ev.type === 'internal_due'){
      return '<div class="cal-chip" data-action="open-case" data-id="' + ev.c.id + '" title="Internal review target — ' + ev.c.noticeType + '"><span class="cal-dot" style="background:var(--st-responded)"></span>' + ev.c.code + ' internal due</div>';
    }
    if (ev.type === 'holiday'){
      var holColor = ev.scope === 'national' ? 'var(--hol-national)' : 'var(--hol-state)';
      var holTitle = ev.scope === 'national' ? 'Public holiday' : ev.scope + ' state / bank holiday';
      return '<div class="cal-chip" title="' + ev.label + ' — ' + holTitle + '"><span class="cal-dot" style="background:' + holColor + '"></span>' + ev.label + '</div>';
    }
    if (ev.type === 'custom'){
      return '<div class="cal-chip" title="' + ev.title + (ev.note ? (' — ' + ev.note) : '') + '"><span class="cal-dot" style="background:var(--custom-event)"></span>' + ev.title + '</div>';
    }
    return '<div class="cal-chip" title="' + ev.label + '"><span class="cal-dot" style="background:var(--muted)"></span>' + ev.label + '</div>';
  }

  function agendaItems(entityFilter, myOnly, daysAhead){
    var start = new Date(TODAY.year, TODAY.month, TODAY.day);
    var end = new Date(start); end.setDate(end.getDate() + daysAhead);
    var items = [];
    var states = statesForEntity(entityFilter || 'all');
    var myIds = myOnly ? queueCases().map(function(c){ return c.id; }) : null;
    CASES.forEach(function(c){
      if (entityFilter && entityFilter !== 'all' && c.entity !== entityFilter) return;
      if (myIds && myIds.indexOf(c.id) < 0) return;
      if (c.status !== 'closed'){
        var dd = new Date(c.due);
        if (dd >= start && dd <= end) items.push({ date:dd, type:'due', c:c });
        if (c.internalDueDate && c.status !== 'responded'){
          var idd2 = new Date(c.internalDueDate);
          if (idd2 >= start && idd2 <= end) items.push({ date:idd2, type:'internal_due', c:c });
        }
      }
      if (c.personalHearing && c.hearingDate){
        var hd = new Date(c.hearingDate);
        if (hd >= start && hd <= end) items.push({ date:hd, type:'hearing', c:c });
      }
    });
    HOLIDAYS.forEach(function(h){
      if (h.scope !== 'national' && states && states.indexOf(h.scope) < 0) return;
      var dh = new Date(h.d);
      if (dh >= start && dh <= end) items.push({ date:dh, type:'holiday', label:h.t, scope:h.scope });
    });
    CUSTOM_EVENTS.forEach(function(ev){
      var ed = new Date(ev.year, ev.month, ev.day);
      if (ed >= start && ed <= end) items.push({ date:ed, type:'custom', title:ev.title, note:ev.note });
    });
    items.sort(function(a,b){ return a.date - b.date; });
    return items;
  }

  function renderPlannerView(entityFilter, myOnly){
    var items = agendaItems(entityFilter, myOnly, 30);
    if (!items.length) return '<div class="card"><p class="muted-note">Nothing planned in the next 30 days.</p></div>';
    var grouped = {}, order = [];
    items.forEach(function(it){
      var key = it.date.getDate() + ' ' + MONTHS[it.date.getMonth()] + ' ' + it.date.getFullYear();
      if (!grouped[key]){ grouped[key] = []; order.push(key); }
      grouped[key].push(it);
    });
    return order.map(function(key){
      var rows = grouped[key].map(function(it){
        if (it.type === 'due' || it.type === 'hearing' || it.type === 'internal_due'){
          var typeLabel = it.type === 'due' ? 'Due' : (it.type === 'hearing' ? 'Hearing' : 'Internal Due');
          var dotColor = it.type === 'hearing' ? 'var(--accent)' : it.type === 'internal_due' ? 'var(--st-responded)' : (it.c.agingBucket==='red'?'var(--st-escalated)':it.c.agingBucket==='amber'?'var(--st-progress)':'var(--st-closed)');
          return '<div class="deadline-row" data-action="open-case" data-id="' + it.c.id + '"><div class="deadline-main"><div class="deadline-ref"><span class="cal-dot" style="background:' + dotColor + '; display:inline-block; margin-right:5px;"></span>' + typeLabel + ' — ' + it.c.code + '</div><div class="deadline-title">' + it.c.noticeType + '</div><div class="deadline-meta">' + it.c.entity + ' · ' + it.c.state + '</div></div></div>';
        }
        if (it.type === 'holiday'){
          var hColor = it.scope === 'national' ? 'var(--hol-national)' : 'var(--hol-state)';
          return '<div class="deadline-row"><div class="deadline-main"><div class="deadline-ref"><span class="cal-dot" style="background:' + hColor + '; display:inline-block; margin-right:5px;"></span>' + (it.scope==='national'?'Public Holiday':it.scope+' Holiday') + '</div><div class="deadline-title">' + it.label + '</div></div></div>';
        }
        return '<div class="deadline-row"><div class="deadline-main"><div class="deadline-ref"><span class="cal-dot" style="background:var(--custom-event); display:inline-block; margin-right:5px;"></span>Your Event</div><div class="deadline-title">' + it.title + '</div>' + (it.note ? '<div class="deadline-meta">' + it.note + '</div>' : '') + '</div></div>';
      }).join('');
      return '<div class="card" style="margin-bottom:14px;"><div class="card-head"><h2>' + key + '</h2></div><div class="deadline-list">' + rows + '</div></div>';
    }).join('');
  }

  function renderCalendar(){
    var year = state.calYear, month = state.calMonth;
    var entityFilter = state.filters.calEntity || 'all';
    var myOnly = !!state.filters.calMyOnly;
    var events = monthEvents(year, month, entityFilter, myOnly);
    var firstWeekday = (new Date(year, month, 1).getDay() + 6) % 7;
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var daysInPrevMonth = new Date(year, month, 0).getDate();

    var cells = [];
    for (var i = 0; i < firstWeekday; i++){ cells.push({ day: daysInPrevMonth - firstWeekday + 1 + i, inMonth:false }); }
    for (var d = 1; d <= daysInMonth; d++){ cells.push({ day:d, inMonth:true }); }
    while (cells.length % 7 !== 0){ cells.push({ day: cells.length - firstWeekday - daysInMonth + 1, inMonth:false }); }

    var cellsHtml = cells.map(function(cell){
      var isToday = cell.inMonth && year === TODAY.year && month === TODAY.month && cell.day === TODAY.day;
      var dayEvents = cell.inMonth ? (events[cell.day] || []) : [];
      var shown = dayEvents.slice(0, 3).map(eventChipHtml).join('');
      var more = dayEvents.length > 3 ? '<div class="cal-more">+' + (dayEvents.length - 3) + ' more</div>' : '';
      var dataAttrs = cell.inMonth ? ' data-year="' + year + '" data-month="' + month + '" data-day="' + cell.day + '" title="Double-click to add an event"' : '';
      var tint = cellTintColor(dayEvents);
      var tintStyle = tint ? ' style="background:color-mix(in srgb, ' + tint + ' 16%, var(--surface));"' : '';
      return '<div class="cal-cell' + (cell.inMonth ? '' : ' out') + (isToday ? ' today' : '') + '"' + dataAttrs + tintStyle + '><div class="cal-daynum">' + cell.day + '</div><div class="cal-chips">' + shown + more + '</div></div>';
    }).join('');

    var weekdayHtml = WEEKDAY_LABELS.map(function(w){ return '<div class="cal-weekday">' + w + '</div>'; }).join('');
    var monthLabel = MONTHS[month] + ' ' + year;

    return (
      '<div class="page-head"><div><h1>Calendar</h1><p>Case due dates, personal hearings, statutory filings and holidays, by date. Double-click any day to add your own event.</p></div>' +
        '<button class="btn btn-ghost btn-sm" data-action="export-calendar">Export to Excel</button>' +
      '</div>' +
      '<div class="filter-bar">' +
        '<div class="seg" role="group" aria-label="Calendar view"><button type="button" data-action="cal-view" data-view="month" class="' + (state.calView!=='planner'?'active':'') + '">Month</button><button type="button" data-action="cal-view" data-view="planner" class="' + (state.calView==='planner'?'active':'') + '">Planner</button></div>' +
        '<select data-filter="calEntity">' + optionList(ENTITIES, entityFilter, 'All Entities') + '</select>' +
        '<label style="display:inline-flex; align-items:center; gap:7px; font-size:13px; cursor:pointer; padding:8px 12px; border:1px solid var(--line-strong); border-radius:8px; background:var(--surface);"><input type="checkbox" data-toggle="calMyOnly"' + (myOnly ? ' checked' : '') + '/>My items only</label>' +
      '</div>' +
      (state.calView === 'planner'
        ? '<div class="page-head"><div><h2 style="font-size:16px;">Next 30 Days</h2></div></div>' + renderPlannerView(entityFilter, myOnly)
        : (

  function demandDetailRowHtml(c){
    return '<tr><td class="mono">' + c.id + '</td><td>' + c.entity + '</td><td class="mono">' + c.gstin + '</td><td>' + c.code + ' — ' + c.noticeType + '</td>' +

      '<td class="mono" style="color:' + (demandOutstanding(c) > 0 ? 'var(--st-escalated)' : 'var(--st-closed)') + ';">' + inr(demandOutstanding(c)) + '</td>' +
      '<td><span class="badge ' + STATUS_BADGE_CLASS[c.status] + '">' + STATUS_LABEL[c.status] + '</span></td></tr>';
  }
  function sortDemandCases(list, sortState){
    return list.slice().sort(function(a,b){
      var av, bv;
      if (sortState.key === 'total') { av = demandTotal(a); bv = demandTotal(b); }
      else if (sortState.key === 'outstanding') { av = demandOutstanding(a); bv = demandOutstanding(b); }
      else if (sortState.key === 'paid') { av = a.demand.paid || 0; bv = b.demand.paid || 0; }
      else if (sortState.key === 'tax' || sortState.key === 'interest' || sortState.key === 'penalty') { av = a.demand[sortState.key]; bv = b.demand[sortState.key]; }
      else { av = (a[sortState.key]||'').toString().toLowerCase(); bv = (b[sortState.key]||'').toString().toLowerCase(); }
      if (av < bv) return sortState.dir === 'asc' ? -1 : 1;
      if (av > bv) return sortState.dir === 'asc' ? 1 : -1;
      return 0;
    });
  }

  function renderDemandDetailCard(repEntity){
    var base = CASES.filter(function(c){ return c.demand && (repEntity === 'all' || c.entity === repEntity); });
    base = sortDemandCases(base, state.demandSort);
    var rows = base.map(demandDetailRowHtml).join('');
    if (!base.length) rows = '<tr class="empty-row"><td colspan="11">No cases with a quantified demand for this entity.</td></tr>';
    function th(label, key){ return '<th class="sortable" data-action="sort-demand" data-key="' + key + '">' + label + sortArrow(state.demandSort, key) + '</th>'; }
    return '<div class="card" style="margin-bottom:20px;"><div class="card-head"><h2>Demand Detail</h2></div><div class="table-wrap"><table><thead><tr>' +
      th('Reference','id') + '<th>Entity</th><th>GSTIN</th><th>Notice Type</th>' +
      th('Tax','tax') + th('Interest','interest') + th('Penalty','penalty') + th('Total','total') + th('Paid','paid') + th('Outstanding','outstanding') +
      '<th>Status</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="card-note">One row per case with a quantified demand, regardless of status. Click a column header to sort.</div></div>';
  }

  function renderContingentLiabilityCard(repEntity){
    var disputed = CASES.filter(function(c){ return c.demand && c.status !== 'closed' && (repEntity === 'all' || c.entity === repEntity); });
    var total = sumDemand(disputed, 'total');
    var rows = FORUM_LEVELS.map(function(f){
      var subset = disputed.filter(function(c){ return c.forumLevel === f.key; });
      if (!subset.length) return '';
      return '<tr><td>' + f.short + ' — ' + f.name + '</td><td class="mono">' + subset.length + '</td><td class="mono">' + inr(sumDemand(subset,'tax')) + '</td><td class="mono">' + inr(sumDemand(subset,'interest')) + '</td><td class="mono">' + inr(sumDemand(subset,'penalty')) + '</td><td class="mono" style="font-weight:650;">' + inr(sumDemand(subset,'total')) + '</td></tr>';
    }).join('');
    if (!rows) rows = '<tr class="empty-row"><td colspan="6">No disputed demand for this entity.</td></tr>';
    return '<div class="card" style="margin-bottom:20px;"><div class="card-head"><h2>Contingent Liability Summary</h2><span class="pill pill-warn"><span class="pill-dot"></span>' + inr(total) + '</span></div>' +
      '<p class="muted-note" style="margin-bottom:14px;">Demand tied to cases still under dispute (not Closed), by litigation forum stage. This is possible exposure pending the outcome of an ongoing matter, not an admitted or settled liability.</p>' +
      '<div class="table-wrap"><table><thead><tr><th>Litigation Forum</th><th>Cases</th><th>Tax</th><th>Interest</th><th>Penalty</th><th>Total</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '</div>';
  }

        '<div class="kpi-card"><div class="label">Penalty</div><div class="num" style="font-size:20px;">' + inr(sumDemand(CASES.filter(function(c){ return c.status !== "closed" && (repEntity === "all" || c.entity === repEntity); }),'penalty')) + '</div></div>' +
        '<div class="kpi-card"><div class="label">Outstanding</div><div class="num" style="font-size:20px; color:var(--st-escalated);">' + inr(sumDemand(CASES.filter(function(c){ return repEntity === "all" || c.entity === repEntity; }),'outstanding')) + '</div></div>' +
      '</div>' +

      '<div class="card"><div class="card-head"><h2>Case Aging</h2></div><div class="table-wrap"><table><thead><tr><th>Reference</th><th>Notice Type</th><th>State</th><th>Entity</th><th>Aging</th></tr></thead><tbody>' + reportRows + '</tbody></table></div></div>' +
      '<div class="card" style="margin-top:20px;"><div class="card-head"><h2>Cases by Entity</h2></div><div class="table-wrap"><table><thead><tr><th>Entity</th><th>Open</th><th>In Progress</th><th>Responded</th><th>Closed</th><th>Escalated</th></tr></thead><tbody>' + entityRows + '</tbody></table></div></div>'
    );

  function renderTemplateModal(){

        '<div class="modal-card" style="max-width:480px;">' +
          '<h2>' + (editing ? 'Edit Reply Template' : 'Add Reply Template') + '</h2><p class="sub">Used to draft replies faster and as the basis for AI-generated drafts.</p>' +
          '<div class="field"><label>Template Name</label><input type="text" data-role="tmpl-name" value="' + t.name + '" placeholder="e.g. ITC Mismatch — Standard Reply"/></div>' +

          '<div class="field"><label>Category</label><input type="text" data-role="tmpl-category" value="' + t.category + '" placeholder="e.g. Show Cause Notice"/></div>' +
          '<div class="field"><label>Template Body</label><textarea data-role="tmpl-body" style="min-height:120px;">' + t.body + '</textarea></div>' +

        '</div>' +
      '</div>'

  function renderTemplates(){
    var admin = isAdmin();
    var rows = REPLY_TEMPLATES.map(function(t){
      var preview = t.body.length > 90 ? t.body.slice(0, 90) + '&hellip;' : t.body;
      var actionsCell = admin
        ? '<button class="btn btn-ghost btn-sm" data-action="edit-template" data-id="' + t.id + '">Edit</button> ' +
          '<button class="btn btn-ghost btn-sm" data-action="delete-template" data-id="' + t.id + '">Delete</button>'
        : '<span class="muted-note">Admin only</span>';
      return '<tr><td>' + t.name + '</td><td class="mono">' + t.noticeCode + '<div class="state-line">' + t.category + '</div></td><td style="max-width:340px;">' + preview + '</td><td style="white-space:nowrap;">' + actionsCell + '</td></tr>';
    }).join('');
    if (!rows) rows = '<tr class="empty-row"><td colspan="4">No reply templates yet.</td></tr>';

    return (
      '<div class="page-head"><div><h1>Reply Templates</h1><p>Standard reply language your team can reuse and configure — also used by GST Radar AI to draft first-cut replies.</p></div>' +
        (admin ? '<button class="btn btn-primary btn-sm" data-action="add-template">+ Add New</button>' : '') +
      '</div>' +
      (admin ? '' : '<p class="muted-note" style="margin-bottom:14px;">Adding, editing and deleting templates is restricted to the Admin role.</p>') +
      '<div class="table-wrap"><table><thead><tr><th>Template</th><th>Notice Type</th><th>Preview</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="card" style="margin-top:20px;"><div class="card-head"><h2>AI Drafting &amp; Translation</h2><span class="tag">Beta</span></div>' +
        '<p class="muted-note">When a case&rsquo;s notice type matches a saved template, &ldquo;Generate Draft with AI&rdquo; on that case starts from this library instead of a generic skeleton. The prototype matches by notice code only; production would extend this with retrieval over the full template library (RAG) so near-matches are found too, not just exact notice-type matches.</p>' +
        '<p class="muted-note" style="margin-top:8px;">Each case also offers a translated view of the notice for reference, since notices and replies vary by state language. That view is a labelled placeholder in this prototype — production would call a translation service and would need review before being relied on.</p>' +
      '</div>' +
      renderTemplateModal()
    );
  }

  function renderAuditLog(){
    var search = (state.filters.auditSearch || '').toLowerCase();
    var actionFilter = state.filters.auditAction || 'all';
    var actionTypes = [];
    AUDIT_LOG.forEach(function(e){ if (actionTypes.indexOf(e.action) < 0) actionTypes.push(e.action); });
    var list = AUDIT_LOG.filter(function(e){
      if (actionFilter !== 'all' && e.action !== actionFilter) return false;
      if (!search) return true;
      return (e.actor + ' ' + e.action + ' ' + e.details).toLowerCase().indexOf(search) >= 0;
    });
    var rows = list.map(function(e){
      return '<tr><td class="mono" style="white-space:nowrap;">' + e.time + '</td><td>' + e.actor + '</td><td><span class="tag">' + e.action + '</span></td><td>' + e.details + '</td></tr>';
    }).join('');
    if (!list.length) rows = '<tr class="empty-row"><td colspan="4">No log entries match your search.</td></tr>';

    return (
      '<div class="page-head"><div><h1>Audit Logs</h1><p>Every download, print, export, assignment and record change, with who did it and when.</p></div></div>' +
      '<div class="filter-bar">' +
        '<input type="text" data-search="auditSearch" value="' + (state.filters.auditSearch||'') + '" class="search-input" placeholder="Search actor, action or details..."/>' +
        '<select data-filter="auditAction"><option value="all">All Actions</option>' + actionTypes.map(function(a){ return '<option value="' + a + '"' + (actionFilter===a?' selected':'') + '>' + a + '</option>'; }).join('') + '</select>' +
      '</div>' +
      '<div class="table-wrap"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Details</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="card-note" style="margin-top:12px;">This log is session-local in the prototype and resets on refresh. In production it would be an append-only, permanent record.</div>'
    );
  }

  function renderOutlook(){
    var rules = [
      { name:'Department SCNs', cond:'From domain @gst.gov.in', action:'Create case + notify Preparer' },
      { name:'State Portal Alerts', cond:'Subject contains ASMT or DRC', action:'Attach to matching case' },
      { name:'Personal Forwards', cond:'From a listed personal email, subject contains notice', action:'Flag for manual review' }
    ];
    var ruleRows = rules.map(function(r){ return '<tr><td>' + r.name + '</td><td>' + r.cond + '</td><td>' + r.action + '</td></tr>'; }).join('');
    return (
      '<div class="page-head"><div><h1>Outlook Integration</h1><p>Push GST department alerts into the inbox your team already watches, and route matching emails into GST Radar.</p></div><span class="tag">Phase 2</span></div>' +
      '<div class="card"><div class="card-head"><h2>Connection</h2><span class="pill pill-warn"><span class="pill-dot"></span>Not Connected</span></div>' +
        '<p class="muted-note">Connect an Outlook mailbox to receive case alerts directly in Outlook, and let GST Radar create or update cases from emails that match the rules below.</p>' +
        '<button class="btn btn-ghost" disabled title="Available in Phase 2">Connect Outlook Account</button></div>' +
      '<div class="card" style="margin-top:20px; opacity:.6;"><div class="card-head"><h2>Alert Rules — Preview</h2></div>' +
        '<div class="table-wrap"><table><thead><tr><th>Rule</th><th>Condition</th><th>Action</th></tr></thead><tbody>' + ruleRows + '</tbody></table></div>' +
        '<div class="card-note">Rule configuration becomes available once Outlook is connected.</div></div>'
    );
  }

  function render(){
    if (state.view === 'login'){
      document.getElementById('app').innerHTML = renderLogin();
      return;
    }
    var mainHtml;
    if (state.view === 'queue') mainHtml = renderQueue();
    else if (state.view === 'detail') mainHtml = renderDetail();
    else if (state.view === 'consent') mainHtml = renderConsent();
    else if (state.view === 'templates') mainHtml = renderTemplates();
    else if (state.view === 'audit') mainHtml = renderAuditLog();
    else if (state.view === 'calendar') mainHtml = renderCalendar();
    else if (state.view === 'reports') mainHtml = renderReports();
    else if (state.view === 'admin') mainHtml = renderAdmin();
    else if (state.view === 'masters') mainHtml = renderMasters();
    else if (state.view === 'outlook') mainHtml = renderOutlook();
    else if (state.view === 'list') mainHtml = renderList();
    else mainHtml = renderDashboard();

    document.getElementById('app').innerHTML =
      '<div class="shell">' + renderSidebar() + '<div class="content">' + renderTopbar() + '<main>' + mainHtml + '</main></div></div>';
  }

  document.getElementById('app').addEventListener('click', function(ev){
    var target = ev.target.closest('[data-action]');
    if (target && state.notifDropdownOpen && target.getAttribute('data-action') !== 'toggle-notif'){
      state.notifDropdownOpen = false;
    }
    if (!target) return;
    var action = target.getAttribute('data-action');
    var id = target.getAttribute('data-id');
    if (target.classList.contains('modal-backdrop') && ev.target.closest('.modal-card')) return;

    if (action === 'toggle-notif'){ state.notifDropdownOpen = !state.notifDropdownOpen; render(); return; }
    if (action === 'save-notif-prefs'){ state.notifPrefsSaved = true; render(); return; }
    if (action === 'save-dashboard-config'){
      if (!isAdmin()) return;
      state.dashboardConfigSaved = true;
      logAudit('Master Updated', 'Dashboard Configuration visibility settings saved.');
      render();
      return;
    }
    if (action === 'login'){ state.view = 'dashboard'; render(); return; }
    if (action === 'logout'){ state.view = 'login'; state.selectedId = null; render(); return; }
    if (action === 'noop') return;
    if (action === 'nav'){ state.view = target.getAttribute('data-view'); state.selectedId = null; render(); return; }
    if (action === 'open-case'){
      state.view = 'detail'; state.selectedId = id;
      var openedCase = findCase(id);
      if (openedCase) openedCase.isNew = false;
      render();
      return;
    }
    if (action === 'back-to-list'){ state.view = 'list'; state.selectedId = null; render(); return; }
    if (action === 'set-role'){ state.role = target.getAttribute('data-role'); render(); return; }

    if (action === 'advance-status'){
      var c = findCase(id);
      if (!c) return;
      var idx = STATUS_ORDER.indexOf(c.status);
      if (c.status === 'responded' && !isElevated()) return;
      var next = STATUS_ORDER[idx+1];
      if (!next) return;
      c.status = next;
      var stKey = next === 'in_progress' ? 'progress' : next;
      var actor = isElevated() ? currentActorLabel() : c.assignedTo + ' (Preparer)';
      c.activity.push({ type:'status', st:stKey, actor:actor, text:'Status changed to ' + STATUS_LABEL[next] + ' by ' + actor + '.', time:'Just now' });
      logAudit('Status Change', c.id + ' moved to ' + STATUS_LABEL[next] + '.');
      render();
      return;
    }
    if (action === 'acknowledge-escalation'){
      var c2 = findCase(id);
      if (!c2 || !isElevated()) return;
      c2.escalated = false;
      c2.activity.push({ type:'system', actor:currentActorLabel(), text:'Escalation acknowledged by ' + currentActorLabel() + '.', time:'Just now' });
      render();
      return;
    }
    if (action === 'sort-demand'){
      var demKey = target.getAttribute('data-key');
      if (state.demandSort.key === demKey) state.demandSort.dir = state.demandSort.dir === 'asc' ? 'desc' : 'asc';
      else { state.demandSort.key = demKey; state.demandSort.dir = 'asc'; }
      render();
      return;
    }
    if (action === 'sort-docs'){
      var dkey = target.getAttribute('data-key');
      if (state.docSort.key === dkey) state.docSort.dir = state.docSort.dir === 'asc' ? 'desc' : 'asc';
      else { state.docSort.key = dkey; state.docSort.dir = 'asc'; }
      render();
      return;
    }
    if (action === 'view-document'){
      state.docViewModal = { caseId: target.getAttribute('data-id'), docId: target.getAttribute('data-doc') };
      render();
      return;
    }
    if (action === 'close-doc-modal'){ state.docViewModal = null; render(); return; }
    if (action === 'merge-documents'){
      var cMerge = findCase(id);
      if (!cMerge) return;
      var checked = Array.prototype.slice.call(document.querySelectorAll('[data-role="doc-checkbox"]:checked'));
      var selectedIds = checked.map(function(el){ return el.getAttribute('data-doc'); });
      var selectedDocs = cMerge.documents.filter(function(d){ return selectedIds.indexOf(d.id) >= 0; });
      if (selectedDocs.length < 2){ window.alert('Select at least two documents to merge.'); return; }
      var totalSize = selectedDocs.reduce(function(sum, d){ return sum + (d.sizeKB || 0); }, 0);
      var compressedSize = Math.round(totalSize * 0.55);
      var mergedDoc = { id:'doc' + (cMerge.documents.length + 1), name:'Merged-' + selectedDocs.length + '-Documents-' + cMerge.id + '.pdf', source:'Uploaded', actor:currentActorLabel(), time:'Just now', sizeKB: compressedSize, merged:true };
      cMerge.documents.push(mergedDoc);
      logAudit('Documents Merged', selectedDocs.length + ' documents merged and compressed for ' + cMerge.id + ' (' + totalSize + ' KB &rarr; ' + compressedSize + ' KB).');
      state.mergeDocsModal = { resultText: 'Merged ' + selectedDocs.length + ' documents into ' + mergedDoc.name + '. Combined size ' + totalSize + ' KB compressed to ' + compressedSize + ' KB (' + Math.round((1 - compressedSize/totalSize)*100) + '% smaller) &mdash; useful when a GST Portal upload has a file-size limit.' };
      render();
      return;
    }
    if (action === 'close-merge-modal'){ state.mergeDocsModal = null; render(); return; }
    if (action === 'attach-document'){
      var cAtt = findCase(id);
      if (!cAtt) return;
      cAtt.documents.push({ id:'doc' + (cAtt.documents.length + 1), name:'Attachment-' + (cAtt.documents.length + 1) + '.pdf', source:'Uploaded', actor:currentActorLabel(), time:'Just now', sizeKB: 260 });
      logAudit('Document Attached', 'Document attached to ' + cAtt.id + '.');
      render();
      return;
    }
    if (action === 'save-consultant'){
      if (!isElevated()) return;
      var cCon = findCase(id);
      var conSelect = document.querySelector('[data-role="consultant-select"]');
      if (!cCon || !conSelect) return;
      var conRow = findConsultant(conSelect.value);
      var newName = conRow ? conRow.name : null;
      if (cCon.assignedConsultant !== newName){
        cCon.assignedConsultant = newName;
        logAudit('Consultant Assigned', cCon.id + ' referred to ' + (newName || 'no consultant') + '.');
      }
      render();
      return;
    }
    if (action === 'toggle-translation'){
      var cTr = findCase(id);
      if (!cTr) return;
      cTr.showTranslation = !cTr.showTranslation;
      render();
      return;
    }
    if (action === 'mark-reviewed'){
      var c3 = findCase(id);
      if (!c3) return;
      c3.aiReviewed = true;
      render();
      return;
    }
    if (action === 'add-remark'){
      var c4 = findCase(id);
      if (!c4) return;
      var box = document.querySelector('[data-role="remark-input"]');
      var val = box ? box.value.trim() : '';
      if (!val) return;
      c4.activity.push({ type:'remark', actor:currentActorLabel(), text:val, time:'Just now' });
      render();
      return;
    }
    if (action === 'renew-consent'){
      if (!isAdmin()) return;
      var gstin = target.getAttribute('data-gstin');
      CASES.forEach(function(c){ if (c.gstin === gstin){ c.consentExpiry = '20 Aug 2026'; c.consentStatus = 'active'; } });
      var rgRow = findGstin(gstin);
      if (rgRow){ rgRow.consentExpiry = '20 Aug 2026'; rgRow.consentStatus = 'active'; }
      logAudit('Consent Renewed', 'GSP consent renewed for GSTIN ' + gstin + '.');
      render();
      return;
    }
    if (action === 'add-gstin'){ if (!isAdmin()) return; state.gstinModal = { mode:'add' }; render(); return; }
    if (action === 'edit-gstin'){ if (!isAdmin()) return; state.gstinModal = { mode:'edit', gstin:target.getAttribute('data-gstin') }; render(); return; }
    if (action === 'close-gstin-modal'){ state.gstinModal = null; render(); return; }
    if (action === 'delete-gstin'){
      if (!isAdmin()) return;
      var delGstin = target.getAttribute('data-gstin');
      if (window.confirm('Remove GSTIN ' + delGstin + ' from the repository? This does not delete existing cases already linked to it.')){
        var idx = GSTIN_REGISTRY.findIndex(function(g){ return g.gstin === delGstin; });
        if (idx >= 0) GSTIN_REGISTRY.splice(idx, 1);
        logAudit('GSTIN Deleted', 'GSTIN ' + delGstin + ' removed from the registry.');
        render();
      }
      return;
    }
    if (action === 'save-gstin'){
      if (!isAdmin()) return;
      var entityVal = document.querySelector('[data-role="gstin-entity"]').value;
      var numberVal = document.querySelector('[data-role="gstin-number"]').value.trim().toUpperCase();
      var stateVal = document.querySelector('[data-role="gstin-state"]').value;
      var emailVal = document.querySelector('[data-role="gstin-email"]').value.trim();
      var mobileVal = document.querySelector('[data-role="gstin-mobile"]').value.trim();
      var addressVal = document.querySelector('[data-role="gstin-address"]').value.trim();
      var notifyVal = Array.prototype.slice.call(document.querySelectorAll('[data-role="gstin-notify"]:checked')).map(function(el){ return el.value; });
      if (!numberVal){ return; }
      var editingGstin = target.getAttribute('data-gstin');
      if (editingGstin){
        var row = findGstin(editingGstin);
        row.entity = entityVal; row.state = stateVal; row.email = emailVal; row.mobile = mobileVal; row.unitAddress = addressVal; row.notifyUsers = notifyVal;
        logAudit('GSTIN Updated', 'GSTIN ' + editingGstin + ' details updated.');
      } else {
        GSTIN_REGISTRY.push({ gstin:numberVal, entity:entityVal, state:stateVal, email:emailVal, mobile:mobileVal, notifyUsers:notifyVal, unitAddress:addressVal, consentExpiry:'—', consentStatus:'soon' });
        logAudit('GSTIN Added', 'GSTIN ' + numberVal + ' (' + stateVal + ', ' + entityVal + ') added to the registry.');
      }
      state.gstinModal = null;
      render();
      return;
    }
    if (action === 'sort-cases'){
      var ckey = target.getAttribute('data-key');
      if (state.caseSort.key === ckey) state.caseSort.dir = state.caseSort.dir === 'asc' ? 'desc' : 'asc';
      else { state.caseSort.key = ckey; state.caseSort.dir = 'asc'; }
      render();
      return;
    }
    if (action === 'sort-gstin'){
      var key = target.getAttribute('data-key');
      if (state.gstinSort.key === key) state.gstinSort.dir = state.gstinSort.dir === 'asc' ? 'desc' : 'asc';
      else { state.gstinSort.key = key; state.gstinSort.dir = 'asc'; }
      render();
      return;
    }
    if (action === 'mark-all-read'){
      NOTIFICATIONS.forEach(function(n){ n.unread = false; });
      render();
      return;
    }
    if (action === 'ai-chat-quick'){
      var c5 = findCase(id);
      if (!c5) return;
      var q5 = target.getAttribute('data-q');
      c5.aiChat.push({ from:'user', text:q5 });
      c5.aiChat.push({ from:'ai', text: simulateAIReply(q5, c5) });
      render();
      return;
    }
    if (action === 'ai-chat-send'){
      var c6 = findCase(id);
      if (!c6) return;
      var input = document.querySelector('[data-role="ai-chat-input"]');
      var q6 = input ? input.value.trim() : '';
      if (!q6) return;
      c6.aiChat.push({ from:'user', text:q6 });
      c6.aiChat.push({ from:'ai', text: simulateAIReply(q6, c6) });
      render();
      return;
    }
    if (action === 'generate-draft'){
      var c7 = findCase(id);
      if (!c7) return;
      var tmpl = templateForCase(c7);
      var body = tmpl ? tmpl.body : 'With reference to the above notice, we submit our response as follows:\n\n[Response details to be added]';
      c7.replyDraft = 'To,\nThe Jurisdictional GST Officer, ' + c7.state + '\n\nSubject: Reply to ' + c7.code + ' dated ' + c7.issued + ' — ' + c7.noticeType + ' (GSTIN: ' + c7.gstin + ')\n\nSir/Madam,\n\n' + body + '\n\nRegards,\n' + c7.entity + (tmpl ? '\n\n[Drafted from Reply Template: ' + tmpl.name + ']' : '');
      c7.replyDraftSaved = false;
      render();
      return;
    }
    if (action === 'save-draft'){
      var c8 = findCase(id);
      if (!c8) return;
      var ta = document.querySelector('[data-role="reply-draft"]');
      c8.replyDraft = ta ? ta.value : c8.replyDraft;
      c8.replyDraftSaved = true;
      render();
      return;
    }
    if (action === 'save-rules'){
      state.rulesSaved = true;
      logAudit('Master Updated', 'Escalation Rules thresholds saved.');
      render();
      return;
    }
    if (action === 'open-add-case-modal'){ state.addCaseModal = {}; render(); return; }
    if (action === 'close-add-case-modal'){ state.addCaseModal = null; render(); return; }
    if (action === 'save-new-case'){
      function val(role){ var el = document.querySelector('[data-role="' + role + '"]'); return el ? el.value : ''; }
      var gstinVal = val('case-gstin'), codeVal = val('case-code'), issuedVal = val('case-issued').trim(), dueVal = val('case-due').trim();
      if (!gstinVal || !codeVal || !issuedVal || !dueVal){ window.alert('GSTIN, Notice Type, Date Issued and Due Date are required.'); return; }
      var consultantSel = val('case-consultant');
      var consultantRow = findConsultant(consultantSel);
      var newCase = createCaseFromFields({
        gstin: gstinVal, code: codeVal, docType: val('case-doctype'), forumLevel: val('case-forum'),
        financialYear: val('case-fy').trim(), issued: issuedVal, due: dueVal, section: val('case-section').trim(),
        din: val('case-din').trim(), personalHearing: document.querySelector('[data-role="case-ph"]').checked,
        hearingDate: val('case-hearing-date').trim(), assignedTo: val('case-assigned'),
        consultant: consultantRow ? consultantRow.name : null, status: val('case-status'),
        tax: val('case-tax'), interest: val('case-interest'), penalty: val('case-penalty'), ask: val('case-ask').trim()
      });
      CASES.push(newCase);
      logAudit('Case Added', newCase.id + ' added manually.');
      state.addCaseModal = null;
      render();
      return;
    }
    if (action === 'open-bulk-upload-modal'){ state.bulkUploadModal = {}; render(); return; }
    if (action === 'close-bulk-upload-modal'){ state.bulkUploadModal = null; render(); return; }
    if (action === 'download-case-template'){
      downloadCSV('gst-radar-case-bulk-upload-template.csv', bulkTemplateRows());
      logAudit('Export', 'Bulk case upload template downloaded.');
      return;
    }
    if (action === 'open-assign-modal'){ if (!isElevated()) return; state.assignModal = { caseId: target.getAttribute('data-id') }; render(); return; }
    if (action === 'close-assign-modal'){ state.assignModal = null; render(); return; }
    if (action === 'save-assign'){
      if (!isElevated()) return;
      var acId = target.getAttribute('data-id');
      var acCase = findCase(acId);
      var acSelect = document.querySelector('[data-role="assign-select"]');
      if (!acCase || !acSelect) return;
      var newAssignee = acSelect.value;
      if (acCase.assignedTo !== newAssignee){
        var oldAssignee = acCase.assignedTo;
        acCase.assignedTo = newAssignee;
        acCase.activity.push({ type:'system', actor:currentActorLabel(), text:'Reassigned from ' + oldAssignee + ' to ' + newAssignee + ' by ' + currentActorLabel() + '.', time:'Just now' });
        logAudit('Assignment', acCase.id + ' reassigned from ' + oldAssignee + ' to ' + newAssignee + '.');
      }
      state.assignModal = null;
      render();
      return;
    }
    if (action === 'add-template'){ if (!isAdmin()) return; state.templateModal = { mode:'add' }; render(); return; }
    if (action === 'edit-template'){ if (!isAdmin()) return; state.templateModal = { mode:'edit', id: target.getAttribute('data-id') }; render(); return; }
    if (action === 'close-template-modal'){ state.templateModal = null; render(); return; }
    if (action === 'delete-template'){
      if (!isAdmin()) return;
      var delTid = target.getAttribute('data-id');
      if (window.confirm('Delete this reply template?')){
        var tidx = REPLY_TEMPLATES.findIndex(function(t){ return t.id === delTid; });
        if (tidx >= 0) REPLY_TEMPLATES.splice(tidx, 1);
        logAudit('Template Deleted', 'Reply template ' + delTid + ' deleted.');
        render();
      }
      return;
    }
    if (action === 'save-template'){
      if (!isAdmin()) return;
      var tName = document.querySelector('[data-role="tmpl-name"]').value.trim();
      var tCode = document.querySelector('[data-role="tmpl-code"]').value.trim();
      var tCategory = document.querySelector('[data-role="tmpl-category"]').value.trim();
      var tBody = document.querySelector('[data-role="tmpl-body"]').value.trim();
      if (!tName) return;
      var editingTid = target.getAttribute('data-id');
      if (editingTid){
        var trow = findTemplate(editingTid);
        trow.name = tName; trow.noticeCode = tCode; trow.category = tCategory; trow.body = tBody;
        logAudit('Template Updated', 'Reply template "' + tName + '" updated.');
      } else {
        REPLY_TEMPLATES.push({ id:'t' + (REPLY_TEMPLATES.length + 1), name:tName, noticeCode:tCode, category:tCategory, body:tBody });
        logAudit('Template Added', 'Reply template "' + tName + '" added.');
      }
      state.templateModal = null;
      render();
      return;
    }
    if (action === 'open-master-modal'){ if (!isAdmin()) return; state.masterModal = { type: target.getAttribute('data-type') }; render(); return; }
    if (action === 'close-master-modal'){ state.masterModal = null; render(); return; }
    if (action === 'save-master'){
      if (!isAdmin()) return;
      var mType = target.getAttribute('data-type');
      function val(role){ var el = document.querySelector('[data-role="' + role + '"]'); return el ? el.value.trim() : ''; }
      function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,''); }
      if (mType === 'entity'){
        var newEntity = val('master-name');
        if (!newEntity) return;
        ENTITIES.push(newEntity);
        logAudit('Master Added', 'Entity "' + newEntity + '" added.');
      } else if (mType === 'notice'){
        var nCode = val('master-code'), nDesc = val('master-desc');
        if (!nCode) return;
        NOTICE_TYPES.push({ code:nCode, desc:nDesc });
        logAudit('Master Added', 'Notice type ' + nCode + ' added.');
      } else if (mType === 'doctype'){
        var dName = val('master-name'), dDesc = val('master-desc');
        if (!dName) return;
        DOC_TYPES.push({ key:slug(dName), name:dName, desc:dDesc });
        logAudit('Master Added', 'Document type "' + dName + '" added.');
      } else if (mType === 'forum'){
        var fName = val('master-name'), fShort = val('master-short'), fAuth = val('master-authority'), fSec = val('master-section'), fNote = val('master-desc');
        if (!fName || !fShort) return;
        FORUM_LEVELS.push({ key:slug(fShort), short:fShort, name:fName, authority:fAuth, section:fSec, note:fNote });
        logAudit('Master Added', 'Litigation forum level "' + fName + '" added.');
      } else if (mType === 'consultant'){
        var cnName = val('master-name'), cnType = val('master-short'), cnEmail = val('master-authority'), cnPhone = val('master-section'), cnSpec = val('master-desc');
        if (!cnName) return;
        CONSULTANTS.push({ id:'c' + (CONSULTANTS.length + 1), name:cnName, type:cnType || 'Consultant', email:cnEmail, phone:cnPhone, specialization:cnSpec });
        logAudit('Master Added', 'Consultant/Auditor "' + cnName + '" added.');
      }
      state.masterModal = null;
      render();
      return;
    }
    if (action === 'export-cases'){
      downloadCSV('gst-radar-cases.csv', caseCsvRows(CASES.filter(passesFilters)));
      logAudit('Export', 'Cases list exported to Excel.');
      return;
    }
    if (action === 'export-gstins'){
      var search = (state.filters.gstinSearch || '').toLowerCase();
      var gList = GSTIN_REGISTRY.filter(function(g){
        if (!search) return true;
        return (g.gstin + ' ' + g.entity + ' ' + g.state).toLowerCase().indexOf(search) >= 0;
      });
      gList = sortRows(gList, state.gstinSort.key, state.gstinSort.dir);
      var gHeader = ['GSTIN','Entity','State','Registered Email','Registered Mobile','Notify Users','Unit Address','Consent Expiry','Consent Status'];
      var gRows = gList.map(function(g){
        return [g.gstin, g.entity, g.state, g.email, g.mobile, g.notifyUsers.join('; '), g.unitAddress, g.consentExpiry, g.consentStatus];
      });
      downloadCSV('gst-radar-gstins-repository.csv', [gHeader].concat(gRows));
      logAudit('Export', 'GSTINs Repository exported to Excel.');
      return;
    }
    if (action === 'export-queue'){
      downloadCSV('gst-radar-my-queue.csv', caseCsvRows(queueCases()));
      logAudit('Export', 'My Queue exported to Excel.');
      return;
    }
    if (action === 'export-aging'){
      var repEnt = state.filters.reportsEntity || 'all';
      downloadCSV('gst-radar-case-aging.csv', caseCsvRows(CASES.filter(function(c){ return c.status !== 'closed' && (repEnt === 'all' || c.entity === repEnt); })));
      logAudit('Export', 'Case Aging report exported to Excel.');
      return;
    }
    if (action === 'print-case'){
      window.print();
      logAudit('Print', 'Case summary printed for ' + (state.selectedId || '') + '.');
      return;
    }
    if (action === 'cal-prev'){
      state.calMonth -= 1;
      if (state.calMonth < 0){ state.calMonth = 11; state.calYear -= 1; }
      render();
      return;
    }
    if (action === 'cal-next'){
      state.calMonth += 1;
      if (state.calMonth > 11){ state.calMonth = 0; state.calYear += 1; }
      render();
      return;
    }
    if (action === 'cal-today'){
      state.calYear = TODAY.year; state.calMonth = TODAY.month;
      render();
      return;
    }
    if (action === 'cal-view'){
      state.calView = target.getAttribute('data-view');
      render();
      return;
    }
    if (action === 'goto-calendar'){
      state.calYear = Number(target.getAttribute('data-year'));
      state.calMonth = Number(target.getAttribute('data-month'));
      state.view = 'calendar';
      render();
      return;
    }
    if (action === 'close-event-modal'){
      state.eventModal = null;
      render();
      return;
    }
    if (action === 'save-event'){
      var titleInput = document.querySelector('[data-role="event-title-input"]');
      var noteInput = document.querySelector('[data-role="event-note-input"]');
      var titleVal = titleInput ? titleInput.value.trim() : '';
      if (!titleVal || !state.eventModal) return;
      CUSTOM_EVENTS.push({ year:state.eventModal.year, month:state.eventModal.month, day:state.eventModal.day, title:titleVal, note:noteInput ? noteInput.value.trim() : '' });
      state.eventModal = null;
      render();
      return;
    }
    if (action === 'export-calendar'){
      downloadCSV('gst-radar-calendar-' + MONTHS[state.calMonth] + '-' + state.calYear + '.csv', monthCsvRows(state.calYear, state.calMonth, state.filters.calEntity, state.filters.calMyOnly));
      logAudit('Export', 'Calendar for ' + MONTHS[state.calMonth] + ' ' + state.calYear + ' exported to Excel.');
      return;
    }
    if (action === 'download-draft'){
      var c9 = findCase(id);
      if (!c9) return;
      var ta9 = document.querySelector('[data-role="reply-draft"]');
      var content9 = ta9 ? ta9.value : c9.replyDraft;
      if (!content9) return;
      downloadText(c9.id + '-draft-reply.txt', content9);
      logAudit('Download', 'Draft reply downloaded for ' + c9.id + '.');
      return;
    }
    if (action === 'print-draft'){
      var c10 = findCase(id);
      if (!c10) return;
      var ta10 = document.querySelector('[data-role="reply-draft"]');
      var content10 = ta10 ? ta10.value : c10.replyDraft;
      if (!content10) return;
      var esc = String(content10).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      var w = window.open('', '_blank');
      if (w){
        w.document.write('<html><head><title>' + c10.id + ' - Draft Reply</title><style>body{font-family:Georgia,serif;white-space:pre-wrap;padding:48px;line-height:1.7;font-size:14px;}</style></head><body>' + esc + '</body></html>');
        w.document.close();
        w.focus();
        w.print();
      }
      logAudit('Print', 'Draft reply printed for ' + c10.id + '.');
      return;
    }
  });

  document.getElementById('app').addEventListener('keydown', function(ev){
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('tr[data-action="open-case"]')){
      ev.preventDefault();
      ev.target.click();
    }
    if (ev.key === 'Enter' && ev.target.matches('[data-role="ai-chat-input"]')){
      ev.preventDefault();
      var sendBtn = document.querySelector('[data-action="ai-chat-send"]');
      if (sendBtn) sendBtn.click();
    }
  });

  document.getElementById('app').addEventListener('change', function(ev){
    var filter = ev.target.getAttribute('data-filter');
    if (filter){ state.filters[filter] = ev.target.value; render(); return; }
    var toggle = ev.target.getAttribute('data-toggle');
    if (toggle){ state.filters[toggle] = ev.target.checked; render(); return; }
    var pref = ev.target.getAttribute('data-pref');
    if (pref){
      var parts = pref.split(':');
      var prefRow = NOTIF_PREFS.filter(function(p){ return p.key === parts[0]; })[0];
      if (prefRow){ prefRow[parts[1]] = ev.target.checked; state.notifPrefsSaved = false; render(); }
      return;
    }
    var widgetKey = ev.target.getAttribute('data-widget');
    if (widgetKey){
      if (!isAdmin()) return;
      var widgetRow = DASHBOARD_WIDGETS.filter(function(w){ return w.key === widgetKey; })[0];
      if (widgetRow){ widgetRow.visible = ev.target.checked; state.dashboardConfigSaved = false; render(); }
      return;
    }
    if (ev.target.getAttribute('data-role') === 'bulk-upload-input'){
      var file = ev.target.files && ev.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e){
        var rows = parseCSV(String(e.target.result));
        rows.shift(); // drop header row
        var added = 0, skipped = 0;
        rows.forEach(function(row){
          var fields = rowToCaseFields(row);
          if (!fields.gstin || !fields.code || !fields.issued || !fields.due){ skipped++; return; }
          CASES.push(createCaseFromFields(fields));
          added++;
        });
        logAudit('Bulk Upload', added + ' case(s) added from uploaded template' + (skipped ? ', ' + skipped + ' row(s) skipped (missing required fields)' : '') + '.');
        state.bulkUploadModal = { result: added + ' case(s) added successfully.' + (skipped ? ' ' + skipped + ' row(s) were skipped because GSTIN, Notice Type Code, Date Issued or Due Date was missing.' : '') };
        render();
      };
      reader.readAsText(file);
      return;
    }
  });

  document.getElementById('app').addEventListener('input', function(ev){
    var searchKey = ev.target.getAttribute('data-search');
    if (!searchKey) return;
    var cursorPos = ev.target.selectionStart;
    state.filters[searchKey] = ev.target.value;
    render();
    var newInput = document.querySelector('[data-search="' + searchKey + '"]');
    if (newInput){ newInput.focus(); newInput.setSelectionRange(cursorPos, cursorPos); }
  });

  document.getElementById('app').addEventListener('dblclick', function(ev){
    var cell = ev.target.closest('.cal-cell[data-year]');
    if (!cell) return;
    state.eventModal = { year: Number(cell.getAttribute('data-year')), month: Number(cell.getAttribute('data-month')), day: Number(cell.getAttribute('data-day')) };
    render();
  });

  render();
})();
</script>
</body>
</html>
