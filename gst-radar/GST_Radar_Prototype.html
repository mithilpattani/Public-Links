<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GST Radar</title>
</head>
<body>
<style>
  :root{
    --ink:#2A2A2A;
    --paper:#F3F6FA;
    --surface:#FFFFFF;
    --line:#DEE4EA;
    --line-strong:#C7D0D9;
    --muted:#63707B;

    --accent:#008DD0;
    --accent-ink:#2957A4;
    --accent-fg:#FFFFFF;
    --accent-soft:#E1F1FA;
    --focus:#008DD0;

    --st-open:#2957A4;
    --st-progress:#F87C09;
    --st-responded:#7C5295;
    --st-closed:#1E8E5A;
    --st-escalated:#D33F3F;
    --st-fg:#FFFFFF;

    --review-bg:#EDF1F4;
    --review-fg:#4A5560;
    --review-line:#D7DEE4;

    --hol-national:#B8860B;
    --hol-state:#0E8A82;
    --custom-event:#8B3FA6;

    --shadow-card: 0 1px 2px rgba(42,42,42,0.08), 0 1px 1px rgba(42,42,42,0.04);
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    --font-mono: "Cascadia Code", ui-monospace, "SF Mono", Consolas, "Roboto Mono", monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#EDEFF1; --paper:#15191D; --surface:#1D2227; --line:#2C333A; --line-strong:#3A434B; --muted:#8B98A3;
      --accent:#39ABE0; --accent-ink:#8FC6ED; --accent-fg:#0B2233; --accent-soft:#1B3B4C; --focus:#39ABE0;
      --st-open:#5F8FD1; --st-progress:#FF9B3E; --st-responded:#A57FC4; --st-closed:#3FAE7C; --st-escalated:#E2665F; --st-fg:#14181C;
      --review-bg:#1E252B; --review-fg:#AAB6C0; --review-line:#2E363E;
      --hol-national:#E0B24A; --hol-state:#3FC2B8; --custom-event:#C68EDB;
      --shadow-card: 0 1px 2px rgba(0,0,0,0.5), 0 1px 1px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --ink:#EDEFF1; --paper:#15191D; --surface:#1D2227; --line:#2C333A; --line-strong:#3A434B; --muted:#8B98A3;
    --accent:#39ABE0; --accent-ink:#8FC6ED; --accent-fg:#0B2233; --accent-soft:#1B3B4C; --focus:#39ABE0;
    --st-open:#5F8FD1; --st-progress:#FF9B3E; --st-responded:#A57FC4; --st-closed:#3FAE7C; --st-escalated:#E2665F; --st-fg:#14181C;
    --review-bg:#1E252B; --review-fg:#AAB6C0; --review-line:#2E363E;
    --hol-national:#E0B24A; --hol-state:#3FC2B8; --custom-event:#C68EDB;
    --shadow-card: 0 1px 2px rgba(0,0,0,0.5), 0 1px 1px rgba(0,0,0,0.35);
  }
  :root[data-theme="light"]{
    --ink:#2A2A2A; --paper:#F3F6FA; --surface:#FFFFFF; --line:#DEE4EA; --line-strong:#C7D0D9; --muted:#63707B;
    --accent:#008DD0; --accent-ink:#2957A4; --accent-fg:#FFFFFF; --accent-soft:#E1F1FA; --focus:#008DD0;
    --st-open:#2957A4; --st-progress:#F87C09; --st-responded:#7C5295; --st-closed:#1E8E5A; --st-escalated:#D33F3F; --st-fg:#FFFFFF;
    --review-bg:#EDF1F4; --review-fg:#4A5560; --review-line:#D7DEE4;
    --hol-national:#B8860B; --hol-state:#0E8A82; --custom-event:#8B3FA6;
    --shadow-card: 0 1px 2px rgba(42,42,42,0.08), 0 1px 1px rgba(42,42,42,0.04);
  }

  *{box-sizing:border-box;}
  .app{font-family:var(--font-ui); background:var(--paper); color:var(--ink); min-height:100vh; line-height:1.45;}
  .app button, .app select, .app textarea, .app input{ font-family:inherit; }
  h1,h2,h3{text-wrap:balance; margin:0;}
  button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--focus); outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  .login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:
      radial-gradient(1100px 520px at 15% -10%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%),
      var(--paper);
  }
  .login-card{width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow-card); padding:32px 30px;}
  .login-brand{display:flex; align-items:center; gap:9px; margin-bottom:26px;}
  .login-brand .dot{width:9px; height:9px; border-radius:50%; background:var(--accent);}
  .login-brand-name{font-weight:700; font-size:17px; color:var(--accent); letter-spacing:-0.01em;}
  .login-brand-sub{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:2px;}
  .login-card h1{font-size:19px; font-weight:650; margin-bottom:4px;}
  .login-card p.sub{font-size:13px; color:var(--muted); margin:0 0 22px;}
  .field{display:flex; flex-direction:column; gap:5px; margin-bottom:14px;}
  .field label{font-size:11.5px; font-weight:650; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  .field input{padding:10px 12px; border:1px solid var(--line-strong); border-radius:8px; background:var(--paper); color:var(--ink); font-size:13.5px;}
  .login-foot{margin-top:16px; font-size:11.5px; color:var(--muted); line-height:1.5;}

  .shell{display:flex; min-height:100vh;}
  .sidebar{width:224px; flex:none; background:var(--surface); border-right:1px solid var(--line); padding:22px 14px 16px; display:flex; flex-direction:column; gap:18px; position:sticky; top:0; height:100vh; overflow-y:auto;}
  .brand{display:flex; align-items:center; gap:9px; padding:0 8px 4px; cursor:pointer; background:none; border:none; text-align:left; width:100%;}
  .brand .dot{width:9px; height:9px; border-radius:50%; background:var(--accent); flex:none; animation:ping 2.4s ease-out infinite;}
  @keyframes ping{
    0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent);}
    70%{box-shadow:0 0 0 8px transparent;}
    100%{box-shadow:0 0 0 0 transparent;}
  }
  .brand-text{display:flex; flex-direction:column; line-height:1.1;}
  .brand-name{font-weight:700; font-size:16px; color:var(--accent); letter-spacing:-0.01em;}
  .brand-sub{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:2px;}

  .nav-group{display:flex; flex-direction:column; gap:2px;}
  .nav-group-label{font-size:10.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; padding:10px 10px 4px;}
  .nav-item{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; font-size:13.5px; font-weight:600; color:var(--muted); cursor:pointer; border:none; background:none; text-align:left; width:100%;}
  .nav-item:hover{background:var(--paper); color:var(--ink);}
  .nav-item.active{background:var(--accent-soft); color:var(--accent-ink);}
  .nav-icon{width:17px; height:17px; flex:none; display:flex; align-items:center; justify-content:center;}
  .nav-icon svg{width:16px; height:16px;}
  .nav-badge{margin-left:auto; font-size:10.5px; font-weight:700; background:var(--st-escalated); color:#fff; border-radius:999px; padding:1px 6px; font-variant-numeric:tabular-nums;}
  .sidebar-foot{margin-top:auto; padding-top:14px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); padding-left:8px; line-height:1.5;}

  .content{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 28px; background:var(--surface); border-bottom:1px solid var(--line); flex-wrap:wrap;}
  .tenant{font-size:13px; color:var(--muted);}
  .tenant strong{color:var(--ink); font-weight:650;}
  .topbar-right{display:flex; align-items:center; gap:16px;}
  .seg{display:inline-flex; align-items:center; gap:2px; padding:3px; border:1px solid var(--line-strong); border-radius:999px; background:var(--paper);}
  .seg button{padding:6px 14px; border-radius:999px; border:none; background:transparent; color:var(--muted); font-weight:600; font-size:12.5px; cursor:pointer;}
  .seg button.active{background:var(--accent-soft); color:var(--accent-ink);}
  .bell-wrap{position:relative;}
  .bell-btn{position:relative; display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:8px; border:1px solid transparent; background:none; color:var(--muted); cursor:pointer;}
  .bell-btn:hover{background:var(--paper); color:var(--ink);}
  .bell-btn svg{width:17px; height:17px;}
  .bell-badge{position:absolute; top:2px; right:2px; min-width:15px; height:15px; padding:0 3px; border-radius:999px; background:var(--st-escalated); color:#fff; font-size:9.5px; font-weight:700; display:flex; align-items:center; justify-content:center; font-variant-numeric:tabular-nums;}
  .notif-dropdown{position:absolute; top:calc(100% + 8px); right:0; width:360px; max-height:420px; overflow-y:auto; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,.18); z-index:40; padding:14px 16px;}
  .notif-dropdown-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;}
  .notif-dropdown-head h2{font-size:14px; font-weight:650;}
  .notif-dropdown-foot{font-size:11px; color:var(--muted); margin-top:10px; padding-top:10px; border-top:1px solid var(--line); line-height:1.5;}
  .who{display:flex; align-items:center; gap:8px; cursor:pointer; background:none; border:none; padding:2px; border-radius:8px;}
  .who:hover{background:var(--paper);}
  .avatar{width:30px; height:30px; border-radius:50%; background:var(--accent); color:var(--accent-fg); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;}
  .who-meta{display:flex; flex-direction:column; line-height:1.1; text-align:left;}
  .who-name{font-size:13px; font-weight:600;}
  .who-role{font-size:11px; color:var(--muted);}

  main{max-width:1360px; width:100%; margin:0 auto; padding:28px 32px 64px;}
  .page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
  .page-head h1{font-size:23px; font-weight:650; letter-spacing:-0.01em;}
  .page-head p{margin:4px 0 0; color:var(--muted); font-size:14px;}

  .kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
  @media (max-width:760px){ .kpi-grid{grid-template-columns:repeat(2,1fr);} }
  .kpi-card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px 18px; box-shadow:var(--shadow-card);}
  .kpi-card .label{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:650; margin-bottom:6px;}
  .kpi-card .num{font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1;}
  .kpi-card .sub{font-size:11.5px; color:var(--muted); margin-top:6px;}

  .grid-2{display:grid; grid-template-columns:1.3fr 1fr; gap:20px; align-items:start;}
  @media (max-width:860px){ .grid-2{grid-template-columns:1fr;} }
  .card{background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow-card); padding:18px 20px;}
  .card-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px;}
  .card-head h2{font-size:14px; font-weight:650;}
  .card-note{font-size:11.5px; color:var(--muted); margin-top:12px; line-height:1.5;}
  .col-stack{display:flex; flex-direction:column; gap:20px; min-width:0;}

  .bar-list{display:flex; flex-direction:column; gap:12px;}
  .bar-row{display:grid; grid-template-columns:104px 1fr 28px; align-items:center; gap:10px; font-size:12.5px;}
  .bar-track{height:8px; border-radius:999px; background:var(--paper); overflow:hidden;}
  .bar-fill{height:100%; background:var(--accent); border-radius:999px;}
  .bar-row .count{font-variant-numeric:tabular-nums; text-align:right; color:var(--muted); font-weight:650;}

  .deadline-list, .notif-list{display:flex; flex-direction:column; gap:0;}
  .deadline-row, .notif-row{display:flex; align-items:flex-start; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); cursor:pointer;}
  .deadline-row:last-child, .notif-row:last-child{border-bottom:none; padding-bottom:0;}
  .deadline-row:first-child, .notif-row:first-child{padding-top:0;}
  .deadline-main{flex:1; min-width:0;}
  .deadline-ref{font-family:var(--font-mono); font-size:11.5px; color:var(--muted);}
  .deadline-title{font-size:13.5px; font-weight:600; margin-top:1px;}
  .deadline-meta{font-size:12px; color:var(--muted); margin-top:2px;}

  .activity-feed{display:flex; flex-direction:column; gap:13px;}
  .feed-row{display:flex; gap:10px; cursor:pointer;}
  .feed-dot{width:7px; height:7px; border-radius:50%; background:var(--accent); margin-top:6px; flex:none;}
  .feed-text{font-size:13px;}
  .feed-text b{font-family:var(--font-mono); font-weight:650; font-size:12px;}

  .tag{display:inline-flex; align-items:center; padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:650; white-space:nowrap; border:1px solid var(--review-line); background:var(--review-bg); color:var(--review-fg);}
  .pill{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:650; white-space:nowrap;}
  .pill-good{background:color-mix(in srgb, var(--st-closed) 14%, transparent); color:var(--st-closed); border:1px solid var(--st-closed);}
  .pill-warn{background:color-mix(in srgb, var(--st-progress) 16%, transparent); color:var(--st-progress); border:1px solid var(--st-progress);}
  .pill-bad{background:color-mix(in srgb, var(--st-escalated) 14%, transparent); color:var(--st-escalated); border:1px solid var(--st-escalated);}
  .pill-dot{width:6px; height:6px; border-radius:50%; background:currentColor;}

  .badge{display:inline-flex; align-items:center; white-space:nowrap; padding:4px 11px; border-radius:999px; font-size:11.5px; font-weight:700; color:var(--st-fg); letter-spacing:.01em;}
  .badge-open{background:var(--st-open);}
  .badge-progress{background:var(--st-progress);}
  .badge-responded{background:var(--st-responded);}
  .badge-closed{background:var(--st-closed);}

  .flag-escalated{display:inline-flex; align-items:center; gap:4px; padding:3px 9px 3px 6px; border-radius:999px; font-size:11px; font-weight:700; background:transparent; border:1px solid var(--st-escalated); color:var(--st-escalated); white-space:nowrap;}
  .flag-escalated svg{width:11px; height:11px; flex:none;}

  .filter-bar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  .filter-bar select{padding:8px 12px; border:1px solid var(--line-strong); border-radius:8px; background:var(--surface); color:var(--ink); font-size:13px; min-width:150px;}
  .filter-bar input[type="text"], .search-input{padding:8px 12px; border:1px solid var(--line-strong); border-radius:8px; background:var(--surface); color:var(--ink); font-size:13px; min-width:220px;}
  th.sortable{cursor:pointer; user-select:none;}
  th.sortable:hover{color:var(--ink);}

  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--surface); box-shadow:var(--shadow-card);}
  table{width:100%; border-collapse:collapse; font-size:13.5px; min-width:640px;}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:650; padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap;}
  td{padding:13px 14px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.clickable{cursor:pointer;}
  tbody tr.clickable:hover{background:var(--paper);}
  @keyframes newRowPulse{
    0%, 100% { background-color: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
    50% { background-color: color-mix(in srgb, var(--accent) 24%, var(--surface)); }
  }
  tbody tr.row-new{ animation: newRowPulse 1.6s ease-in-out infinite; }
  tbody tr.row-new:hover{ animation-play-state: paused; background-color: color-mix(in srgb, var(--accent) 24%, var(--surface)); }
  .notice-type{color:var(--muted); font-size:12.5px; margin-top:2px;}
  .state-line{color:var(--muted); font-size:12px; margin-top:2px;}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  .due-overdue{color:var(--st-escalated); font-weight:700;}
  .due-note{display:block; font-size:11px; font-weight:600; margin-top:2px;}
  .status-cell{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .empty-row td{padding:40px 14px; text-align:center; color:var(--muted);}

  .back-link{display:inline-flex; align-items:center; gap:6px; background:none; border:none; cursor:pointer; color:var(--muted); font-size:13px; font-weight:600; padding:0; margin-bottom:16px;}
  .back-link:hover{color:var(--accent-ink);}
  .detail-head{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:22px; flex-wrap:wrap;}
  .detail-head .ref{font-family:var(--font-mono); font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;}
  .detail-head h1{font-size:21px; font-weight:650; margin-top:4px;}
  .detail-badges{display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .detail-grid{display:grid; grid-template-columns:1fr 336px; gap:24px; align-items:start;}
  @media (max-width:900px){ .detail-grid{grid-template-columns:1fr;} }
  .col-side{display:flex; flex-direction:column; gap:16px;}

  .kv{display:grid; grid-template-columns:126px 1fr; gap:9px 12px;}
  .kv dt{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:650; padding-top:1px;}
  .kv dd{margin:0; font-size:13.5px;}

  .thread{display:flex; flex-direction:column; gap:14px; margin-bottom:16px;}
  .entry{display:flex; gap:10px;}
  .entry-icon{width:26px; height:26px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; background:var(--paper); border:1px solid var(--line); color:var(--muted);}
  .entry-icon.remark{background:var(--accent-soft); color:var(--accent-ink); border-color:transparent;}
  .entry-body{flex:1; min-width:0;}
  .entry-meta{display:flex; align-items:baseline; gap:8px; font-size:12.5px; flex-wrap:wrap;}
  .entry-meta .name{font-weight:650;}
  .entry-meta .time{color:var(--muted); font-size:11.5px;}
  .entry-text{font-size:13.5px; margin-top:3px; white-space:pre-line;}
  .entry.system .entry-text, .entry.status .entry-text{color:var(--muted); font-style:italic; border-left:2px solid var(--line-strong); padding-left:10px;}
  .entry.status.st-open .entry-text{border-color:var(--st-open);}
  .entry.status.st-progress .entry-text{border-color:var(--st-progress);}
  .entry.status.st-responded .entry-text{border-color:var(--st-responded);}
  .entry.status.st-closed .entry-text{border-color:var(--st-closed);}
  .entry.escalation .entry-text{border-left:2px solid var(--st-escalated); padding-left:10px; color:var(--st-escalated); font-style:italic;}
  .file-chip{display:inline-flex; align-items:center; gap:6px; margin-top:4px; padding:4px 10px; border-radius:6px; background:var(--paper); border:1px solid var(--line); font-size:12px; font-family:var(--font-mono);}

  .card textarea, .composer textarea, .composer input[type="text"]{width:100%; border:1px solid var(--line-strong); border-radius:8px; padding:10px 12px; font-size:13.5px; background:var(--paper); color:var(--ink);}
  .card textarea, .composer textarea{min-height:64px; resize:vertical;}
  .composer-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px;}
  .chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .chip-btn{padding:5px 12px; border-radius:999px; border:1px solid var(--line-strong); background:var(--surface); color:var(--muted); font-size:12px; font-weight:600; cursor:pointer;}
  .chip-btn:hover{border-color:var(--accent); color:var(--accent-ink);}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 16px; border-radius:8px; font-size:13px; font-weight:650; cursor:pointer; border:1px solid transparent; white-space:nowrap;}
  .btn-primary{background:var(--accent); color:var(--accent-fg);}
  .btn-primary:hover{background:var(--accent-ink);}
  .btn-ghost{background:transparent; border-color:var(--line-strong); color:var(--ink);}
  .btn-ghost:hover{background:var(--paper);}
  .btn-sm{padding:6px 12px; font-size:12px;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn-block{width:100%;}

  .status-current{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .status-current .badge{font-size:12.5px; padding:5px 13px;}

  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmtDateTime(baseDateStr, dayOffset, hh, mm){
    var d = new Date(baseDateStr);
    d.setDate(d.getDate() + dayOffset);
    var hh12 = (hh % 12) || 12;
    var ampm = hh < 12 ? 'AM' : 'PM';
    return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear() + ', ' + hh12 + ':' + (mm < 10 ? '0' + mm : mm) + ' ' + ampm;
  }

  function pad2(n){ return n < 10 ? '0' + n : '' + n; }
  function fmtDate(d){ return pad2(d.getDate()) + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
  function addDays(dateStr, n){ var d = new Date(dateStr); d.setDate(d.getDate() + n); return fmtDate(d); }
  function addMonths(dateStr, n){ var d = new Date(dateStr); d.setMonth(d.getMonth() + n); return fmtDate(d); }
  function todayDate(){ return new Date(TODAY.year, TODAY.month, TODAY.day); }
  function todayStr(){ return fmtDate(todayDate()); }
  function daysFromToday(dateStr){ return Math.round((new Date(dateStr) - todayDate()) / 86400000); }
  // <input type="date"> gives yyyy-mm-dd; the prototype stores dates as "DD Mon YYYY".
  function isoToDisplay(iso){ if (!iso) return ''; var p = iso.split('-'); return fmtDate(new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]))); }
  function displayToIso(s){ var d = new Date(s); if (isNaN(d.getTime())) return ''; return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

  function simulateAIReply(question, c){
    var q = question.toLowerCase();
    if (q.indexOf('deadline') >= 0 || q.indexOf('due') >= 0){
      return 'The response is due by ' + c.due + '.' + (c.overdue ? ' This date has already passed — treat as a priority.' : ' That is the current target date from the notice.');
    }
    if (q.indexOf('amount') >= 0 || q.indexOf('demand') >= 0 || q.indexOf('money') >= 0){
      return 'The amount referenced in this notice is ' + c.amount + '.';
    }
    if (q.indexOf('summar') >= 0){
      return c.code + ' — ' + c.noticeType + '. Key ask: ' + c.ask;
    }
    if (q.indexOf('gstin') >= 0 || q.indexOf('state') >= 0){

  function issuedInRange(c, range){

    if (range === 'fy'){ var fyStart = new Date(t.getMonth() >= 3 ? t.getFullYear() : t.getFullYear() - 1, 3, 1); return d >= fyStart; }
    return true;

    if (state.filters.status === 'escalated' && !c.escalated) return false;

    if (state.filters.status !== 'all' && state.filters.status !== 'escalated' && state.filters.status !== 'reopened' && c.status !== state.filters.status) return false;
    if (state.filters.forum !== 'all' && c.forumLevel !== state.filters.forum) return false;
    if (state.filters.doc !== 'all' && c.docType !== state.filters.doc) return false;
    if (state.filters.fy !== 'all' && c.financialYear !== state.filters.fy) return false;
    if (!issuedInRange(c, state.filters.issuedRange)) return false;
    if (state.filters.mine && queueCases().indexOf(c) < 0) return false;
    var q = (state.filters.caseSearch || '').toLowerCase();
    if (q && searchText(c).toLowerCase().indexOf(q) < 0) return false;
    return true;
  }

  function csvEscape(v){
    var s = v === null || v === undefined ? '' : String(v);
    if (s.indexOf(',') >= 0 || s.indexOf('"') >= 0 || s.indexOf('\n') >= 0){ s = '"' + s.replace(/"/g,'""') + '"'; }
    return s;
  }
  function parseCSV(text){
    var rows = [];
    var row = [];
    var field = '';
    var inQuotes = false;
    text = text.replace(/\r\n/g, '\n');
    for (var i = 0; i < text.length; i++){
      var ch = text[i];
      if (inQuotes){
        if (ch === '"'){
          if (text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
        } else { field += ch; }
      } else {
        if (ch === '"'){ inQuotes = true; }
        else if (ch === ','){ row.push(field); field = ''; }
        else if (ch === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
        else { field += ch; }
      }
    }
    if (field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(function(r){ return r.length > 1 || (r[0] && r[0].trim()); });
  }

  function downloadCSV(filename, rows){
    var csv = rows.map(function(r){ return r.map(csvEscape).join(','); }).join('\r\n');
    var blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function downloadText(filename, text){
    var blob = new Blob([text], { type:'text/plain;charset=utf-8;' });

    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function sortCasesForDisplay(list, sortState){
    return list.slice().sort(function(a,b){

      var av, bv;
      if (sortState.key === 'due' || sortState.key === 'issued'){ av = new Date(a[sortState.key]); bv = new Date(b[sortState.key]); }
      else if (sortState.key === 'id'){ av = a.ref.toLowerCase(); bv = b.ref.toLowerCase(); }
      else { av = (a[sortState.key]||'').toString().toLowerCase(); bv = (b[sortState.key]||'').toString().toLowerCase(); }
      if (av < bv) return sortState.dir === 'asc' ? -1 : 1;
      if (av > bv) return sortState.dir === 'asc' ? 1 : -1;
      return 0;
    });
  }

  // ---- Mentions / tagging (BRD 6.25)
  function taggableUsers(c){
    var me = currentUserName();
    return USERS.filter(function(u){ return u.status === 'active' && u.name !== me && inScope(c.entity, u); });
  }
  function renderMentions(text){
    var names = USERS.map(function(u){ return u.name; }).sort(function(a,b){ return b.length - a.length; });
    var out = text;
    names.forEach(function(n){ out = out.split('@' + n).join('\u0001' + n + '\u0002'); });
    return out.replace(/\u0001([^\u0002]+)\u0002/g, '<span class="mention">@$1</span>');
  }

  // ---- Extension / adjournment requests (BRD 6.20)
  var EXT_STATUS_PILL = { 'Draft':'tag', 'Pending Internal Approval':'pill pill-warn', 'Approved for Submission':'pill pill-warn', 'Submitted':'pill pill-warn', 'Granted':'pill pill-good', 'Partially Granted':'pill pill-good', 'Rejected':'pill pill-bad', 'No Response':'pill pill-bad', 'Withdrawn':'tag' };
  function renderExtensionCard(c){
    if (!c.extensions.length) return '';
    var rows = c.extensions.map(function(x){
      var acts = [];
      if (x.status === 'Draft' && can('ext.draft')){ acts.push(['letter','Edit Letter']); acts.push(['submit-approval','Submit for Approval']); }
      if (x.status === 'Pending Internal Approval' && can('ext.approve')){ acts.push(['approve','Approve']); acts.push(['return','Return to Draft']); }
      if (x.status === 'Approved for Submission' && can('ext.draft')){ acts.push(['letter','View Letter']); acts.push(['submitted','Record Submission']); }
      if (x.status === 'Submitted' && can('ext.record')){ acts.push(['outcome','Record Outcome']); }
      var btns = acts.map(function(a){
        var isModal = a[0] === 'letter' || a[0] === 'submitted' || a[0] === 'outcome';
        return '<button class="btn btn-ghost btn-sm" data-action="' + (isModal ? 'open-ext-modal' : 'ext-step') + '" data-id="' + c.id + '" data-ext="' + x.id + '" data-mode="' + a[0] + '">' + a[1] + '</button>';
      }).join(' ');
      var pillCls = EXT_STATUS_PILL[x.status] || 'tag';
      var pill = pillCls === 'tag' ? '<span class="tag">' + x.status + '</span>' : '<span class="' + pillCls + '"><span class="pill-dot"></span>' + x.status + '</span>';
      return '<tr><td>' + x.type + '<div class="state-line">' + x.grounds + '</div></td><td class="mono">' + x.current + '</td><td class="mono">' + x.requested + '</td><td>' + pill +
        (x.submittedOn ? '<div class="state-line">Submitted ' + x.submittedOn + ' via ' + x.mode + (x.ack ? ' &middot; ' + x.ack : '') + '</div>' : '') +
        (x.grantedDate ? '<div class="state-line">Granted to ' + x.grantedDate + '</div>' : '') +
        '</td><td style="white-space:nowrap;">' + (btns || '<span class="muted-note">&mdash;</span>') + '</td></tr>';
    }).join('');
    var adjCount = c.extensions.filter(function(x){ return x.type.indexOf('Adjournment') === 0; }).length;
    return '<div class="card"><div class="card-head"><h2>Extension &amp; Adjournment Requests</h2><span class="tag">' + c.extensions.length + ' request' + (c.extensions.length === 1 ? '' : 's') + (adjCount ? ' &middot; ' + adjCount + ' adjournment' + (adjCount === 1 ? '' : 's') : '') + '</span></div>' +
      '<div class="table-wrap"><table><thead><tr><th>Type / Grounds</th><th>Current</th><th>Requested</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="card-note">GST Radar prepares and tracks the request; filing it with the department is done outside the tool. The case due date changes only when an outcome is recorded as Granted.</div></div>';
  }
  function extensionLetter(c, x){
    var tmpl = REPLY_TEMPLATES.filter(function(t){ return t.category === (x.type.indexOf('Adjournment') === 0 ? 'Adjournment Request' : 'Extension Request'); })[0];
    var body = (tmpl ? tmpl.body : 'We request an extension up to {requested} on the grounds of {grounds}. {remarks}')
      .replace('{requested}', x.requested).replace('{current}', x.current).replace('{grounds}', x.grounds.toLowerCase()).replace('{remarks}', x.remarks || '');
    return 'To,\nThe Proper Officer, ' + c.state + '\n\nSubject: Request for ' + (x.type.indexOf('Adjournment') === 0 ? 'adjournment of personal hearing' : 'extension of time to reply') + ' — ' + c.code + ' (DIN ' + c.din + ') dated ' + c.issued + ', GSTIN ' + c.gstin + '\n\nSir/Madam,\n\n' + body + '\n\nRegards,\nAuthorised Signatory\n' + c.entity + (tmpl ? '\n\n[Drafted from Reply Template: ' + tmpl.name + ' — review before filing]' : '');
  }
  function findExt(c, id){ for (var i=0;i<c.extensions.length;i++){ if (c.extensions[i].id === id) return c.extensions[i]; } return null; }
  function renderExtModal(){
    var m = state.extModal;
    if (!m) return '';
    var c = findCase(m.caseId);
    var x = m.extId ? findExt(c, m.extId) : null;
    var inner = '';
    if (m.mode === 'new'){
      var adjCount = c.extensions.filter(function(e){ return e.type.indexOf('Adjournment') === 0; }).length;
      var extCount = c.extensions.length;
      inner = '<h2>Request Extension or Adjournment</h2><p class="sub">' + c.ref + ' — ' + c.code + ', ' + c.entity + '</p>' +
        '<div class="info-box">Current due date <b>' + c.due + '</b>' + (c.personalHearing && c.hearingDate ? ' &middot; hearing <b>' + c.hearingDate + '</b>' : '') + ' &middot; ' + extCount + ' previous request' + (extCount === 1 ? '' : 's') + ' on this case.</div>' +
        (adjCount >= 2 ? '<div class="warn-box"><b>Section 75(5) check:</b> this case already has ' + adjCount + ' adjournment requests. An adjournment may not be granted more than three times to a party during the proceeding.</div>' : '') +
        '<div class="field"><label>Request Type</label><select data-role="ext-type"><option>Extension of Time to Reply</option>' + (c.personalHearing && c.hearingDate ? '<option>Adjournment of Personal Hearing</option>' : '') + '</select></div>' +
        '<div class="field"><label>Requested New Date *</label><input type="date" data-role="ext-date" value="' + displayToIso(addDays(c.due, 15)) + '"/></div>' +
        '<div class="field"><label>Grounds *</label><select data-role="ext-grounds">' + reasonOptions('Extension grounds') + '</select></div>' +
        '<div class="field"><label>Remarks</label><textarea data-role="ext-remarks" placeholder="Specific facts supporting the request"></textarea></div>' +
        '<div class="modal-actions"><button class="btn btn-ghost btn-sm" data-action="close-ext-modal">Cancel</button><button class="btn btn-primary btn-sm" data-action="save-ext-new" data-id="' + c.id + '">Create Draft and Letter</button></div>';
    } else if (m.mode === 'letter'){
      inner = '<h2>' + x.type + ' — Letter</h2><p class="sub">' + c.ref + ' &middot; ' + x.status + '</p>' +

  // ---- Litigation forum change (BRD 6.17)
  function renderForumModal(){
    var m = state.forumModal;
    if (!m) return '';
    var c = findCase(m.caseId);
    var types = reasonsFor('Forum change');
    var type = m.type || types[0].label;
    var cur = FORUM_LEVELS.map(function(f){ return f.key; }).indexOf(c.forumLevel);
    var defaultTo = m.to || (type === 'Remand' ? FORUM_LEVELS[Math.max(cur - 1, 0)].key : (type === 'Writ Petition' ? 'high_court' : (type === 'Transfer of Jurisdiction' || type === 'Correction of Entry' ? c.forumLevel : FORUM_LEVELS[Math.min(cur + 1, FORUM_LEVELS.length - 1)].key)));
    var target = forumInfo(defaultTo);
    var isAppeal = type === 'Appeal by Taxpayer' || type === 'Appeal by Department';
    var filingDue = (isAppeal && target && target.limitationMonths) ? addMonths(c.dateOfCommunication, target.limitationMonths) : '';
    var disputedTax = c.demand ? c.demand.tax : 0;
    var pct = target ? target.preDepositPct : null;
    var resetDefault = (type === 'Appeal by Taxpayer' || type === 'Appeal by Department' || type === 'Remand');
    var docs = c.documents.map(function(d){ return '<option value="' + d.name + '">' + d.name + '</option>'; }).join('');
    return (
      '<div class="modal-backdrop" data-action="close-forum-modal"><div class="modal-card" style="max-width:560px; max-height:90vh; overflow-y:auto;">' +
        '<h2>Change Litigation Forum</h2><p class="sub">' + c.ref + ' &middot; currently at ' + (forumInfo(c.forumLevel) || {}).name + '</p>' +
        '<div class="field-row"><div class="field"><label>Change Type *</label><select data-role="forum-type" data-live="forum">' + types.map(function(t){ return '<option' + (t.label === type ? ' selected' : '') + '>' + t.label + '</option>'; }).join('') + '</select></div>' +
        '<div class="field"><label>New Forum *</label><select data-role="forum-to" data-live="forum">' + FORUM_LEVELS.map(function(f){ return '<option value="' + f.key + '"' + (f.key === defaultTo ? ' selected' : '') + '>' + f.name + '</option>'; }).join('') + '</select></div></div>' +
        '<div class="field"><label>Authority / Bench</label><input type="text" data-role="forum-authority" placeholder="e.g. Joint Commissioner (Appeals), Mumbai"/></div>' +
        '<div class="field-row"><div class="field"><label>Effective Date *</label><input type="date" data-role="forum-effective" value="' + displayToIso(todayStr()) + '"/></div>' +
        '<div class="field"><label>Date of Filing</label><input type="date" data-role="forum-filing"/></div></div>' +
        '<div class="field"><label>Order being appealed / remanded</label><select data-role="forum-order"><option value="">Select from All Documents…</option>' + docs + '</select></div>' +
        '<div class="field-row"><div class="field"><label>Appeal / Application Ref or ARN</label><input type="text" data-role="forum-ref" placeholder="Optional at draft"/></div>' +
        '<div class="field"><label>Pre-deposit Paid (&#8377;)</label><input type="number" data-role="forum-predeposit" placeholder="0"/></div></div>' +
        (filingDue ? '<div class="info-box">Proposed filing due date: <b>' + filingDue + '</b> (' + target.limitationMonths + ' months from Date of Communication ' + c.dateOfCommunication + (target.condonableMonths ? '; a further ' + target.condonableMonths + ' month(s) condonable' : '') + '). It will be added to the Calendar.</div>' : '') +
        (isAppeal && pct && disputedTax ? '<div class="info-box">Pre-deposit check: ' + target.short + ' requires ' + pct + '% of disputed tax' + (pct === 20 ? ' (cumulative)' : '') + ' = <b>' + inr(disputedTax * pct / 100) + '</b>. You will be warned if the amount entered is lower.</div>' : '') +
        '<div class="field"><label>Remarks *</label><textarea data-role="forum-remarks" placeholder="Why is the forum changing?"></textarea></div>' +
        '<label style="display:flex; align-items:center; gap:7px; font-size:13px; margin-bottom:12px;"><input type="checkbox" data-role="forum-reset"' + (resetDefault ? ' checked' : '') + '/> Reset status to Open for the new forum</label>' +
        '<div class="modal-actions"><button class="btn btn-ghost btn-sm" data-action="close-forum-modal">Cancel</button><button class="btn btn-primary btn-sm" data-action="save-forum" data-id="' + c.id + '">Confirm Forum Change</button></div>' +
      '</div></div>'
    );
  }

  // ---- Data and reconciliation on the case (BRD 6.19)
  function reconLines(c){
    var t = c.demand ? c.demand.tax : 240000;
    if (c.code === 'ASMT-10') return [
      { item:'GSTR-1 vs GSTR-3B outward liability — Q1', books:4825000, returns:4710000 },
      { item:'GSTR-1 vs GSTR-3B outward liability — Q2', books:5130000, returns:5130000 },
      { item:'GSTR-3B ITC vs GSTR-2B ITC — Q3', books:612000, returns:Math.round(612000 - t * 0.6) },
      { item:'GSTR-3B ITC vs GSTR-2B ITC — Q4', books:588000, returns:Math.round(588000 - t * 0.4) }
    ];
    if (c.code === 'DRC-01') return [
      { item:'Demand line 1 — ITC claimed in GSTR-3B not in GSTR-2B', books:Math.round(t * 0.55), returns:0 },
      { item:'Demand line 2 — ITC on blocked credits (Sec 17(5))', books:Math.round(t * 0.25), returns:Math.round(t * 0.25) },
      { item:'Demand line 3 — Turnover per books vs GSTR-9', books:Math.round(t * 0.20), returns:Math.round(t * 0.05) },
      { item:'Tax paid in cash against demanded heads', books:0, returns:0 }
    ];
    return [{ item:'Paid vs demanded vs outstanding', books:demandTotal(c), returns:(c.demand ? c.demand.paid : 0) }];
  }
  function renderDataReconCard(c){
    var tmpls = templatesForNotice(c.code);
    if (!tmpls.length || !can('data.view')) return '';
    var required = tmpls.filter(function(t){ return t.category !== 'Returns'; });
    var rows = tmpls.map(function(t){
      var ds = latestDataset(t.key, c.gstin, c.entity, c.financialYear);
      var optional = t.category === 'Returns';
      var status = ds ? '<span class="pill pill-good"><span class="pill-dot"></span>Uploaded v' + ds.version + '</span><div class="state-line">' + ds.rows.toLocaleString('en-IN') + ' rows &middot; ' + ds.on + '</div>'
        : (optional ? '<span class="tag">Optional (if no GSP return data)</span>' : '<span class="pill pill-bad"><span class="pill-dot"></span>Missing</span>');
      return '<tr><td>' + t.name + '<div class="state-line">' + t.use + '</div></td><td>' + status + '</td><td>' + (can('data.upload') ? '<button class="btn btn-ghost btn-sm" data-action="open-upload-modal" data-template="' + t.key + '" data-gstin="' + c.gstin + '" data-fy="' + c.financialYear + '" data-id="' + c.id + '">' + (ds ? 'Re-upload' : 'Upload') + '</button>' : '') + '</td></tr>';
    }).join('');
    var ready = required.every(function(t){ return latestDataset(t.key, c.gstin, c.entity, c.financialYear); });
    var reconHtml = '';
    if (c.recon){
      reconHtml = '<div style="margin-top:16px;"><div class="card-head" style="margin-bottom:8px;"><h2 style="font-size:13px;">Reconciliation Result</h2><span class="muted-note">Data used: ' + c.recon.used + '</span></div>' +
        '<div class="table-wrap"><table class="recon-table"><thead><tr><th>Line</th><th>Per Books / Uploaded</th><th>Per Returns / Notice</th><th>Difference</th><th>Reason Code</th><th>Explanation</th></tr></thead><tbody>' +
        c.recon.lines.map(function(l, i){
          var diff = l.books - l.returns;
          return '<tr><td>' + l.item + '</td><td class="mono">' + inr(l.books) + '</td><td class="mono">' + inr(l.returns) + '</td><td class="mono ' + (diff ? 'diff-pos' : 'diff-zero') + '">' + inr(diff) + '</td>' +
            '<td><select data-role="recon-reason" data-i="' + i + '">' + ['','Timing difference','Credit note post year-end','Supplier yet to file','Export / SEZ reclassified','Data entry error','Admitted'].map(function(o){ return '<option' + (l.reason === o ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select></td>' +
            '<td><input type="text" data-role="recon-explain" data-i="' + i + '" value="' + (l.explain || '') + '" placeholder="Explain the difference"/></td></tr>';
        }).join('') + '</tbody></table></div>' +
        (can('data.reconcile') ? '<div class="composer-row" style="justify-content:flex-end;"><button class="btn btn-ghost btn-sm" data-action="download-annexure" data-id="' + c.id + '">Download Annexure (Excel)</button><button class="btn btn-primary btn-sm" data-action="prepare-response" data-id="' + c.id + '">Prepare Response</button></div>' : '') +
        '</div>';
    }
    return '<div class="card"><div class="card-head"><h2>Data &amp; Reconciliation</h2><span class="tag">' + c.code + ' &middot; GSTIN ' + c.gstin + ' &middot; FY ' + (c.financialYear || '—') + '</span></div>' +
      '<div class="table-wrap"><table><thead><tr><th>Template required for ' + c.code + '</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      (can('data.reconcile') ? '<div class="composer-row"><span class="muted-note">' + (ready ? 'All required data is available.' : 'Upload the missing data sets to run the reconciliation.') + '</span><button class="btn btn-primary btn-sm" data-action="run-recon" data-id="' + c.id + '"' + (ready ? '' : ' disabled') + '>' + (c.recon ? 'Re-run Reconciliation' : 'Run Reconciliation') + '</button></div>' : '') +
      reconHtml +
      '<div class="card-note">Combines uploaded Sales, Purchase and Financial data with what GST Radar already holds for this case (notice, demand lines, return data from the GSP where available). Figures are illustrative in this prototype. Any AI-written narrative in the prepared response is advisory and needs review.</div></div>';
  }

  function sortRows(list, key, dir){
    return list.slice().sort(function(a,b){
      var av = (a[key]||'').toString().toLowerCase(), bv = (b[key]||'').toString().toLowerCase();
      if (av < bv) return dir === 'asc' ? -1 : 1;
      if (av > bv) return dir === 'asc' ? 1 : -1;
      return 0;
    });
  }
  function sortArrow(sortState, key){
    if (sortState.key !== key) return '';
    return sortState.dir === 'asc' ? ' &uarr;' : ' &darr;';
  }

  var TODAY = { year:2026, month:7, day:11 };
  var WEEKDAY_LABELS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  var HOLIDAYS = [
    { d:'26 Jan 2026', t:'Republic Day', scope:'national' },
    { d:'04 Mar 2026', t:'Holi', scope:'national' },
    { d:'15 Aug 2026', t:'Independence Day', scope:'national' },
    { d:'02 Oct 2026', t:'Gandhi Jayanti', scope:'national' },
    { d:'08 Nov 2026', t:'Diwali', scope:'national' },
    { d:'25 Dec 2026', t:'Christmas', scope:'national' },
    { d:'14 Jan 2026', t:'Makar Sankranti / Uttarayan', scope:'Gujarat' },
    { d:'01 May 2026', t:'Gujarat Day', scope:'Gujarat' },
    { d:'14 Jan 2026', t:'Pongal', scope:'Tamil Nadu' },
    { d:'14 Apr 2026', t:'Tamil New Year (Puthandu)', scope:'Tamil Nadu' },
    { d:'01 May 2026', t:'Maharashtra Day', scope:'Maharashtra' },
    { d:'14 Sep 2026', t:'Ganesh Chaturthi', scope:'Maharashtra' },
    { d:'01 Nov 2026', t:'Karnataka Rajyotsava', scope:'Karnataka' }
  ];
  var CUSTOM_EVENTS = [];

  function statesForEntity(entity){
    if (entity === 'all') return null;
    var set = {};
    uniqueGstins().forEach(function(g){ if (g.entity === entity) set[g.state] = true; });
    return Object.keys(set);
  }

  function monthEvents(year, month, entityFilter, myOnly){
    var map = {};
    function add(day, ev){ if (!map[day]) map[day] = []; map[day].push(ev); }
    var states = statesForEntity(entityFilter || 'all');
    var myIds = myOnly ? queueCases().map(function(c){ return c.id; }) : null;

    visibleCases().forEach(function(c){
      if (entityFilter && entityFilter !== 'all' && c.entity !== entityFilter) return;
      if (myIds && myIds.indexOf(c.id) < 0) return;
      if (c.status !== 'closed'){
        var dd = new Date(c.due);
        if (dd.getFullYear() === year && dd.getMonth() === month) add(dd.getDate(), { type:'due', c:c });
        if (c.internalDueDate && c.status !== 'responded'){
          var idd = new Date(c.internalDueDate);
          if (idd.getFullYear() === year && idd.getMonth() === month) add(idd.getDate(), { type:'internal_due', c:c });
        }
      }
      if (c.personalHearing && c.hearingDate){
        var hd = new Date(c.hearingDate);
        if (hd.getFullYear() === year && hd.getMonth() === month) add(hd.getDate(), { type:'hearing', c:c });
      }
      if (c.filingDueDate && isActive(c)){
        var fd = new Date(c.filingDueDate);
        if (fd.getFullYear() === year && fd.getMonth() === month) add(fd.getDate(), { type:'filing', c:c });
      }
    });

    HOLIDAYS.forEach(function(h){
      if (h.scope !== 'national' && states && states.indexOf(h.scope) < 0) return;
      var dh = new Date(h.d);
      if (dh.getFullYear() === year && dh.getMonth() === month) add(dh.getDate(), { type:'holiday', label:h.t, scope:h.scope });
    });

    add(11, { type:'statutory', label:'GSTR-1 due' });
    add(20, { type:'statutory', label:'GSTR-3B due' });
    if (year === 2026 && month === 11) add(31, { type:'statutory', label:'GSTR-9 annual return due' });

    CUSTOM_EVENTS.forEach(function(ev){
      if (ev.year === year && ev.month === month) add(ev.day, { type:'custom', title:ev.title, note:ev.note });
    });

    return map;
  }

  function cellTintColor(dayEvents){
    if (dayEvents.some(function(e){ return e.type === 'due' && e.c.agingBucket === 'red'; })) return 'var(--st-escalated)';
    if (dayEvents.some(function(e){ return e.type === 'due' && e.c.agingBucket === 'amber'; })) return 'var(--st-progress)';
    if (dayEvents.some(function(e){ return e.type === 'hearing'; })) return 'var(--accent)';
    if (dayEvents.some(function(e){ return e.type === 'holiday' && e.scope === 'national'; })) return 'var(--hol-national)';
    if (dayEvents.some(function(e){ return e.type === 'holiday' && e.scope !== 'national'; })) return 'var(--hol-state)';
    if (dayEvents.some(function(e){ return e.type === 'custom'; })) return 'var(--custom-event)';
    if (dayEvents.some(function(e){ return e.type === 'due' && e.c.agingBucket === 'green'; })) return 'var(--st-closed)';
    return null;
  }

  function eventChipHtml(ev){
    if (ev.type === 'due'){
      var dotColor = ev.c.agingBucket === 'red' ? 'var(--st-escalated)' : ev.c.agingBucket === 'amber' ? 'var(--st-progress)' : 'var(--st-closed)';
      return '<div class="cal-chip" data-action="open-case" data-id="' + ev.c.id + '" title="' + ev.c.noticeType + '"><span class="cal-dot" style="background:' + dotColor + '"></span>' + ev.c.code + ' due</div>';
    }
    if (ev.type === 'hearing'){
      return '<div class="cal-chip" data-action="open-case" data-id="' + ev.c.id + '" title="Personal hearing — ' + ev.c.noticeType + '"><span class="cal-dot" style="background:var(--accent)"></span>' + ev.c.code + ' hearing</div>';
    }
    if (ev.type === 'filing'){
      return '<div class="cal-chip" data-action="open-case" data-id="' + ev.c.id + '" title="Appeal filing due — ' + ev.c.noticeType + '"><span class="cal-dot" style="background:var(--st-escalated)"></span>' + ev.c.code + ' appeal due</div>';
    }
    if (ev.type === 'internal_due'){
      return '<div class="cal-chip" data-action="open-case" data-id="' + ev.c.id + '" title="Internal review target — ' + ev.c.noticeType + '"><span class="cal-dot" style="background:var(--st-responded)"></span>' + ev.c.code + ' internal due</div>';
    }
    if (ev.type === 'holiday'){
      var holColor = ev.scope === 'national' ? 'var(--hol-national)' : 'var(--hol-state)';
      var holTitle = ev.scope === 'national' ? 'Public holiday' : ev.scope + ' state / bank holiday';
      return '<div class="cal-chip" title="' + ev.label + ' — ' + holTitle + '"><span class="cal-dot" style="background:' + holColor + '"></span>' + ev.label + '</div>';
    }
    if (ev.type === 'custom'){
      return '<div class="cal-chip" title="' + ev.title + (ev.note ? (' — ' + ev.note) : '') + '"><span class="cal-dot" style="background:var(--custom-event)"></span>' + ev.title + '</div>';
    }
    return '<div class="cal-chip" title="' + ev.label + '"><span class="cal-dot" style="background:var(--muted)"></span>' + ev.label + '</div>';
  }

  function renderEventModal(){
    if (!state.eventModal) return '';
    var m = state.eventModal;
    var dateLabel = m.day + ' ' + MONTHS[m.month] + ' ' + m.year;
    return (
      '<div class="modal-backdrop" data-action="close-event-modal">' +
        '<div class="modal-card">' +
          '<h2>Add Event</h2><p class="sub">' + dateLabel + '</p>' +
          '<div class="field"><label>Title</label><input type="text" data-role="event-title-input" placeholder="e.g. Internal review call"/></div>' +
          '<div class="field"><label>Note (optional)</label><input type="text" data-role="event-note-input" placeholder="Add a short detail"/></div>' +
          '<div class="modal-actions"><button class="btn btn-ghost btn-sm" data-action="close-event-modal">Cancel</button><button class="btn btn-primary btn-sm" data-action="save-event">Save Event</button></div>' +
        '</div>' +
      '</div>'
    );
  }

  function agendaItems(entityFilter, myOnly, daysAhead){
    var start = new Date(TODAY.year, TODAY.month, TODAY.day);
    var end = new Date(start); end.setDate(end.getDate() + daysAhead);
    var items = [];
    var states = statesForEntity(entityFilter || 'all');
    var myIds = myOnly ? queueCases().map(function(c){ return c.id; }) : null;
    visibleCases().forEach(function(c){
      if (entityFilter && entityFilter !== 'all' && c.entity !== entityFilter) return;
      if (myIds && myIds.indexOf(c.id) < 0) return;
      if (c.status !== 'closed'){
        var dd = new Date(c.due);
        if (dd >= start && dd <= end) items.push({ date:dd, type:'due', c:c });
        if (c.internalDueDate && c.status !== 'responded'){
          var idd2 = new Date(c.internalDueDate);
          if (idd2 >= start && idd2 <= end) items.push({ date:idd2, type:'internal_due', c:c });
        }
      }
      if (c.personalHearing && c.hearingDate){
        var hd = new Date(c.hearingDate);
        if (hd >= start && hd <= end) items.push({ date:hd, type:'hearing', c:c });
      }
      if (c.filingDueDate && isActive(c)){
        var fd2 = new Date(c.filingDueDate);
        if (fd2 >= start && fd2 <= end) items.push({ date:fd2, type:'filing', c:c });
      }
    });
    HOLIDAYS.forEach(function(h){
      if (h.scope !== 'national' && states && states.indexOf(h.scope) < 0) return;
      var dh = new Date(h.d);
      if (dh >= start && dh <= end) items.push({ date:dh, type:'holiday', label:h.t, scope:h.scope });
    });
    CUSTOM_EVENTS.forEach(function(ev){
      var ed = new Date(ev.year, ev.month, ev.day);
      if (ed >= start && ed <= end) items.push({ date:ed, type:'custom', title:ev.title, note:ev.note });
    });
    items.sort(function(a,b){ return a.date - b.date; });
    return items;
  }

  function renderPlannerView(entityFilter, myOnly){
    var items = agendaItems(entityFilter, myOnly, 30);
    if (!items.length) return '<div class="card"><p class="muted-note">Nothing planned in the next 30 days.</p></div>';
    var grouped = {}, order = [];
    items.forEach(function(it){
      var key = it.date.getDate() + ' ' + MONTHS[it.date.getMonth()] + ' ' + it.date.getFullYear();
      if (!grouped[key]){ grouped[key] = []; order.push(key); }
      grouped[key].push(it);
    });
    return order.map(function(key){
      var rows = grouped[key].map(function(it){
        if (it.type === 'due' || it.type === 'hearing' || it.type === 'internal_due' || it.type === 'filing'){
          var typeLabel = it.type === 'due' ? 'Due' : (it.type === 'hearing' ? 'Hearing' : (it.type === 'filing' ? 'Appeal Filing Due' : 'Internal Due'));
          var dotColor = it.type === 'hearing' ? 'var(--accent)' : it.type === 'internal_due' ? 'var(--st-responded)' : (it.c.agingBucket==='red'?'var(--st-escalated)':it.c.agingBucket==='amber'?'var(--st-progress)':'var(--st-closed)');
          return '<div class="deadline-row" data-action="open-case" data-id="' + it.c.id + '"><div class="deadline-main"><div class="deadline-ref"><span class="cal-dot" style="background:' + dotColor + '; display:inline-block; margin-right:5px;"></span>' + typeLabel + ' — ' + it.c.code + '</div><div class="deadline-title">' + it.c.noticeType + '</div><div class="deadline-meta">' + it.c.entity + ' · ' + it.c.state + '</div></div></div>';
        }
        if (it.type === 'holiday'){
          var hColor = it.scope === 'national' ? 'var(--hol-national)' : 'var(--hol-state)';
          return '<div class="deadline-row"><div class="deadline-main"><div class="deadline-ref"><span class="cal-dot" style="background:' + hColor + '; display:inline-block; margin-right:5px;"></span>' + (it.scope==='national'?'Public Holiday':it.scope+' Holiday') + '</div><div class="deadline-title">' + it.label + '</div></div></div>';
        }
        return '<div class="deadline-row"><div class="deadline-main"><div class="deadline-ref"><span class="cal-dot" style="background:var(--custom-event); display:inline-block; margin-right:5px;"></span>Your Event</div><div class="deadline-title">' + it.title + '</div>' + (it.note ? '<div class="deadline-meta">' + it.note + '</div>' : '') + '</div></div>';
      }).join('');
      return '<div class="card" style="margin-bottom:14px;"><div class="card-head"><h2>' + key + '</h2></div><div class="deadline-list">' + rows + '</div></div>';
    }).join('');
  }

  function renderCalendar(){
    var year = state.calYear, month = state.calMonth;
    var entityFilter = state.filters.calEntity || 'all';
    var myOnly = !!state.filters.calMyOnly;
    var events = monthEvents(year, month, entityFilter, myOnly);
    var firstWeekday = (new Date(year, month, 1).getDay() + 6) % 7;
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var daysInPrevMonth = new Date(year, month, 0).getDate();

    var cells = [];
    for (var i = 0; i < firstWeekday; i++){ cells.push({ day: daysInPrevMonth - firstWeekday + 1 + i, inMonth:false }); }
    for (var d = 1; d <= daysInMonth; d++){ cells.push({ day:d, inMonth:true }); }
    while (cells.length % 7 !== 0){ cells.push({ day: cells.length - firstWeekday - daysInMonth + 1, inMonth:false }); }

    var cellsHtml = cells.map(function(cell){
      var isToday = cell.inMonth && year === TODAY.year && month === TODAY.month && cell.day === TODAY.day;
      var dayEvents = cell.inMonth ? (events[cell.day] || []) : [];
      var shown = dayEvents.slice(0, 3).map(eventChipHtml).join('');
      var more = dayEvents.length > 3 ? '<div class="cal-more">+' + (dayEvents.length - 3) + ' more</div>' : '';
      var dataAttrs = cell.inMonth ? ' data-year="' + year + '" data-month="' + month + '" data-day="' + cell.day + '" title="Double-click to add an event"' : '';
      var tint = cellTintColor(dayEvents);
      var tintStyle = tint ? ' style="background:color-mix(in srgb, ' + tint + ' 16%, var(--surface));"' : '';
      return '<div class="cal-cell' + (cell.inMonth ? '' : ' out') + (isToday ? ' today' : '') + '"' + dataAttrs + tintStyle + '><div class="cal-daynum">' + cell.day + '</div><div class="cal-chips">' + shown + more + '</div></div>';
    }).join('');

    var weekdayHtml = WEEKDAY_LABELS.map(function(w){ return '<div class="cal-weekday">' + w + '</div>'; }).join('');
    var monthLabel = MONTHS[month] + ' ' + year;

    return (
      '<div class="page-head"><div><h1>Calendar</h1><p>Case due dates, personal hearings, statutory filings and holidays, by date. Double-click any day to add your own event.</p></div>' +
        '<button class="btn btn-ghost btn-sm" data-action="export-calendar">Export to Excel</button>' +
      '</div>' +
      (function(){ var cl = visibleCases().filter(function(c){ return entityFilter === 'all' || c.entity === entityFilter; }); return '<div class="kpi-context" style="margin-bottom:12px;">Overdue (K-08): <b>' + kpiCount('overdue', cl) + '</b> &middot; Due Soon (K-09): <b>' + kpiCount('dueSoon', cl) + '</b> &middot; same definitions as the Dashboard</div>'; })() +
      '<div class="filter-bar">' +
        '<div class="seg" role="group" aria-label="Calendar view"><button type="button" data-action="cal-view" data-view="month" class="' + (state.calView!=='planner'?'active':'') + '">Month</button><button type="button" data-action="cal-view" data-view="planner" class="' + (state.calView==='planner'?'active':'') + '">Planner</button></div>' +
        '<select data-filter="calEntity">' + optionList(ENTITIES, entityFilter, 'All Entities') + '</select>' +
        '<label style="display:inline-flex; align-items:center; gap:7px; font-size:13px; cursor:pointer; padding:8px 12px; border:1px solid var(--line-strong); border-radius:8px; background:var(--surface);"><input type="checkbox" data-toggle="calMyOnly"' + (myOnly ? ' checked' : '') + '/>My items only</label>' +
      '</div>' +
      (state.calView === 'planner'
        ? '<div class="page-head"><div><h2 style="font-size:16px;">Next 30 Days</h2></div></div>' + renderPlannerView(entityFilter, myOnly)
        : (
          '<div class="cal-nav">' +
            '<div class="cal-nav-title">' + monthLabel + '</div>' +
            '<div class="cal-nav-btns"><button class="btn btn-ghost btn-sm" data-action="cal-today">Today</button><button class="btn btn-ghost btn-sm" data-action="cal-prev">&larr;</button><button class="btn btn-ghost btn-sm" data-action="cal-next">&rarr;</button></div>' +
          '</div>' +
          '<div style="overflow-x:auto;"><div class="cal-grid" style="min-width:700px;">' + weekdayHtml + cellsHtml + '</div></div>'
        )
      ) +
      '<div class="card" style="margin-top:18px;"><div class="card-head"><h2>Legend</h2></div><div class="legend-grid">' +
        '<div class="legend-item"><span class="legend-swatch" style="background:var(--st-escalated)"></span>Overdue</div>' +
        '<div class="legend-item"><span class="legend-swatch" style="background:var(--st-progress)"></span>Due soon</div>' +
        '<div class="legend-item"><span class="legend-swatch" style="background:var(--st-closed)"></span>On track</div>' +
        '<div class="legend-item"><span class="legend-swatch" style="background:var(--accent)"></span>Personal hearing</div>' +

  function validateDataFile(t, rows){
    var header = (rows.shift() || []).map(function(h){ return h.trim(); });
    var missing = t.columns.filter(function(col){ return header.indexOf(col) < 0; });
    if (missing.length) return { fatal:'File rejected: it does not match the ' + t.name + ' template. Missing column(s): ' + missing.join(', ') + '.', accepted:0, rejected:rows.length, errors:[] };
    var errors = [], accepted = 0, seenInv = {};
    rows.forEach(function(r, i){
      var rowNo = i + 2, bad = false;
      t.columns.forEach(function(col){
        var v = (r[header.indexOf(col)] || '').trim();
        if (/GSTIN/.test(col) && v && v !== 'ALL' && !GSTIN_RE.test(v.toUpperCase())){ errors.push({ row:rowNo, col:col, msg:'Invalid GSTIN format "' + v + '"' }); bad = true; }
        if (/Taxable Value|IGST|CGST|SGST|Cess|Amount/.test(col) && v && isNaN(Number(v))){ errors.push({ row:rowNo, col:col, msg:'Not a number "' + v + '"' }); bad = true; }
        if ((col === 'GSTIN' || col === 'Period') && !v){ errors.push({ row:rowNo, col:col, msg:'Mandatory value missing' }); bad = true; }
      });
      var invIdx = header.indexOf('Invoice No');
      if (invIdx >= 0){ var inv = (r[invIdx] || '').trim(); if (inv && seenInv[inv]){ errors.push({ row:rowNo, col:'Invoice No', msg:'Duplicate invoice number ' + inv }); bad = true; } seenInv[inv] = true; }
      if (!bad) accepted++;
    });
    return { accepted:accepted, rejected:rows.length - accepted, errors:errors };
  }

  function renderDataHub(){
    var q = (state.filters.dataSearch || '').toLowerCase();
    var list = FIN_DATASETS.filter(function(d){ return inScope(d.entity); }).filter(function(d){
      var t = findDataTemplate(d.template);
      return !q || (t.name + ' ' + d.entity + ' ' + d.gstin + ' ' + d.fy).toLowerCase().indexOf(q) >= 0;
    });
    var rows = list.map(function(d){
      var t = findDataTemplate(d.template);
      var linked = visibleCases().filter(function(c){ return c.financialYear === d.fy && (c.gstin === d.gstin || (d.gstin === 'ALL' && c.entity === d.entity)) && templatesForNotice(c.code).some(function(x){ return x.key === d.template; }); });

      '<td><span class="badge ' + STATUS_BADGE_CLASS[c.status] + '">' + STATUS_LABEL[c.status] + '</span></td></tr>';
  }
  function sortDemandCases(list, sortState){
    return list.slice().sort(function(a,b){
      var av, bv;
      if (sortState.key === 'total') { av = demandTotal(a); bv = demandTotal(b); }
      else if (sortState.key === 'outstanding') { av = demandOutstanding(a); bv = demandOutstanding(b); }
      else if (sortState.key === 'paid') { av = a.demand.paid || 0; bv = b.demand.paid || 0; }
      else if (sortState.key === 'tax' || sortState.key === 'interest' || sortState.key === 'penalty') { av = a.demand[sortState.key]; bv = b.demand[sortState.key]; }
      else { av = (a[sortState.key]||'').toString().toLowerCase(); bv = (b[sortState.key]||'').toString().toLowerCase(); }
      if (av < bv) return sortState.dir === 'asc' ? -1 : 1;
      if (av > bv) return sortState.dir === 'asc' ? 1 : -1;
      return 0;
    });
  }

  function renderDemandDetailCard(repEntity){
    var base = visibleCases().filter(function(c){ return c.demand && (repEntity === 'all' || c.entity === repEntity); });
    base = sortDemandCases(base, state.demandSort);
    var rows = base.map(demandDetailRowHtml).join('');
    if (!base.length) rows = '<tr class="empty-row"><td colspan="11">No cases with a quantified demand for this entity.</td></tr>';

      th('Reference','id') + '<th>Entity</th><th>GSTIN</th><th>Notice Type</th>' +
      th('Tax','tax') + th('Interest','interest') + th('Penalty','penalty') + th('Total','total') + th('Paid','paid') + th('Outstanding','outstanding') +
      '<th>Status</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="card-note">One row per case with a quantified demand, regardless of status. Click a column header to sort.</div></div>';
  }

  function renderContingentLiabilityCard(repEntity){
    var disputed = visibleCases().filter(function(c){ return c.demand && c.status !== 'closed' && (repEntity === 'all' || c.entity === repEntity); });

    }).join('');
    if (!rows) rows = '<tr class="empty-row"><td colspan="6">No disputed demand for this entity.</td></tr>';
    return '<div class="card" style="margin-bottom:20px;"><div class="card-head"><h2>Contingent Liability Summary</h2><span class="pill pill-warn"><span class="pill-dot"></span>' + inr(total) + '</span></div>' +
