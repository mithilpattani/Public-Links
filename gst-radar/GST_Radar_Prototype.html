    var rows = REPLY_TEMPLATES.map(function(t){
      var preview = t.body.length > 90 ? t.body.slice(0, 90) + '&hellip;' : t.body;
      var actionsCell = admin
        ? '<button class="btn btn-ghost btn-sm" data-action="edit-template" data-id="' + t.id + '">Edit</button> ' +
          '<button class="btn btn-ghost btn-sm" data-action="delete-template" data-id="' + t.id + '">Delete</button>'
        : '<span class="muted-note">Admin only</span>';
      return '<tr><td>' + t.name + '</td><td class="mono">' + t.noticeCode + '<div class="state-line">' + t.category + '</div></td><td style="max-width:340px;">' + preview + '</td><td style="white-space:nowrap;">' + actionsCell + '</td></tr>';
    }).join('');
    if (!rows) rows = '<tr class="empty-row"><td colspan="4">No reply templates yet.</td></tr>';

    return (
      '<div class="page-head"><div><h1>Reply Templates</h1><p>Standard reply language your team can reuse and configure — also used by GST Radar AI to draft first-cut replies.</p></div>' +
        (admin ? '<button class="btn btn-primary btn-sm" data-action="add-template">+ Add New</button>' : '') +
      '</div>' +
      (admin ? '' : '<p class="muted-note" style="margin-bottom:14px;">Adding, editing and deleting templates requires the Masters Add / Edit permission (Admin by default).</p>') +
      '<div class="table-wrap"><table><thead><tr><th>Template</th><th>Notice Type</th><th>Preview</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="card" style="margin-top:20px;"><div class="card-head"><h2>AI Drafting &amp; Translation</h2><span class="tag">Beta</span></div>' +
        '<p class="muted-note">When a case&rsquo;s notice type matches a saved template, &ldquo;Generate Draft with AI&rdquo; on that case starts from this library instead of a generic skeleton. The prototype matches by notice code only; production would extend this with retrieval over the full template library (RAG) so near-matches are found too, not just exact notice-type matches.</p>' +
        '<p class="muted-note" style="margin-top:8px;">Each case also offers a translated view of the notice for reference, since notices and replies vary by state language. That view is a labelled placeholder in this prototype — production would call a translation service and would need review before being relied on.</p>' +
      '</div>' +
      renderTemplateModal()
    );
  }

  function renderAuditLog(){
    var search = (state.filters.auditSearch || '').toLowerCase();
    var actionFilter = state.filters.auditAction || 'all';
    var actionTypes = [];
    AUDIT_LOG.forEach(function(e){ if (actionTypes.indexOf(e.action) < 0) actionTypes.push(e.action); });
    var list = AUDIT_LOG.filter(function(e){
      if (actionFilter !== 'all' && e.action !== actionFilter) return false;
      if (!search) return true;
      return (e.actor + ' ' + e.action + ' ' + e.details).toLowerCase().indexOf(search) >= 0;
    });
    var rows = list.map(function(e){
      return '<tr><td class="mono" style="white-space:nowrap;">' + e.time + '</td><td>' + e.actor + '</td><td><span class="tag">' + e.action + '</span></td><td>' + e.details + '</td></tr>';
    }).join('');
    if (!list.length) rows = '<tr class="empty-row"><td colspan="4">No log entries match your search.</td></tr>';

    return (
      '<div class="page-head"><div><h1>Audit Logs</h1><p>Every download, print, export, assignment and record change, with who did it and when.</p></div></div>' +
      '<div class="filter-bar">' +
        '<input type="text" data-search="auditSearch" value="' + (state.filters.auditSearch||'') + '" class="search-input" placeholder="Search actor, action or details..."/>' +
        '<select data-filter="auditAction"><option value="all">All Actions</option>' + actionTypes.map(function(a){ return '<option value="' + a + '"' + (actionFilter===a?' selected':'') + '>' + a + '</option>'; }).join('') + '</select>' +
      '</div>' +
      '<div class="table-wrap"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Details</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="card-note" style="margin-top:12px;">This log is session-local in the prototype and resets on refresh. In production it would be an append-only, permanent record.</div>'
    );
  }

  function renderOutlook(){
    var rules = [
      { name:'Department SCNs', cond:'From domain @gst.gov.in', action:'Create case + notify Preparer' },
      { name:'State Portal Alerts', cond:'Subject contains ASMT or DRC', action:'Attach to matching case' },
      { name:'Personal Forwards', cond:'From a listed personal email, subject contains notice', action:'Flag for manual review' }
    ];
    var ruleRows = rules.map(function(r){ return '<tr><td>' + r.name + '</td><td>' + r.cond + '</td><td>' + r.action + '</td></tr>'; }).join('');
    return (
      '<div class="page-head"><div><h1>Outlook Integration</h1><p>Push GST department alerts into the inbox your team already watches, and route matching emails into GST Radar.</p></div><span class="tag">Phase 2</span></div>' +
      '<div class="card"><div class="card-head"><h2>Connection</h2><span class="pill pill-warn"><span class="pill-dot"></span>Not Connected</span></div>' +
        '<p class="muted-note">Connect an Outlook mailbox to receive case alerts directly in Outlook, and let GST Radar create or update cases from emails that match the rules below.</p>' +
        '<button class="btn btn-ghost" disabled title="Available in Phase 2">Connect Outlook Account</button></div>' +
      '<div class="card" style="margin-top:20px; opacity:.6;"><div class="card-head"><h2>Alert Rules — Preview</h2></div>' +
        '<div class="table-wrap"><table><thead><tr><th>Rule</th><th>Condition</th><th>Action</th></tr></thead><tbody>' + ruleRows + '</tbody></table></div>' +
        '<div class="card-note">Rule configuration becomes available once Outlook is connected.</div></div>'
    );
  }

  function closeAllModals(){
    state.forumModal = null; state.reopenModal = null; state.refModal = null; state.extModal = null; state.uploadModal = null;
    state.accessModal = null; state.roleModal = null; state.assignModal = null; state.addCaseModal = null; state.bulkUploadModal = null;
    state.docViewModal = null; state.mergeDocsModal = null; state.gstinModal = null; state.masterModal = null; state.templateModal = null;
  }
  function q(role){ return document.querySelector('[data-role="' + role + '"]'); }
  function qv(role){ var el = q(role); return el ? el.value.trim() : ''; }
  function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function approversFor(entity){ return USERS.filter(function(u){ var r = findRoleByName(u.role); return u.status === 'active' && r && r.perms['ext.approve'] && u.role !== 'Admin' && inScope(entity, u); }); }

  function refInUse(ref, except){
    var r = ref.toLowerCase();
    return CASES.some(function(o){ return o !== except && (o.ref.toLowerCase() === r || o.id.toLowerCase() === r || o.refHistory.some(function(h){ return h.from.toLowerCase() === r; })); });
  }
  // Date of Issue is mandatory, not in the future and not after the Due Date (BR-21).
  function caseFieldError(f){
    var iss = new Date(f.issued), due = new Date(f.due);
    if (isNaN(iss.getTime())) return 'Date of Issue "' + f.issued + '" is not a valid date (use e.g. 15 Sep 2026).';
    if (isNaN(due.getTime())) return 'Due Date "' + f.due + '" is not a valid date (use e.g. 29 Sep 2026).';
    if (iss > todayDate()) return 'Date of Issue cannot be in the future.';
    if (iss > due) return 'Date of Issue cannot be later than the Due Date.';
    if (f.ref && !/^[A-Za-z0-9\-\/_.]{1,50}$/.test(f.ref)) return 'Reference ID may contain only letters, digits, hyphen, slash, underscore and full stop (max 50).';
    if (f.ref && refInUse(f.ref, null)) return 'Reference ID "' + f.ref + '" is already in use.';
    return '';
  }

  // Handlers for the v1.7 change requests. Returns true when the action was handled.
  function handleV17Action(action, target, id){
    var c = id ? findCase(id) : null;
    var me = currentActorLabel();

    if (action === 'toggle-nav-group'){ var g = target.getAttribute('data-group'); state.navCollapsed[g] = !state.navCollapsed[g]; render(); return true; }

    // ---- KPI drill-down (FR-KPI-6)
    if (action === 'kpi-drill'){
      var scope = target.getAttribute('data-scope');
      if (scope !== 'filtered') resetCaseFilters();
      if (scope === 'queue') state.filters.mine = true;
      if (scope.indexOf('entity:') === 0) state.filters.entity = scope.slice(7);
      state.filters.kpi = target.getAttribute('data-kpi');
      state.view = 'list'; state.selectedId = null;
      render(); return true;
    }
    if (action === 'clear-kpi-drill'){ state.filters.kpi = null; state.filters.mine = false; render(); return true; }
    if (action === 'reset-case-filters'){ resetCaseFilters(); render(); return true; }

    // ---- Tagging (6.25)
    if (action === 'tag-done'){
      var t = c.tags.filter(function(x){ return x.id === target.getAttribute('data-tag'); })[0];
      if (!t) return true;
      t.status = 'done'; t.resolvedAt = 'Just now';
      c.activity.push({ type:'system', actor:me, text:me + ' marked the tag from ' + t.by + ' as done.', time:'Just now' });
      notify(currentUserName() + ' marked your tag on ' + c.ref + ' as done.', c.id, t.by.split(' (')[0]);
      logAudit('Tag Resolved', 'Tag for ' + t.user + ' on ' + c.ref + ' marked done.');
      render(); return true;
    }
    if (action === 'mention-pick'){
      var box = q('remark-input');
      var name = target.getAttribute('data-name');
      if (box){
        var pos = box.selectionStart, before = box.value.slice(0, pos), after = box.value.slice(pos);
        var at = before.lastIndexOf('@');
        box.value = before.slice(0, at) + '@' + name + ' ' + after;
        box.focus();
        var caret = at + name.length + 2;
        box.setSelectionRange(caret, caret);
      }
      closeMentionPop();
      return true;
    }

    // ---- Litigation forum change (6.17)
    if (action === 'open-forum-modal'){ if (!can('case.changeForum')) return true; state.forumModal = { caseId:id }; render(); return true; }
    if (action === 'close-forum-modal'){ state.forumModal = null; render(); return true; }
    if (action === 'save-forum'){
      if (!can('case.changeForum')) return true;
      var type = qv('forum-type'), to = qv('forum-to'), remarks = qv('forum-remarks'), eff = qv('forum-effective');
      if (!remarks || !eff){ window.alert('Effective Date and Remarks are required.'); return true; }
      var target2 = forumInfo(to);
      var isAppeal = type === 'Appeal by Taxpayer' || type === 'Appeal by Department';
      var pre = Number(qv('forum-predeposit')) || 0;
      if (isAppeal && target2.preDepositPct && c.demand && pre < c.demand.tax * target2.preDepositPct / 100){
        if (!window.confirm('Pre-deposit entered (' + inr(pre).replace('&#8377;','Rs ') + ') is below ' + target2.preDepositPct + '% of disputed tax (Rs ' + Math.round(c.demand.tax * target2.preDepositPct / 100).toLocaleString('en-IN') + '). This is a warning only. Record the forum change anyway?')) return true;
      }
      var from = c.forumLevel;
      var authority = qv('forum-authority');
      c.forumHistory.push({ to:to, type:type, effective:isoToDisplay(eff), authority:authority, ref:qv('forum-ref'), filingDate:isoToDisplay(qv('forum-filing')), preDeposit:pre, order:qv('forum-order'), remarks:remarks, actor:me });
      c.forumLevel = to; c.forumAuthority = authority;
      c.filingDueDate = (isAppeal && target2.limitationMonths) ? addMonths(c.dateOfCommunication, target2.limitationMonths) : null;
      if (q('forum-reset') && q('forum-reset').checked && c.status !== 'open'){
        c.status = 'open';
        c.activity.push({ type:'status', st:'open', actor:me, text:'Status reset to Open for the new forum by ' + me + '.', time:'Just now' });
      }
      if (pre && c.demand){ c.demand.paid = (c.demand.paid || 0) + pre; }
      c.activity.push({ type:'system', actor:me, text:'Litigation forum changed (' + type + '): ' + forumInfo(from).name + ' → ' + target2.name + (authority ? ', ' + authority : '') + '. ' + remarks + (c.filingDueDate ? ' Filing due ' + c.filingDueDate + '.' : ''), time:'Just now' });
      logAudit('Forum Changed', c.ref + ': ' + forumInfo(from).short + ' → ' + target2.short + ' (' + type + ').');
      notify('Litigation forum for ' + c.ref + ' changed to ' + target2.name + ' (' + type + ').', c.id, c.assignedTo);
      state.forumModal = null;
      render(); return true;
    }

    // ---- Re-open (6.18)
    if (action === 'open-reopen-modal'){ if (!can('case.reopen')) return true; state.reopenModal = { caseId:id, thenForum: target.getAttribute('data-then-forum') === '1' }; render(); return true; }
    if (action === 'close-reopen-modal'){ state.reopenModal = null; render(); return true; }
    if (action === 'save-reopen'){
      if (!can('case.reopen') || c.status !== 'closed') return true;
      var reason = qv('reopen-reason'), rRemarks = qv('reopen-remarks'), newDueIso = qv('reopen-due');
      if (!rRemarks){ window.alert('Remarks are required to re-open a case.'); return true; }
      if (!newDueIso && reason !== 'Closed in error'){ window.alert('A new due date is required unless the reason is "Closed in error".'); return true; }
      var newDue = newDueIso ? isoToDisplay(newDueIso) : c.due;
      var targetStatus = qv('reopen-status') || 'open';
      c.status = targetStatus; c.reopenCount += 1; c.closedOn = null;
      c.due = newDue; c.originalDue = null; c.internalDueDate = computeInternalDueDate(newDue);
      c.escAck = false; c.escalated = false;
      var newAssignee = qv('reopen-assign') || c.assignedTo;
      c.closureHistory.push({ event:'Re-opened', date:todayStr(), actor:me, reason:reason, remarks:rRemarks, newDue:newDue });
      c.activity.push({ type:'status', st:targetStatus === 'open' ? 'open' : 'progress', actor:me, text:'Case re-opened by ' + me + ' (' + reason + '). ' + rRemarks + ' New due date ' + newDue + '.', time:'Just now' });
      if (newAssignee !== c.assignedTo){ c.activity.push({ type:'system', actor:me, text:'Reassigned from ' + c.assignedTo + ' to ' + newAssignee + ' on re-open.', time:'Just now' }); c.assignedTo = newAssignee; }
      evaluateEscalation(c);
      logAudit('Case Re-opened', c.ref + ' re-opened (' + reason + ').');
      notify(c.ref + ' was re-opened by ' + currentUserName() + ': ' + reason + '.', c.id, c.assignedTo);
      var thenForum = q('reopen-forum') && q('reopen-forum').checked;
      state.reopenModal = null;
      if (thenForum && can('case.changeForum')) state.forumModal = { caseId:c.id, type: reason === 'Remand received' ? 'Remand' : 'Appeal by Taxpayer' };
      render(); return true;
    }

    // ---- Reference ID (6.23)
    if (action === 'open-ref-modal'){ if (!can('case.editRef')) return true; state.refModal = { caseId:id }; render(); return true; }
    if (action === 'close-ref-modal'){ state.refModal = null; render(); return true; }
    if (action === 'save-ref'){
      if (!can('case.editRef')) return true;
      var nv = qv('ref-new');
      if (!/^[A-Za-z0-9\-\/_.]{1,50}$/.test(nv)){ window.alert('Reference ID must be 1 to 50 characters: letters, digits, hyphen, slash, underscore or full stop.'); return true; }
      if (nv === c.ref){ state.refModal = null; render(); return true; }
      var clash = CASES.filter(function(o){ return o !== c && (o.ref.toLowerCase() === nv.toLowerCase() || o.id.toLowerCase() === nv.toLowerCase() || o.refHistory.some(function(h){ return h.from.toLowerCase() === nv.toLowerCase(); })); })[0];
      if (clash){ window.alert('Reference ID "' + nv + '" is already used by ' + clash.ref + ' (' + clash.code + ', ' + clash.entity + ').'); return true; }
      var old = c.ref;
      c.refHistory.push({ from:old, to:nv, reason:qv('ref-reason'), remarks:qv('ref-remarks'), actor:me, date:todayStr() });
      c.ref = nv; c.refSource = 'Manual';
      c.activity.push({ type:'system', actor:me, text:'Reference ID changed from ' + old + ' to ' + nv + ' (' + qv('ref-reason') + '). The old value remains searchable.', time:'Just now' });
      logAudit('Reference ID Changed', old + ' → ' + nv + ' (System Case ID ' + c.id + ').');
      state.refModal = null;
      render(); return true;
    }

    // ---- Date of Communication (6.24)
    if (action === 'save-doc-comm'){
      if (!can('case.editDates')) return true;
      var dc = isoToDisplay(qv('doc-comm'));
      if (!dc) return true;
      if (new Date(dc) < new Date(c.issued)){ window.alert('Date of Communication cannot be earlier than the Date of Issue.'); return true; }
      if (new Date(dc) > todayDate()){ window.alert('Date of Communication cannot be in the future.'); return true; }
      c.dateOfCommunication = dc;
      c.activity.push({ type:'system', actor:me, text:'Date of Communication set to ' + dc + '.', time:'Just now' });
      render(); return true;
    }

    // ---- Extension and adjournment (6.20)
    if (action === 'open-ext-modal'){ state.extModal = { caseId:id, mode:target.getAttribute('data-mode'), extId:target.getAttribute('data-ext') }; render(); return true; }
    if (action === 'close-ext-modal'){ state.extModal = null; render(); return true; }
    if (action === 'save-ext-new'){
      if (!can('ext.draft')) return true;
      var reqIso = qv('ext-date');
      if (!reqIso){ window.alert('Requested New Date is required.'); return true; }
      var xtype = qv('ext-type');
      var current = xtype.indexOf('Adjournment') === 0 ? c.hearingDate : c.due;
      var reqDate = isoToDisplay(reqIso);
      if (new Date(reqDate) <= new Date(current)){ window.alert('The requested date must be after the current date (' + current + ').'); return true; }
      var x = { id:'x' + (c.extensions.length + 1) + '-' + Date.now(), type:xtype, requested:reqDate, current:current, grounds:qv('ext-grounds'), remarks:qv('ext-remarks'), status:'Draft', history:[{ s:'Draft', by:me, on:todayStr() }] };
      x.letter = extensionLetter(c, x);
      c.extensions.push(x);
      c.activity.push({ type:'system', actor:me, text:xtype + ' drafted: requesting ' + reqDate + ' (' + x.grounds + ').', time:'Just now' });
      logAudit('Extension Drafted', c.ref + ': ' + xtype + ' to ' + reqDate + '.');
      state.extModal = { caseId:c.id, mode:'letter', extId:x.id };
      render(); return true;
    }
    if (action === 'save-ext-letter'){
      var xl = findExt(c, target.getAttribute('data-ext'));
      xl.letter = q('ext-letter').value;
      state.extModal = null;
      render(); return true;
    }
    if (action === 'download-ext-letter'){
      var xd = findExt(c, target.getAttribute('data-ext'));
      var ta = q('ext-letter');
      downloadText(c.ref.replace(/[\/]/g,'-') + '-extension-request.txt', ta ? ta.value : xd.letter);
      logAudit('Download', 'Extension request letter downloaded for ' + c.ref + '.');
      return true;
    }
    if (action === 'ext-step'){
      var xs = findExt(c, target.getAttribute('data-ext'));
      var mode = target.getAttribute('data-mode');
      if (mode === 'submit-approval' && can('ext.draft')){
        xs.status = 'Pending Internal Approval';
        approversFor(c.entity).forEach(function(u){ notify(currentUserName() + ' submitted an extension request on ' + c.ref + ' for your approval.', c.id, u.name); });
      } else if (mode === 'approve' && can('ext.approve')){
        xs.status = 'Approved for Submission';
        notify('Extension request on ' + c.ref + ' approved for submission by ' + currentUserName() + '.', c.id, c.assignedTo);
      } else if (mode === 'return' && can('ext.approve')){
        xs.status = 'Draft';
        notify('Extension request on ' + c.ref + ' returned to draft by ' + currentUserName() + '.', c.id, c.assignedTo);
      } else return true;
      xs.history.push({ s:xs.status, by:me, on:todayStr() });
      c.activity.push({ type:'system', actor:me, text:xs.type + ': ' + xs.status + '.', time:'Just now' });
      logAudit('Extension Updated', c.ref + ': ' + xs.status + '.');
      render(); return true;
    }
    if (action === 'save-ext-submitted'){
      var xsub = findExt(c, target.getAttribute('data-ext'));
      var ack = qv('ext-sub-ack'), subIso = qv('ext-sub-date');
      if (!ack || !subIso){ window.alert('Submitted On and Acknowledgement Reference are required.'); return true; }
      xsub.status = 'Submitted'; xsub.submittedOn = isoToDisplay(subIso); xsub.mode = qv('ext-sub-mode'); xsub.ack = ack;
      xsub.history.push({ s:'Submitted', by:me, on:todayStr() });
      c.documents.push({ id:'doc' + (c.documents.length + 1), name:'Extension-Request-Acknowledgement-' + ack + '.pdf', source:'Uploaded', actor:me, time:'Just now', sizeKB:120 });
      c.activity.push({ type:'system', actor:me, text:xsub.type + ' submitted to the department on ' + xsub.submittedOn + ' via ' + xsub.mode + ' (' + ack + '). The original due date applies until an outcome is recorded.', time:'Just now' });
      logAudit('Extension Submitted', c.ref + ': ' + ack + '.');
      state.extModal = null;
      render(); return true;
    }
    if (action === 'save-ext-outcome'){
      if (!can('ext.record')) return true;
      var xo = findExt(c, target.getAttribute('data-ext'));
      var outcome = qv('ext-outcome');
      var granted = isoToDisplay(qv('ext-granted'));
      if ((outcome === 'Granted' || outcome === 'Partially Granted') && !granted){ window.alert('Enter the granted date.'); return true; }
      xo.status = outcome; xo.history.push({ s:outcome, by:me, on:todayStr() });
      if (outcome === 'Granted' || outcome === 'Partially Granted'){
        xo.grantedDate = granted;
        if (xo.type.indexOf('Adjournment') === 0){
          c.hearingDate = granted;
          c.activity.push({ type:'system', actor:me, text:'Personal hearing adjourned to ' + granted + ' (' + outcome + ').', time:'Just now' });
        } else {
          if (!c.originalDue) c.originalDue = c.due;
          c.due = granted;
          c.internalDueDate = computeInternalDueDate(granted);
          c.escAck = false;
          evaluateEscalation(c);
          c.activity.push({ type:'system', actor:me, text:'Extension ' + outcome.toLowerCase() + ': due date moved from ' + c.originalDue + ' to ' + granted + '. Aging, escalation and Calendar updated.', time:'Just now' });
        }
        c.documents.push({ id:'doc' + (c.documents.length + 1), name:'Extension-Order-' + c.ref.replace(/[\/]/g,'-') + '.pdf', source:'Uploaded', actor:me, time:'Just now', sizeKB:90 });
      } else {
        c.activity.push({ type:'system', actor:me, text:xo.type + ': ' + outcome + '. The original due date ' + c.due + ' stands.', time:'Just now' });
      }
      logAudit('Extension Outcome', c.ref + ': ' + outcome + (granted && outcome.indexOf('Granted') >= 0 ? ' to ' + granted : '') + '.');
      notify('Extension outcome on ' + c.ref + ': ' + outcome + (xo.grantedDate ? ' (new date ' + xo.grantedDate + ')' : '') + '.', c.id, c.assignedTo);
      state.extModal = null;
      render(); return true;
    }

    // ---- Financial data upload and reconciliation (6.19)
    if (action === 'open-upload-modal'){
      if (!can('data.upload')) return true;
      state.uploadModal = { template:target.getAttribute('data-template') || 'sales', gstin:target.getAttribute('data-gstin') || '', fy:target.getAttribute('data-fy') || '2025-26' };
      render(); return true;
    }
    if (action === 'close-upload-modal' || action === 'reject-upload'){
      if (action === 'reject-upload') logAudit('Data Upload Rejected', 'Upload of ' + findDataTemplate(state.uploadModal.template).name + ' rejected by user.');
      state.uploadModal = null; render(); return true;
    }
    if (action === 'download-data-template'){
      var dt = findDataTemplate(target.getAttribute('data-template'));
      downloadCSV('gst-radar-template-' + dt.key + '-v' + dt.version + '.csv', [dt.columns, dt.sample]);
      logAudit('Export', dt.name + ' template downloaded.');
      return true;
    }
    if (action === 'download-error-report'){
      var res = state.uploadModal.result;
      downloadCSV('gst-radar-upload-errors.csv', [['Row','Column','Error']].concat(res.errors.map(function(e){ return [e.row, e.col, e.msg]; })));
      return true;
    }
    if (action === 'accept-upload'){
      var um = state.uploadModal, r = um.result;
      var gsel = um.gstinSel, entity, gstinVal;
      if (gsel.indexOf('ALL|') === 0){ gstinVal = 'ALL'; entity = gsel.slice(4); } else { gstinVal = gsel; entity = (findGstin(gsel) || {}).entity; }
      var prev = FIN_DATASETS.filter(function(d){ return d.template === um.template && d.gstin === gstinVal && d.fy === um.fySel && d.period === um.periodSel; });
      prev.forEach(function(d){ d.superseded = true; d.status = 'Superseded'; });
      var ver = prev.reduce(function(m, d){ return Math.max(m, d.version); }, 0) + 1;
      FIN_DATASETS.push({ id:'ds' + (FIN_DATASETS.length + 1) + '-' + Date.now(), template:um.template, entity:entity, gstin:gstinVal, fy:um.fySel, period:um.periodSel, version:ver, rows:r.accepted, warned:0, rejected:r.rejected, status:'Validated', by:me, on:todayStr(), superseded:false });
      logAudit('Data Uploaded', findDataTemplate(um.template).name + ' v' + ver + ' for ' + (gstinVal === 'ALL' ? entity : gstinVal) + ', FY ' + um.fySel + ' (' + r.accepted + ' rows accepted, ' + r.rejected + ' rejected).');
      state.uploadModal = null;
      render(); return true;
    }
    if (action === 'archive-dataset'){
      if (!can('data.delete')) return true;
      var dsId = target.getAttribute('data-ds');
      var di = FIN_DATASETS.findIndex(function(d){ return d.id === dsId; });
      if (di >= 0 && window.confirm('Remove this data set? Data sets already used in a prepared response are archived rather than deleted.')){
        var dsr = FIN_DATASETS[di];
        dsr.superseded = true; dsr.status = 'Archived';
        logAudit('Data Archived', findDataTemplate(dsr.template).name + ' v' + dsr.version + ' (' + dsr.gstin + ', FY ' + dsr.fy + ') archived.');
        render();
      }
      return true;
    }
    if (action === 'export-datasets'){
      downloadCSV('gst-radar-financial-data.csv', [['Template','Entity','GSTIN','FY','Period','Version','Rows','Status','Uploaded By','Uploaded On']].concat(FIN_DATASETS.filter(function(d){ return inScope(d.entity); }).map(function(d){ return [findDataTemplate(d.template).name, d.entity, d.gstin, d.fy, d.period, d.version, d.rows, d.status, d.by, d.on]; })));
      logAudit('Export', 'Financial Data Repository exported to Excel.');
      return true;
    }
    if (action === 'run-recon'){
      if (!can('data.reconcile')) return true;
      var used = templatesForNotice(c.code).map(function(t){ var d = latestDataset(t.key, c.gstin, c.entity, c.financialYear); return d ? t.name + ' v' + d.version : null; }).filter(Boolean).join(', ');
      c.recon = { used:used, lines:reconLines(c) };
      c.activity.push({ type:'system', actor:me, text:'Reconciliation run for ' + c.code + ' using ' + used + '.', time:'Just now' });
      logAudit('Reconciliation Run', c.ref + ' using ' + used + '.');
      render(); return true;
    }
    if (action === 'prepare-response' || action === 'download-annexure'){
      if (!c.recon) return true;
      Array.prototype.slice.call(document.querySelectorAll('[data-role="recon-reason"]')).forEach(function(el){ c.recon.lines[Number(el.getAttribute('data-i'))].reason = el.value; });
      Array.prototype.slice.call(document.querySelectorAll('[data-role="recon-explain"]')).forEach(function(el){ c.recon.lines[Number(el.getAttribute('data-i'))].explain = el.value.trim(); });
      var annexRows = [['Line','Per Books / Uploaded','Per Returns / Notice','Difference','Reason Code','Explanation']].concat(c.recon.lines.map(function(l){ return [l.item, l.books, l.returns, l.books - l.returns, l.reason || '', l.explain || '']; }));
      var annexName = 'Annexure-Reconciliation-' + c.ref.replace(/[\/]/g,'-') + '.xlsx';
      if (action === 'download-annexure'){
        downloadCSV(annexName.replace('.xlsx', '.csv'), annexRows);
        logAudit('Download', 'Reconciliation annexure downloaded for ' + c.ref + '.');
        return true;
      }
      if (!c.documents.some(function(d){ return d.name === annexName; })){
        c.documents.push({ id:'doc' + (c.documents.length + 1), name:annexName, source:'Generated', actor:me, time:'Just now', sizeKB:48 });
      }
      var tmpl = templateForCase(c);
      var lines = c.recon.lines.map(function(l, i){ return (i + 1) + '. ' + l.item + ': per books ' + inr(l.books).replace('&#8377;','Rs ') + ', per returns/notice ' + inr(l.returns).replace('&#8377;','Rs ') + ', difference ' + inr(l.books - l.returns).replace('&#8377;','Rs ') + (l.reason ? ' — ' + l.reason : '') + (l.explain ? '. ' + l.explain : '') + '.'; }).join('\n');
      c.replyDraft = 'To,\nThe Jurisdictional GST Officer, ' + c.state + '\n\nSubject: Reply to ' + c.code + ' dated ' + c.issued + ' — ' + c.noticeType + ' (GSTIN: ' + c.gstin + ', DIN ' + c.din + ')\n\nSir/Madam,\n\n' + (tmpl ? tmpl.body + '\n\n' : '') + 'Our reconciliation of the books of account with the returns and the notice, based on ' + c.recon.used + ', is summarised below and detailed in ' + annexName + ' enclosed:\n\n' + lines + '\n\n[AI-assisted narrative — review every figure and explanation before filing.]\n\nRegards,\n' + c.entity;
      c.replyDraftSaved = false;
      c.activity.push({ type:'system', actor:me, text:'Response prepared from reconciliation; ' + annexName + ' added to All Documents and figures inserted into the Draft Reply.', time:'Just now' });
      logAudit('Response Prepared', c.ref + ' draft reply generated from ' + c.recon.used + '.');
      render(); return true;
    }

    // ---- Users, roles and permissions (6.21)
    if (action === 'open-access-modal'){ if (!can('admin.users')) return true; state.accessModal = { user:target.getAttribute('data-user') }; render(); return true; }
    if (action === 'close-access-modal'){ state.accessModal = null; render(); return true; }
    if (action === 'save-access'){
      if (!can('admin.users')) return true;
      var u = USERS.filter(function(x){ return x.name === target.getAttribute('data-user'); })[0];
      var newRole = qv('access-role');
      var all = q('access-all').checked;
      var ents = Array.prototype.slice.call(document.querySelectorAll('[data-role="access-entity"]:checked')).map(function(el){ return el.value; });
      if (!all && !ents.length){ window.alert('Choose All Entities or at least one entity.'); return true; }
      var activeAdmins = USERS.filter(function(x){ return x.role === 'Admin' && x.status === 'active'; });
      if (u.role === 'Admin' && newRole !== 'Admin' && activeAdmins.length <= 1){ window.alert('At least one active Admin must remain. Assign another Admin first.'); return true; }
      var before = u.role + ' / ' + u.scope;
      u.role = newRole; u.scope = all ? 'All Entities' : ents.join('; ');
      logAudit('Access Changed', u.name + ': ' + before + ' → ' + u.role + ' / ' + u.scope + '.');
      state.accessModal = null;
      render(); return true;
    }
    if (action === 'export-access-review'){
      downloadCSV('gst-radar-access-review.csv', [['Name','Email','Role','Data Scope','Status','Permissions']].concat(USERS.map(function(x){ var r = findRoleByName(x.role); return [x.name, x.email, x.role, x.scope, x.status, r ? Object.keys(r.perms).filter(function(k){ return r.perms[k]; }).join('; ') : '']; })));
      logAudit('Export', 'Access Review report exported.');
      return true;
    }
    if (action === 'select-role'){ state.selectedRoleKey = target.getAttribute('data-role-key'); state.rolesDirty = false; render(); return true; }
    if (action === 'open-role-modal'){ if (!can('admin.roles')) return true; state.roleModal = { clone:target.getAttribute('data-clone') }; render(); return true; }
    if (action === 'close-role-modal'){ state.roleModal = null; render(); return true; }
    if (action === 'save-new-role'){
      var rn = qv('role-name');
      if (!rn){ window.alert('Role name is required.'); return true; }
      if (findRoleByName(rn)){ window.alert('A role named "' + rn + '" already exists.'); return true; }
      var src = findRole(target.getAttribute('data-clone'));
      var key = 'custom-' + rn.toLowerCase().replace(/[^a-z0-9]+/g,'-');
      var perms = {};
      if (src) Object.keys(src.perms).forEach(function(k){ perms[k] = src.perms[k]; }); else perms = permSet(['reports.view','masters.view','audit.view']);
      ROLES.push({ key:key, name:rn, system:false, desc:qv('role-desc') || (src ? 'Cloned from ' + src.name + '.' : 'Custom role.'), perms:perms });
      logAudit('Role Created', 'Role "' + rn + '" created' + (src ? ' from ' + src.name : '') + '.');
      state.roleModal = null; state.selectedRoleKey = key;
      render(); return true;
    }
    if (action === 'save-role-perms'){
      var role = findRole(target.getAttribute('data-role-key'));
      if (!role || role.system) return true;
      var beforeN = Object.keys(role.perms).filter(function(k){ return role.perms[k]; }).length;
      var np = {};
      Array.prototype.slice.call(document.querySelectorAll('[data-perm]')).forEach(function(el){ if (el.checked) np[el.getAttribute('data-perm')] = true; });
      if (np['data.upload'] || np['data.delete'] || np['data.reconcile']) np['data.view'] = true;
      if (np['masters.edit'] || np['gstin.manage']) np['masters.view'] = true;
      role.perms = np; state.rolesDirty = false;
      logAudit('Role Updated', 'Role "' + role.name + '" permissions saved (' + beforeN + ' → ' + Object.keys(np).length + ' permissions).');
      render(); return true;
    }
    if (action === 'delete-role'){
      var dr = findRole(target.getAttribute('data-role-key'));
      if (!dr || dr.system) return true;
      if (USERS.some(function(x){ return x.role === dr.name; })){ window.alert('Reassign this role\'s users before deleting it.'); return true; }
      if (window.confirm('Delete role "' + dr.name + '"?')){
        ROLES.splice(ROLES.indexOf(dr), 1);
        if (state.role === dr.key) state.role = 'admin';
        state.selectedRoleKey = 'preparer';
        logAudit('Role Deleted', 'Role "' + dr.name + '" deleted.');
        render();
      }
      return true;
    }

    // ---- Entity-wise escalation (6.26)
    if (action === 'save-esc-rules'){
      if (!can('admin.escalation')) return true;
      CASES.forEach(function(x){ x.internalDueDate = computeInternalDueDate(x.due); evaluateEscalation(x); });
      state.escSaved = true;
      logAudit('Master Updated', 'Escalation Rules saved: default ' + ESC_DEFAULT.pastDue + 'd past due / ' + ESC_DEFAULT.dueSoon + 'd due soon; ' + ENTITIES.map(function(e){ var r = escRuleFor(e); return e + ' ' + r.pastDue + 'd/' + r.dueSoon + 'd (' + (r.source.indexOf('Custom') >= 0 ? 'custom' : 'inherited') + ')'; }).join('; ') + '. Active cases re-evaluated.');
      render(); return true;
    }
    return false;
  }

  function handleV17Change(ev){
    var el = ev.target, role = el.getAttribute('data-role');
    if (role === 'custom-role-switch'){ if (el.value){ closeAllModals(); state.role = el.value; render(); } return true; }
    if (el.getAttribute('data-live') === 'forum' && state.forumModal){
      state.forumModal.type = qv('forum-type');
      state.forumModal.to = role === 'forum-to' ? el.value : null;
      render(); return true;
    }
    if (el.getAttribute('data-live') === 'upload' && state.uploadModal){
      state.uploadModal.template = el.value; state.uploadModal.result = null;
      render(); return true;
    }
    if (el.hasAttribute('data-perm')){ state.rolesDirty = true; return true; }
    var escScope = el.getAttribute('data-esc');
    if (escScope){
      var field = el.getAttribute('data-field');
      state.escSaved = false;
      if (escScope === 'buffer'){ state.internalBuffer = Number(el.value) || 0; return true; }
      if (escScope === 'default'){ ESC_DEFAULT[field] = el.type === 'number' ? (Number(el.value) || 0) : el.value; return true; }
      var entity = escScope.slice(7);
      if (field === 'inherit'){
        if (el.checked) ESC_ENTITY[entity] = { inherit:true };
        else { var d = ESC_DEFAULT; ESC_ENTITY[entity] = { inherit:false, pastDue:d.pastDue, unchanged:d.unchanged, dueSoon:d.dueSoon, l1:d.l1, l2Days:d.l2Days, l2:d.l2 }; }
        render(); return true;
      }
      ESC_ENTITY[entity][field] = el.type === 'number' ? (Number(el.value) || 0) : el.value;
      return true;
    }
    if (role === 'up-file' && state.uploadModal){
      var file = el.files && el.files[0];
      if (!file) return true;
      var um = state.uploadModal;
      um.template = qv('up-template'); um.gstinSel = qv('up-gstin'); um.fySel = qv('up-fy'); um.periodSel = qv('up-period'); um.gstin = um.gstinSel; um.fy = um.fySel;
      var reader = new FileReader();
      reader.onload = function(e){
        um.result = validateDataFile(findDataTemplate(um.template), parseCSV(String(e.target.result)));
        if (um.result.fatal) logAudit('Data Upload Rejected', findDataTemplate(um.template).name + ': ' + um.result.fatal);
        render();
      };
      reader.readAsText(file);
      return true;
    }
    return false;
  }

  // ---- @-mention popup for the Activity composer (no re-render while typing)
  function closeMentionPop(){ var p = document.querySelector('.mention-pop'); if (p) p.parentNode.removeChild(p); }
  function updateMentionPop(box){
    closeMentionPop();
    var before = box.value.slice(0, box.selectionStart);
    var m = before.match(/@([A-Za-z. ]{0,20})$/);
    if (!m) return;
    var c = findCase(box.getAttribute('data-case'));
    var term = m[1].toLowerCase();
    var users = taggableUsers(c).filter(function(u){ return u.name.toLowerCase().indexOf(term) === 0 || u.name.toLowerCase().indexOf(' ' + term) >= 0 || !term; });
    var pop = document.createElement('div');
    pop.className = 'mention-pop';
    pop.style.left = '0px'; pop.style.top = (box.offsetHeight + 4) + 'px';
    pop.innerHTML = users.length
      ? users.map(function(u){ return '<button type="button" data-action="mention-pick" data-name="' + u.name + '">' + u.name + ' <span class="sub">' + u.role + ' &middot; ' + u.scope + '</span></button>'; }).join('')
      : '<div class="none">No matching user with access to ' + c.entity + '</div>';
    box.parentNode.appendChild(pop);
  }

  function render(){
    if (state.view === 'login'){
      document.getElementById('app').innerHTML = renderLogin();
      return;
    }
    refreshDerived();
    // A view the current role is not allowed to see falls back to the Dashboard (FR-RBAC-6).
    var navItem = navItemFor(state.view);
    if (navItem && !navAllowed(navItem)) state.view = 'dashboard';
    var mainHtml;
    if (state.view === 'queue') mainHtml = renderQueue();
    else if (state.view === 'detail') mainHtml = renderDetail();
    else if (state.view === 'consent') mainHtml = renderConsent();
    else if (state.view === 'templates') mainHtml = renderTemplates();
    else if (state.view === 'audit') mainHtml = renderAuditLog();
    else if (state.view === 'calendar') mainHtml = renderCalendar();
    else if (state.view === 'reports') mainHtml = renderReports();
    else if (state.view === 'admin') mainHtml = renderAdmin();
    else if (state.view === 'roles') mainHtml = renderRoles();
    else if (state.view === 'escalation') mainHtml = renderEscalation();
    else if (state.view === 'notifications') mainHtml = renderNotificationSettings();
    else if (state.view === 'dashconfig') mainHtml = renderDashboardConfig();
    else if (state.view === 'data') mainHtml = renderDataHub();
    else if (state.view.indexOf('m-') === 0) mainHtml = renderMasterPage(state.view);
    else if (state.view === 'outlook') mainHtml = renderOutlook();
    else if (state.view === 'list') mainHtml = renderList();
    else mainHtml = renderDashboard();

    var crumbItem = navItemFor(state.view);
    var crumb = '';
    if (crumbItem && state.view !== 'dashboard'){
      crumb = '<div class="breadcrumb no-print">' + crumbItem.group + ' &rsaquo; ' + (state.view === 'detail' ? '<span>' + crumbItem.label + '</span> &rsaquo; <b>' + (findCase(state.selectedId) || {}).ref + '</b>' : '<b>' + crumbItem.label + '</b>') + '</div>';
    }
    // Preserve an unsent remark across re-renders so the @-mention popup and other actions don't wipe it.
    var oldRemark = document.querySelector('[data-role="remark-input"]');
    var remarkDraft = oldRemark ? { caseId: oldRemark.getAttribute('data-case'), text: oldRemark.value } : null;
    document.getElementById('app').innerHTML =
      '<div class="shell">' + renderSidebar() + '<div class="content">' + renderTopbar() + '<main>' + crumb + mainHtml + '</main></div></div>';
    var newRemark = document.querySelector('[data-role="remark-input"]');
    if (newRemark && remarkDraft && remarkDraft.caseId === newRemark.getAttribute('data-case')) newRemark.value = remarkDraft.text;
  }

  document.getElementById('app').addEventListener('click', function(ev){
    var target = ev.target.closest('[data-action]');
    if (target && state.notifDropdownOpen && target.getAttribute('data-action') !== 'toggle-notif'){
      state.notifDropdownOpen = false;
    }
    if (!target) return;
    var action = target.getAttribute('data-action');
    var id = target.getAttribute('data-id');
    if (target.classList.contains('modal-backdrop') && ev.target.closest('.modal-card')) return;

    if (action === 'toggle-notif'){ state.notifDropdownOpen = !state.notifDropdownOpen; render(); return; }
    if (action === 'save-notif-prefs'){ state.notifPrefsSaved = true; render(); return; }
    if (action === 'save-dashboard-config'){
      if (!can('admin.dashboard')) return;
      state.dashboardConfigSaved = true;
      logAudit('Master Updated', 'Dashboard Configuration visibility settings saved.');
      render();
      return;
    }
    if (action === 'login'){ state.view = 'dashboard'; render(); return; }
    if (action === 'logout'){ state.view = 'login'; state.selectedId = null; render(); return; }
    if (action === 'noop') return;
    if (action === 'nav' || action === 'open-case' || action === 'back-to-list' || action === 'set-role' || action === 'kpi-drill') closeAllModals();
    if (action === 'nav'){ state.view = target.getAttribute('data-view'); state.selectedId = null; render(); return; }
    if (action === 'open-case'){
      state.view = 'detail'; state.selectedId = id;
      var openedCase = findCase(id);
      if (openedCase) openedCase.isNew = false;
      render();
      return;
    }
    if (action === 'back-to-list'){ state.view = 'list'; state.selectedId = null; render(); return; }
    if (action === 'set-role'){ state.role = target.getAttribute('data-role'); render(); return; }
    if (handleV17Action(action, target, id)) return;

    if (action === 'advance-status'){
      var c = findCase(id);
      if (!c) return;
      var idx = STATUS_ORDER.indexOf(c.status);
      if (c.status === 'responded' && !can('case.close')) return;
      if (c.status !== 'responded' && !can('case.advance')) return;
      var next = STATUS_ORDER[idx+1];
      if (!next) return;
      c.status = next;
      var stKey = next === 'in_progress' ? 'progress' : next;
      var actor = currentActorLabel();
      c.activity.push({ type:'status', st:stKey, actor:actor, text:'Status changed to ' + STATUS_LABEL[next] + ' by ' + actor + '.', time:'Just now' });
      if (next === 'closed'){
        c.closedOn = todayStr();
        c.closureHistory.push({ event:'Closed', date:c.closedOn, actor:actor, reason:'', remarks:'' });
        c.tags.forEach(function(t){ if (t.status === 'open'){ t.status = 'auto-closed'; } });
        notify(c.ref + ' was closed by ' + currentUserName() + '.', c.id, c.assignedTo);
      }
      logAudit('Status Change', c.ref + ' moved to ' + STATUS_LABEL[next] + '.');
      render();
      return;
    }
    if (action === 'acknowledge-escalation'){
      var c2 = findCase(id);
      if (!c2 || !can('case.ackEscalation')) return;
      c2.escalated = false;
      c2.escAck = true;
      c2.activity.push({ type:'system', actor:currentActorLabel(), text:'Escalation acknowledged by ' + currentActorLabel() + '.', time:'Just now' });
      render();
      return;
    }
    if (action === 'sort-demand'){
      var demKey = target.getAttribute('data-key');
      if (state.demandSort.key === demKey) state.demandSort.dir = state.demandSort.dir === 'asc' ? 'desc' : 'asc';
      else { state.demandSort.key = demKey; state.demandSort.dir = 'asc'; }
      render();
      return;
    }
    if (action === 'sort-docs'){
      var dkey = target.getAttribute('data-key');
      if (state.docSort.key === dkey) state.docSort.dir = state.docSort.dir === 'asc' ? 'desc' : 'asc';
      else { state.docSort.key = dkey; state.docSort.dir = 'asc'; }
      render();
      return;
    }
    if (action === 'view-document'){
      state.docViewModal = { caseId: target.getAttribute('data-id'), docId: target.getAttribute('data-doc') };
      render();
      return;
    }
    if (action === 'close-doc-modal'){ state.docViewModal = null; render(); return; }
    if (action === 'merge-documents'){
      var cMerge = findCase(id);
      if (!cMerge) return;
      var checked = Array.prototype.slice.call(document.querySelectorAll('[data-role="doc-checkbox"]:checked'));
      var selectedIds = checked.map(function(el){ return el.getAttribute('data-doc'); });
      var selectedDocs = cMerge.documents.filter(function(d){ return selectedIds.indexOf(d.id) >= 0; });
      if (selectedDocs.length < 2){ window.alert('Select at least two documents to merge.'); return; }
      var totalSize = selectedDocs.reduce(function(sum, d){ return sum + (d.sizeKB || 0); }, 0);
      var compressedSize = Math.round(totalSize * 0.55);
      var mergedDoc = { id:'doc' + (cMerge.documents.length + 1), name:'Merged-' + selectedDocs.length + '-Documents-' + cMerge.id + '.pdf', source:'Uploaded', actor:currentActorLabel(), time:'Just now', sizeKB: compressedSize, merged:true };
      cMerge.documents.push(mergedDoc);
      logAudit('Documents Merged', selectedDocs.length + ' documents merged and compressed for ' + cMerge.id + ' (' + totalSize + ' KB &rarr; ' + compressedSize + ' KB).');
      state.mergeDocsModal = { resultText: 'Merged ' + selectedDocs.length + ' documents into ' + mergedDoc.name + '. Combined size ' + totalSize + ' KB compressed to ' + compressedSize + ' KB (' + Math.round((1 - compressedSize/totalSize)*100) + '% smaller) &mdash; useful when a GST Portal upload has a file-size limit.' };
      render();
      return;
    }
    if (action === 'close-merge-modal'){ state.mergeDocsModal = null; render(); return; }
    if (action === 'attach-document'){
      var cAtt = findCase(id);
      if (!cAtt) return;
      cAtt.documents.push({ id:'doc' + (cAtt.documents.length + 1), name:'Attachment-' + (cAtt.documents.length + 1) + '.pdf', source:'Uploaded', actor:currentActorLabel(), time:'Just now', sizeKB: 260 });
      logAudit('Document Attached', 'Document attached to ' + cAtt.id + '.');
      render();
      return;
    }
    if (action === 'save-consultant'){
      if (!can('case.consultant')) return;
      var cCon = findCase(id);
      var conSelect = document.querySelector('[data-role="consultant-select"]');
      if (!cCon || !conSelect) return;
      var conRow = findConsultant(conSelect.value);
      var newName = conRow ? conRow.name : null;
      if (cCon.assignedConsultant !== newName){
        cCon.assignedConsultant = newName;
        logAudit('Consultant Assigned', cCon.id + ' referred to ' + (newName || 'no consultant') + '.');
      }
      render();
      return;
    }
    if (action === 'toggle-translation'){
      var cTr = findCase(id);
      if (!cTr) return;
      cTr.showTranslation = !cTr.showTranslation;
      render();
      return;
    }
    if (action === 'mark-reviewed'){
      var c3 = findCase(id);
      if (!c3) return;
      c3.aiReviewed = true;
      render();
      return;
    }
    if (action === 'add-remark'){
      var c4 = findCase(id);
      if (!c4) return;
      var box = document.querySelector('[data-role="remark-input"]');
      var val = box ? box.value.trim() : '';
      if (!val || !can('case.remark')) return;
      // Resolve @mentions against known users (longest names first), then check each is taggable (BR-19).
      var mentioned = [];
      USERS.slice().sort(function(a,b){ return b.name.length - a.name.length; }).forEach(function(u){
        if (val.indexOf('@' + u.name) >= 0 && mentioned.indexOf(u) < 0) mentioned.push(u);
      });
      if (mentioned.length && !can('case.tag')){ window.alert('Your role cannot tag users.'); return; }
      var allowed = taggableUsers(c4);
      var blocked = mentioned.filter(function(u){ return allowed.indexOf(u) < 0; });
      if (blocked.length){ window.alert(blocked.map(function(u){ return u.name; }).join(', ') + ': no access to ' + c4.entity + ' (or inactive / yourself), so cannot be tagged. Tagging never grants access.'); return; }
      if (mentioned.length > 10){ window.alert('Tag up to 10 users per remark.'); return; }
      var actionBy = isoToDisplay(qv('tag-action-by'));
      var safe = escHtml(val);
      c4.activity.push({ type:'remark', actor:currentActorLabel(), text:safe, time:'Just now' });
      mentioned.forEach(function(u){
        c4.tags.push({ id:'tg' + Date.now() + '-' + u.name.replace(/\W/g,''), user:u.name, by:currentActorLabel(), time:'Just now', remark:safe, actionBy:actionBy, status:'open' });
        notify(currentUserName() + ' tagged you on ' + c4.ref + (actionBy ? ' (action needed by ' + actionBy + ')' : '') + ': ' + safe.replace('@' + u.name, '').trim(), c4.id, u.name);
      });
      if (mentioned.length) logAudit('Users Tagged', c4.ref + ': ' + mentioned.map(function(u){ return u.name; }).join(', ') + ' tagged.');
      box.value = '';
      closeMentionPop();
      render();
      return;
    }
    if (action === 'renew-consent'){
      if (!can('gstin.manage')) return;
      var gstin = target.getAttribute('data-gstin');
      CASES.forEach(function(c){ if (c.gstin === gstin){ c.consentExpiry = '20 Aug 2026'; c.consentStatus = 'active'; } });
      var rgRow = findGstin(gstin);
      if (rgRow){ rgRow.consentExpiry = '20 Aug 2026'; rgRow.consentStatus = 'active'; }
      logAudit('Consent Renewed', 'GSP consent renewed for GSTIN ' + gstin + '.');
      render();
      return;
    }
    if (action === 'add-gstin'){ if (!can('gstin.manage')) return; state.gstinModal = { mode:'add' }; render(); return; }
    if (action === 'edit-gstin'){ if (!can('gstin.manage')) return; state.gstinModal = { mode:'edit', gstin:target.getAttribute('data-gstin') }; render(); return; }
    if (action === 'close-gstin-modal'){ state.gstinModal = null; render(); return; }
    if (action === 'delete-gstin'){
      if (!can('gstin.manage')) return;
      var delGstin = target.getAttribute('data-gstin');
      if (window.confirm('Remove GSTIN ' + delGstin + ' from the repository? This does not delete existing cases already linked to it.')){
        var idx = GSTIN_REGISTRY.findIndex(function(g){ return g.gstin === delGstin; });
        if (idx >= 0) GSTIN_REGISTRY.splice(idx, 1);
        logAudit('GSTIN Deleted', 'GSTIN ' + delGstin + ' removed from the registry.');
        render();
      }
      return;
    }
    if (action === 'save-gstin'){
      if (!can('gstin.manage')) return;
      var entityVal = document.querySelector('[data-role="gstin-entity"]').value;
      var numberVal = document.querySelector('[data-role="gstin-number"]').value.trim().toUpperCase();
      var stateVal = document.querySelector('[data-role="gstin-state"]').value;
      var emailVal = document.querySelector('[data-role="gstin-email"]').value.trim();
      var mobileVal = document.querySelector('[data-role="gstin-mobile"]').value.trim();
      var addressVal = document.querySelector('[data-role="gstin-address"]').value.trim();
      var notifyVal = Array.prototype.slice.call(document.querySelectorAll('[data-role="gstin-notify"]:checked')).map(function(el){ return el.value; });
      if (!numberVal){ return; }
      var editingGstin = target.getAttribute('data-gstin');
      if (editingGstin){
        var row = findGstin(editingGstin);
        row.entity = entityVal; row.state = stateVal; row.email = emailVal; row.mobile = mobileVal; row.unitAddress = addressVal; row.notifyUsers = notifyVal;
        logAudit('GSTIN Updated', 'GSTIN ' + editingGstin + ' details updated.');
      } else {
        GSTIN_REGISTRY.push({ gstin:numberVal, entity:entityVal, state:stateVal, email:emailVal, mobile:mobileVal, notifyUsers:notifyVal, unitAddress:addressVal, consentExpiry:'—', consentStatus:'soon' });
        logAudit('GSTIN Added', 'GSTIN ' + numberVal + ' (' + stateVal + ', ' + entityVal + ') added to the registry.');
      }
      state.gstinModal = null;
      render();
      return;
    }
    if (action === 'sort-cases'){
      var ckey = target.getAttribute('data-key');
      if (state.caseSort.key === ckey) state.caseSort.dir = state.caseSort.dir === 'asc' ? 'desc' : 'asc';
      else { state.caseSort.key = ckey; state.caseSort.dir = 'asc'; }
      render();
      return;
    }
    if (action === 'sort-gstin'){
      var key = target.getAttribute('data-key');
      if (state.gstinSort.key === key) state.gstinSort.dir = state.gstinSort.dir === 'asc' ? 'desc' : 'asc';
      else { state.gstinSort.key = key; state.gstinSort.dir = 'asc'; }
      render();
      return;
    }
    if (action === 'mark-all-read'){
      NOTIFICATIONS.forEach(function(n){ n.unread = false; });
      render();
      return;
    }
    if (action === 'ai-chat-quick'){
      var c5 = findCase(id);
      if (!c5) return;
      var q5 = target.getAttribute('data-q');
      c5.aiChat.push({ from:'user', text:q5 });
      c5.aiChat.push({ from:'ai', text: simulateAIReply(q5, c5) });
      render();
      return;
    }
    if (action === 'ai-chat-send'){
      var c6 = findCase(id);
      if (!c6) return;
      var input = document.querySelector('[data-role="ai-chat-input"]');
      var q6 = input ? input.value.trim() : '';
      if (!q6) return;
      c6.aiChat.push({ from:'user', text:q6 });
      c6.aiChat.push({ from:'ai', text: simulateAIReply(q6, c6) });
      render();
      return;
    }
    if (action === 'generate-draft'){
      var c7 = findCase(id);
      if (!c7) return;
      var tmpl = templateForCase(c7);
      var body = tmpl ? tmpl.body : 'With reference to the above notice, we submit our response as follows:\n\n[Response details to be added]';
      c7.replyDraft = 'To,\nThe Jurisdictional GST Officer, ' + c7.state + '\n\nSubject: Reply to ' + c7.code + ' dated ' + c7.issued + ' — ' + c7.noticeType + ' (GSTIN: ' + c7.gstin + ')\n\nSir/Madam,\n\n' + body + '\n\nRegards,\n' + c7.entity + (tmpl ? '\n\n[Drafted from Reply Template: ' + tmpl.name + ']' : '');
      c7.replyDraftSaved = false;
      render();
      return;
    }
    if (action === 'save-draft'){
      var c8 = findCase(id);
      if (!c8) return;
      var ta = document.querySelector('[data-role="reply-draft"]');
      c8.replyDraft = ta ? ta.value : c8.replyDraft;
      c8.replyDraftSaved = true;
      render();
      return;
    }
    if (action === 'open-add-case-modal'){ if (!can('case.create')) return; state.addCaseModal = {}; render(); return; }
    if (action === 'close-add-case-modal'){ state.addCaseModal = null; render(); return; }
    if (action === 'save-new-case'){
      if (!can('case.create')) return;
      function val(role){ var el = document.querySelector('[data-role="' + role + '"]'); return el ? el.value : ''; }
      var gstinVal = val('case-gstin'), codeVal = val('case-code'), issuedVal = val('case-issued').trim(), dueVal = val('case-due').trim();
      if (!gstinVal || !codeVal || !issuedVal || !dueVal){ window.alert('GSTIN, Notice Type, Date of Issue and Due Date are required.'); return; }
      var fieldErr = caseFieldError({ issued:issuedVal, due:dueVal, ref:val('case-ref').trim() });
      if (fieldErr){ window.alert(fieldErr); return; }
      var consultantSel = val('case-consultant');
      var consultantRow = findConsultant(consultantSel);
      var newCase = createCaseFromFields({
        gstin: gstinVal, code: codeVal, docType: val('case-doctype'), forumLevel: val('case-forum'),
        financialYear: val('case-fy').trim(), issued: issuedVal, due: dueVal, section: val('case-section').trim(),
        din: val('case-din').trim(), personalHearing: document.querySelector('[data-role="case-ph"]').checked,
        hearingDate: val('case-hearing-date').trim(), assignedTo: val('case-assigned'),
        consultant: consultantRow ? consultantRow.name : null, status: val('case-status'),
        tax: val('case-tax'), interest: val('case-interest'), penalty: val('case-penalty'), ask: val('case-ask').trim(),
        ref: val('case-ref').trim()
      });
      CASES.push(newCase);
      logAudit('Case Added', newCase.ref + ' added manually.');
      state.addCaseModal = null;
      render();
      return;
    }
    if (action === 'open-bulk-upload-modal'){ state.bulkUploadModal = {}; render(); return; }
    if (action === 'close-bulk-upload-modal'){ state.bulkUploadModal = null; render(); return; }
    if (action === 'download-case-template'){
      downloadCSV('gst-radar-case-bulk-upload-template.csv', bulkTemplateRows());
      logAudit('Export', 'Bulk case upload template downloaded.');
      return;
    }
    if (action === 'open-assign-modal'){ if (!can('case.assign')) return; state.assignModal = { caseId: target.getAttribute('data-id') }; render(); return; }
    if (action === 'close-assign-modal'){ state.assignModal = null; render(); return; }
    if (action === 'save-assign'){
      if (!can('case.assign')) return;
      var acId = target.getAttribute('data-id');
      var acCase = findCase(acId);
      var acSelect = document.querySelector('[data-role="assign-select"]');
      if (!acCase || !acSelect) return;
      var newAssignee = acSelect.value;
      if (acCase.assignedTo !== newAssignee){
        var oldAssignee = acCase.assignedTo;
        acCase.assignedTo = newAssignee;
        acCase.activity.push({ type:'system', actor:currentActorLabel(), text:'Reassigned from ' + oldAssignee + ' to ' + newAssignee + ' by ' + currentActorLabel() + '.', time:'Just now' });
        logAudit('Assignment', acCase.id + ' reassigned from ' + oldAssignee + ' to ' + newAssignee + '.');
      }
      state.assignModal = null;
      render();
      return;
    }
    if (action === 'add-template'){ if (!can('masters.edit')) return; state.templateModal = { mode:'add' }; render(); return; }
    if (action === 'edit-template'){ if (!can('masters.edit')) return; state.templateModal = { mode:'edit', id: target.getAttribute('data-id') }; render(); return; }
    if (action === 'close-template-modal'){ state.templateModal = null; render(); return; }
    if (action === 'delete-template'){
      if (!can('masters.edit')) return;
      var delTid = target.getAttribute('data-id');
      if (window.confirm('Delete this reply template?')){
        var tidx = REPLY_TEMPLATES.findIndex(function(t){ return t.id === delTid; });
        if (tidx >= 0) REPLY_TEMPLATES.splice(tidx, 1);
        logAudit('Template Deleted', 'Reply template ' + delTid + ' deleted.');
        render();
      }
      return;
    }
    if (action === 'save-template'){
      if (!can('masters.edit')) return;
      var tName = document.querySelector('[data-role="tmpl-name"]').value.trim();
      var tCode = document.querySelector('[data-role="tmpl-code"]').value.trim();
      var tCategory = document.querySelector('[data-role="tmpl-category"]').value.trim();
      var tBody = document.querySelector('[data-role="tmpl-body"]').value.trim();
      if (!tName) return;
      var editingTid = target.getAttribute('data-id');
      if (editingTid){
        var trow = findTemplate(editingTid);
        trow.name = tName; trow.noticeCode = tCode; trow.category = tCategory; trow.body = tBody;
        logAudit('Template Updated', 'Reply template "' + tName + '" updated.');
      } else {
        REPLY_TEMPLATES.push({ id:'t' + (REPLY_TEMPLATES.length + 1), name:tName, noticeCode:tCode, category:tCategory, body:tBody });
        logAudit('Template Added', 'Reply template "' + tName + '" added.');
      }
      state.templateModal = null;
      render();
      return;
    }
    if (action === 'open-master-modal'){ if (!can('masters.edit')) return; state.masterModal = { type: target.getAttribute('data-type') }; render(); return; }
    if (action === 'close-master-modal'){ state.masterModal = null; render(); return; }
    if (action === 'save-master'){
      if (!can('masters.edit')) return;
      var mType = target.getAttribute('data-type');
      function val(role){ var el = document.querySelector('[data-role="' + role + '"]'); return el ? el.value.trim() : ''; }
      function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,''); }
      if (mType === 'entity'){
        var newEntity = val('master-name');
        if (!newEntity) return;
        ENTITIES.push(newEntity);
        logAudit('Master Added', 'Entity "' + newEntity + '" added.');
      } else if (mType === 'notice'){
        var nCode = val('master-code'), nDesc = val('master-desc');
        if (!nCode) return;
        NOTICE_TYPES.push({ code:nCode, desc:nDesc });
        logAudit('Master Added', 'Notice type ' + nCode + ' added.');
      } else if (mType === 'doctype'){
        var dName = val('master-name'), dDesc = val('master-desc');
        if (!dName) return;
        DOC_TYPES.push({ key:slug(dName), name:dName, desc:dDesc });
        logAudit('Master Added', 'Document type "' + dName + '" added.');
      } else if (mType === 'forum'){
        var fName = val('master-name'), fShort = val('master-short'), fAuth = val('master-authority'), fSec = val('master-section'), fNote = val('master-desc');
        if (!fName || !fShort) return;
        FORUM_LEVELS.push({ key:slug(fShort), short:fShort, name:fName, authority:fAuth, section:fSec, note:fNote });
        logAudit('Master Added', 'Litigation forum level "' + fName + '" added.');
      } else if (mType === 'reason'){
        var rCat = val('master-short'), rCode = val('master-code'), rLabel = val('master-name');
        if (!rCode || !rLabel) return;
        REASON_CODES.push({ category:rCat, code:rCode, label:rLabel });
        logAudit('Master Added', 'Reason code ' + rCode + ' (' + rCat + ') added.');
      } else if (mType === 'consultant'){
        var cnName = val('master-name'), cnType = val('master-short'), cnEmail = val('master-authority'), cnPhone = val('master-section'), cnSpec = val('master-desc');
        if (!cnName) return;
        CONSULTANTS.push({ id:'c' + (CONSULTANTS.length + 1), name:cnName, type:cnType || 'Consultant', email:cnEmail, phone:cnPhone, specialization:cnSpec });
        logAudit('Master Added', 'Consultant/Auditor "' + cnName + '" added.');
      }
      state.masterModal = null;
      render();
      return;
    }
    if (action === 'export-cases'){
      downloadCSV('gst-radar-cases.csv', caseCsvRows(visibleCases().filter(passesFilters)));
      logAudit('Export', 'Cases list exported to Excel.');
      return;
    }
    if (action === 'export-gstins'){
      var search = (state.filters.gstinSearch || '').toLowerCase();
      var gList = GSTIN_REGISTRY.filter(function(g){
        if (!search) return true;
        return (g.gstin + ' ' + g.entity + ' ' + g.state).toLowerCase().indexOf(search) >= 0;
      });
      gList = sortRows(gList, state.gstinSort.key, state.gstinSort.dir);
      var gHeader = ['GSTIN','Entity','State','Registered Email','Registered Mobile','Notify Users','Unit Address','Consent Expiry','Consent Status'];
      var gRows = gList.map(function(g){
        return [g.gstin, g.entity, g.state, g.email, g.mobile, g.notifyUsers.join('; '), g.unitAddress, g.consentExpiry, g.consentStatus];
      });
      downloadCSV('gst-radar-gstins-repository.csv', [gHeader].concat(gRows));
      logAudit('Export', 'GSTINs Repository exported to Excel.');
      return;
    }
    if (action === 'export-queue'){
      downloadCSV('gst-radar-my-queue.csv', caseCsvRows(queueCases()));
      logAudit('Export', 'My Queue exported to Excel.');
      return;
    }
    if (action === 'export-aging'){
      var repEnt = state.filters.reportsEntity || 'all';
      downloadCSV('gst-radar-case-aging.csv', caseCsvRows(visibleCases().filter(function(c){ return c.status !== 'closed' && (repEnt === 'all' || c.entity === repEnt); })));
      logAudit('Export', 'Case Aging report exported to Excel.');
      return;
    }
    if (action === 'print-case'){
      window.print();
      logAudit('Print', 'Case summary printed for ' + (state.selectedId || '') + '.');
      return;
    }
    if (action === 'cal-prev'){
      state.calMonth -= 1;
      if (state.calMonth < 0){ state.calMonth = 11; state.calYear -= 1; }
      render();
      return;
    }
    if (action === 'cal-next'){
      state.calMonth += 1;
      if (state.calMonth > 11){ state.calMonth = 0; state.calYear += 1; }
      render();
      return;
    }
    if (action === 'cal-today'){
      state.calYear = TODAY.year; state.calMonth = TODAY.month;
      render();
      return;
    }
    if (action === 'cal-view'){
      state.calView = target.getAttribute('data-view');
      render();
      return;
    }
    if (action === 'goto-calendar'){
      state.calYear = Number(target.getAttribute('data-year'));
      state.calMonth = Number(target.getAttribute('data-month'));
      state.view = 'calendar';
      render();
      return;
    }
    if (action === 'close-event-modal'){
      state.eventModal = null;
      render();
      return;
    }
    if (action === 'save-event'){
      var titleInput = document.querySelector('[data-role="event-title-input"]');
      var noteInput = document.querySelector('[data-role="event-note-input"]');
      var titleVal = titleInput ? titleInput.value.trim() : '';
      if (!titleVal || !state.eventModal) return;
      CUSTOM_EVENTS.push({ year:state.eventModal.year, month:state.eventModal.month, day:state.eventModal.day, title:titleVal, note:noteInput ? noteInput.value.trim() : '' });
      state.eventModal = null;
      render();
      return;
    }
    if (action === 'export-calendar'){
      downloadCSV('gst-radar-calendar-' + MONTHS[state.calMonth] + '-' + state.calYear + '.csv', monthCsvRows(state.calYear, state.calMonth, state.filters.calEntity, state.filters.calMyOnly));
      logAudit('Export', 'Calendar for ' + MONTHS[state.calMonth] + ' ' + state.calYear + ' exported to Excel.');
      return;
    }
    if (action === 'download-draft'){
      var c9 = findCase(id);
      if (!c9) return;
      var ta9 = document.querySelector('[data-role="reply-draft"]');
      var content9 = ta9 ? ta9.value : c9.replyDraft;
      if (!content9) return;
      downloadText(c9.id + '-draft-reply.txt', content9);
      logAudit('Download', 'Draft reply downloaded for ' + c9.id + '.');
      return;
    }
    if (action === 'print-draft'){
      var c10 = findCase(id);
      if (!c10) return;
      var ta10 = document.querySelector('[data-role="reply-draft"]');
      var content10 = ta10 ? ta10.value : c10.replyDraft;
      if (!content10) return;
      var esc = String(content10).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      var w = window.open('', '_blank');
      if (w){
        w.document.write('<html><head><title>' + c10.id + ' - Draft Reply</title><style>body{font-family:Georgia,serif;white-space:pre-wrap;padding:48px;line-height:1.7;font-size:14px;}</style></head><body>' + esc + '</body></html>');
        w.document.close();
        w.focus();
        w.print();
      }
      logAudit('Print', 'Draft reply printed for ' + c10.id + '.');
      return;
    }
  });

  document.getElementById('app').addEventListener('keydown', function(ev){
    if (ev.key === 'Escape') closeMentionPop();
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('tr[data-action="open-case"]')){
      ev.preventDefault();
      ev.target.click();
    }
    if (ev.key === 'Enter' && ev.target.matches('[data-role="ai-chat-input"]')){
      ev.preventDefault();
      var sendBtn = document.querySelector('[data-action="ai-chat-send"]');
      if (sendBtn) sendBtn.click();
    }
  });

  document.getElementById('app').addEventListener('change', function(ev){
    if (handleV17Change(ev)) return;
    var filter = ev.target.getAttribute('data-filter');
    if (filter){ state.filters[filter] = ev.target.value; render(); return; }
    var toggle = ev.target.getAttribute('data-toggle');
    if (toggle){ state.filters[toggle] = ev.target.checked; render(); return; }
    var pref = ev.target.getAttribute('data-pref');
    if (pref){
      var parts = pref.split(':');
      var prefRow = NOTIF_PREFS.filter(function(p){ return p.key === parts[0]; })[0];
      if (prefRow){ prefRow[parts[1]] = ev.target.checked; state.notifPrefsSaved = false; render(); }
      return;
    }
    var widgetKey = ev.target.getAttribute('data-widget');
    if (widgetKey){
      if (!can('admin.dashboard')) return;
      var widgetRow = DASHBOARD_WIDGETS.filter(function(w){ return w.key === widgetKey; })[0];
      if (widgetRow){ widgetRow.visible = ev.target.checked; state.dashboardConfigSaved = false; render(); }
      return;
    }
    if (ev.target.getAttribute('data-role') === 'bulk-upload-input'){
      var file = ev.target.files && ev.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e){
        var rows = parseCSV(String(e.target.result));
        rows.shift(); // drop header row
        var added = 0, skipped = 0;
        rows.forEach(function(row){
          var fields = rowToCaseFields(row);
          if (!fields.gstin || !fields.code || !fields.issued || !fields.due || caseFieldError(fields)){ skipped++; return; }
          CASES.push(createCaseFromFields(fields));
          added++;
        });
        logAudit('Bulk Upload', added + ' case(s) added from uploaded template' + (skipped ? ', ' + skipped + ' row(s) skipped (missing required fields)' : '') + '.');
        state.bulkUploadModal = { result: added + ' case(s) added successfully.' + (skipped ? ' ' + skipped + ' row(s) were skipped because GSTIN, Notice Type Code, Date of Issue or Due Date was missing, Date of Issue was later than the Due Date or in the future, or the Reference ID was already in use.' : '') };
        render();
      };
      reader.readAsText(file);
      return;
    }
  });

  document.getElementById('app').addEventListener('input', function(ev){
    if (ev.target.getAttribute('data-role') === 'remark-input'){ updateMentionPop(ev.target); return; }
    var searchKey = ev.target.getAttribute('data-search');
    if (!searchKey) return;
    var cursorPos = ev.target.selectionStart;
    state.filters[searchKey] = ev.target.value;
    render();
    var newInput = document.querySelector('[data-search="' + searchKey + '"]');
    if (newInput){ newInput.focus(); newInput.setSelectionRange(cursorPos, cursorPos); }
  });

  document.getElementById('app').addEventListener('dblclick', function(ev){
    var cell = ev.target.closest('.cal-cell[data-year]');
    if (!cell) return;
    state.eventModal = { year: Number(cell.getAttribute('data-year')), month: Number(cell.getAttribute('data-month')), day: Number(cell.getAttribute('data-day')) };
    render();
  });

  CASES.forEach(function(c){ computeAging(c); evaluateEscalation(c, true); });
  render();
})();
</script>
</body>
</html>
